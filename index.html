  // A stroke that thins from the path's end back to its start: After

  // Saber beams between the pots and the cells: a Bezier path drawn on by

  function buildBeams(comp, R, rel) {
    var i, k, BM = DATA.beam;

      var pre = "function c01(x){return x<0?0:(x>1?1:x);}\nvar f = time - " + f0 + "; var tr = " + bm.travel + ";\n" +
        "var u = c01(f / tr); var head = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;\n" +
        "var tail = Math.min(head, c01((f - tr * 0.6) / (tr * 0.4 + " + BM.hold + " + " + (BM.fade * 0.5) + ")));\n";
      var fade = "(1 - c01((f - tr - " + BM.hold + ") / " + BM.fade + "))";

      var g = group(L, "Beam");
      var p = g.addProperty("ADBE Vector Shape - Group");
      var sh = new Shape();
      sh.vertices = [[z[0], z[1]], [z[6], z[7]]];
      sh.outTangents = [[z[2] - z[0], z[3] - z[1]], [0, 0]];
      sh.inTangents = [[0, 0], [z[4] - z[6], z[5] - z[7]]];
      sh.closed = false;
      p.property("ADBE Vector Shape").setValue(sh);

      tp.property("ADBE Vector Trim Start").expression = pre + "tail * 100;";
      tp.property("ADBE Vector Trim End").expression = pre + "head * 100;";
      // The white core first: it sits in front.
      for (k = BM.passes.length - 1; k >= 0; k--) {

      P(L, "ADBE Opacity").expression = pre + "100 * " + fade + ";";
      trim(L, f0, f0 + dur);
      saberPath(comp, (bm.up ? "Up " : "Down ") + (i + 1) + " " + DATA.pots.items[bm.pot].name, sh, f0, f0 + dur, pre + "head * 100;", pre + "tail * 100;");

  function buildRespin(comp, R, rel) {
    var hs = R.holdspin, i;
    for (i = 0; i < hs.tease.length; i++) {
      var te = hs.tease[i];
      var S = frameAt(comp, "FX Tease Cell", DATA.cellW * 0.96, DATA.cellH * 0.96, { stroke: 0.05, round: 0.1, fill: [1, 0.55, 0.08], fillOp: 14, glow: 0.3, glowI: 1.6, color: [1, 0.67, 0.16] }, "Tease Cell", [te.x, te.y], rel(te.start - 0.05), rel(te.end + 0.25));
      S.blendingMode = BlendingMode.ADD;
      fadeKeys(S, rel(te.start - 0.05), rel(te.end + 0.25), 0.2, 0.25);
    }
    for (i = 0; i < hs.hits.length; i++) {
      var h = hs.hits[i], t = rel(h.t);
      ring(comp, [h.x, h.y], t, DATA.cellW * (h.special ? 1.3 : 0.95), h.color);
      coinPop(comp, h, t, 0.35, h.lab, "Coin Lands");
    }
  }
  function buildCollect(comp, R, rel) {
    var C = R.collect, i;
    var target = [DATA.machineX, DATA.hold ? DATA.hold.barY : H * 0.15];
    for (i = 0; i < C.items.length; i++) {
      var it = C.items[i], a = rel(it.at), b = rel(it.arrive);
      ring(comp, [it.x, it.y], a, DATA.cellW * 0.9, it.color);
      coinPop(comp, it, a, b + 0.1 - a, null, "Coin Collect");
      // Collected: the cell dims for the rest of the feature.
      frameAt(comp, "FX Collected", DATA.cellW * 0.96, DATA.cellH * 0.96, { round: 0.12, fill: [0, 0, 0], fillOp: 45 }, "Collected", [it.x, it.y], b, comp.duration);
      // The value flies to the total on the frame.
      var T = text(comp, "Collect " + it.text, it.text, Math.round(DATA.cellH * 0.22), [it.x, it.y]);
      var p0 = P(T, "ADBE Position").value;
      var mid = [(p0[0] + target[0]) / 2, Math.min(p0[1], target[1]) - DATA.cellH * 0.6];
      ease1(P(T, "ADBE Position"), [[a, p0], [(a + b) / 2, mid], [b, [target[0], target[1] + DATA.cellH * 0.08]]]);
      P(T, "ADBE Scale").expression = EASE_LIB + "var k = c01((time - " + a + ") / " + (b - a) + "); var s = 100 * (1.1 - 0.35 * k); [s, s];";
      glow(T, DATA.cellW * 0.12, 1.3);
      trim(T, a, b + 0.02);
    }
  }
  function buildGrand(comp, R, rel) {
    var G = R.grand;
    var a = rel(G.start), b = rel(G.end);
    var cx = W / 2, cy = H * 0.44;
    darkLayer(comp, a, b, 70);
    rays(comp, [cx, cy], a, b, H * 1.8, 17, 60);
    ring(comp, [cx, cy], a, H * 0.8, [1, 0.7, 0.1]);
    emitters(comp, R, "under", ["grand"]);
    var T = titleLayer(comp, "grand", [cx, cy - H * 0.06], a, b, W * 0.9);
    if (T) fadeKeys(T, a, b, 0.05, 0.5);
    winCtrl(comp, G.keys, -R.start, "GRAND CTRL");
    var od = counters(comp, [cx, cy + H * 0.14], Math.round(DATA.titlePx * 0.66), G.amount, rel(G.countEnd), "GRAND CTRL");
    fadeKeys(od, a + 0.2, b, 0.3, 0.5);
  }

  // A box with a win title takes the whole screen: its name and JACKPOT,
  // the amount counting up on its own control, the Grand's particles.
  function buildJackpotShows(comp, R, rel) {
    var cx = W / 2, cy = H * 0.44, k;
    for (k = 0; k < R.jpShows.length; k++) {
      var S = R.jpShows[k];
      var a = rel(S.start), b = rel(S.end);
      darkLayer(comp, a, b, 70);
      rays(comp, [cx, cy], a, b, H * 1.8, 17, 60);
      ring(comp, [cx, cy], a, H * 0.8, S.color);
      if (k === 0) emitters(comp, R, "under", ["jackpot"]);
      var T = titleLayer(comp, S.title, [cx, cy - H * 0.06], a, b, W * 0.9);
      if (T) fadeKeys(T, a, b, 0.05, 0.5);
      var ctrl = S.name + " JACKPOT " + (k + 1) + " CTRL";
      winCtrl(comp, S.keys, -R.start, ctrl);
      var od = counters(comp, [cx, cy + H * 0.14], Math.round(DATA.titlePx * 0.66), S.amount, rel(S.countEnd), ctrl);
      fadeKeys(od, a + 0.2, b, 0.3, 0.5);
    }
  }

  function buildBanner(comp, R, rel) {
    var bn = R.banner;
    var a = rel(bn.start), b = rel(bn.end);
    var cx = W / 2, cy = H * 0.44;
    darkLayer(comp, a, b, 60);
    rays(comp, [cx, cy], a, b, H * 1.6, 14.3, 55);
    ring(comp, [cx, cy], a, H * 0.7, DATA.accent);
    var T = titleLayer(comp, bn.kind, [cx, bn.kind === "freespins" || bn.kind === "retrigger" || bn.kind === "holdspin" ? cy - H * 0.13 : cy], a, b, W * 0.9);
    if (T) fadeKeys(T, a, b, 0.05, 0.5);
    if (bn.kind === "holdspin") {
      var sub = text(comp, "Respins", bn.freeSpins + " RESPINS", Math.round(DATA.titlePx * 0.62), [cx, cy + H * 0.1], [1, 0.55, 0.15]);
      P(sub, "ADBE Scale").expression = EASE_LIB + "var s = 10 + 90 * outElastic(c01((time - " + (a + 0.35) + ") / 0.8)); [s, s];";
      fadeKeys(sub, a, b, 0.05, 0.5);
    } else if (bn.kind === "freespins" || bn.kind === "retrigger") {
      var num = text(comp, bn.kind === "retrigger" ? "Extra Spins" : "Free Spins Count", (bn.kind === "retrigger" ? "+" : "") + bn.freeSpins, Math.round(DATA.titlePx * 1.5), [cx, cy + H * 0.12], [1, 0.55, 0.15]);
      P(num, "ADBE Scale").expression = EASE_LIB + "var s = 10 + 90 * outElastic(c01((time - " + (a + 0.35) + ") / 0.8)); [s, s];";
      fadeKeys(num, a, b, 0.05, 0.5);
    } else if (R.amount > 0 && R.meter) {
      winCtrl(comp, countKeys(rel(R.meter.start), rel(R.meter.end), R.amount));
      var od = counters(comp, [cx, cy + H * 0.16], Math.round(DATA.titlePx * 0.6), R.amount);
      fadeKeys(od, a, b, 0.3, 0.5);
    }
  }

  // The turning part of the wheel as one placeholder comp: your face art,
  // the segments, an icon layer per segment that has one and a text layer
  // per label (font, size and colour editable), and the hub when it turns.
  function wheelDiscPH() {
    var WH = DATA.wheel, D = WH.disc;
    return ph("Wheel Disc", "Wheel", D, D, DUR + 2, function (c) {
      var i, L;
      var part = function (key, rel2) {
        var src = imagePH(key, "Wheel", rel2);
        return src ? inst(c, src, key, [D / 2, D / 2]) : null;
      };
      part("Wheel Face", DATA.assets.wheelFace);
      part("Wheel Segments", DATA.assets.wheelSegments);
      for (i = 0; i < WH.icons.length; i++) {
        var ic = WH.icons[i], ia = ic.a * Math.PI / 180;
        var isrc = imagePH("Wheel Icon " + pad2(ic.k + 1), "Wheel", ic.file);
        if (!isrc) continue;
        L = inst(c, isrc, "Icon " + pad2(ic.k + 1), [D / 2 + Math.cos(ia) * ic.r, D / 2 + Math.sin(ia) * ic.r]);
        P(L, "ADBE Rotate Z").setValue(ic.a + 90);
      }
      for (i = 0; i < WH.labels.length; i++) {
        var lb = WH.labels[i], la = lb.a * Math.PI / 180;
        L = c.layers.addText(lb.text);
        L.name = "Label " + (i + 1) + " " + lb.text;
        var prop = L.property("ADBE Text Properties").property("ADBE Text Document");
        var td = prop.value;
        td.fontSize = lb.px;
        td.applyFill = true;
        td.fillColor = WH.fill;
        td.applyStroke = true;
        td.strokeColor = WH.stroke;
        td.strokeWidth = Math.max(1, Math.round(lb.px * 0.22));
        td.strokeOverFill = false;
        td.justification = ParagraphJustification.CENTER_JUSTIFY;
        try { td.font = WH.font; } catch (e) { try { td.font = DATA.font; } catch (e2) {} }
        prop.setValue(td);
        textExpr(L, null, undefined, "Wheel Font");
        // Turn about the middle of the text, reading outwards.
        P(L, "ADBE Anchor Point").setValue([0, -lb.px * 0.36]);
        pos(L, [D / 2 + Math.cos(la) * lb.r, D / 2 + Math.sin(la) * lb.r]);
        P(L, "ADBE Rotate Z").setValue(lb.a);
      }
      if (WH.hubSpins) {
        part("Wheel Hub", DATA.assets.wheelHub);
        part("Wheel Center", DATA.assets.wheelCenter);
      }
    });
  }

  function buildWheel(comp, R, rel) {
    var w = R.wheel, WH = DATA.wheel, i, s;
    var inA = rel(w.inStart), inB = rel(w.inEnd), outA = rel(w.outStart), outB = rel(w.outEnd);
    var cx = WH.cx, cy = WH.cy, Rr = WH.R;
    // A wheel that is already on screen (the wheel game) skips its intro.
    var tInE = w.cont ? "var tIn = 1;" : "var tIn = c01((time - " + inA + ") / " + Math.max(0.01, inB - inA) + ");";
    var envExpr = EASE_LIB + tInE + " var tOut = c01((time - " + outA + ") / " + Math.max(0.01, outB - outA) + ");\n" +
      "var env = (1 - Math.pow(1 - tIn, 3)) * (1 - inCubic(tOut));\n";
    var dk = solid(comp, [0, 0, 0], "Darken", W * 1.2, H * 1.2, [W / 2, H / 2]);
    P(dk, "ADBE Opacity").expression = envExpr + "env * " + (DATA.game === "wheel" ? 30 : 86) + " * " + ctrl("Dim %") + " / 100;";
    var ry = inst(comp, raysPH(false), "Light Rays", [cx, cy]);
    if (ry) {
      ry.blendingMode = BlendingMode.ADD;
      spin(ry, 8.6);
      var rys = r4(100 * Rr * 3.4 / ry.source.width);
      P(ry, "ADBE Scale").setValue([rys, rys]);
      fxScale(ry);
      fxOpacity(ry, envExpr, "env * 45");
    }
    var rig = comp.layers.addNull(comp.duration);
    rig.name = "WHEEL RIG";
    pos(rig, [cx, cy]);
    var part = function (key, rel2, xy) { return inst(comp, imagePH(key, "Wheel", rel2), key, xy || [cx, cy]); };
    var disc = inst(comp, wheelDiscPH(), "Wheel Disc", [cx, cy]);
    var kids = [];
    // A glowing wedge on a segment of the disc, turning with it.
    var wedgeOn = function (segIdx, name, opExpr) {
      var seg = WH.segDeg, a0 = -90 + segIdx * seg + w.angle0, pts = [[cx, cy]], ang;
      for (s = 0; s <= 12; s++) {
        ang = (a0 + seg * s / 12) * Math.PI / 180;
        pts.push([cx + Math.cos(ang) * Rr, cy + Math.sin(ang) * Rr]);
      }
      var wedge = shapeLayer(comp, name);
      var wg = group(wedge);
      path(wg, pts, true);
      fill(wg, [1, 1, 1], 100);
      wedge.blendingMode = BlendingMode.ADD;
      // It blinks, and fades out with the rest of the wheel.
      P(wedge, "ADBE Opacity").expression = envExpr + opExpr;
      wedge.parent = disc;
      trim(wedge, null, outB);
    };
    if (disc) {
      var rot = P(disc, "ADBE Rotate Z");
      rot.setValue(w.angle0);
      setKeys(rot, w.keys, -R.start);
      kids.push(disc);
      wedgeOn(w.segment, w.noWin ? "No Win Segment" : "Winning Segment", "var a = time - " + rel(w.spinEnd) + "; env * (a < 0 ? 0 : Math.min(1, a / 0.3) * (30 + 25 * Math.sin(time * 10)));");
      for (i = 0; i < w.agains.length; i++) {
        var ag = w.agains[i];
        wedgeOn(ag.segment, "Spin Again Segment " + (i + 1), "var a = time - " + rel(ag.at - 0.2) + "; env * ((a < 0 || time > " + rel(ag.until) + ") ? 0 : Math.min(1, a / 0.3) * (30 + 25 * Math.sin(time * 10)));");
      }
    }
    // A hub that stays still sits over the turning disc.
    if (!WH.hubSpins) {
      var hub = part("Wheel Hub", DATA.assets.wheelHub);
      if (hub) kids.push(hub);
      var ctr = part("Wheel Center", DATA.assets.wheelCenter);
      if (ctr) kids.push(ctr);
    }
    var ringL = part("Wheel Ring", DATA.assets.wheelRing);
    if (ringL) kids.push(ringL);
    var wa = part("Wheel Bulbs A", DATA.assets.wheelBulbsA);
    var wb = part("Wheel Bulbs B", DATA.assets.wheelBulbsB);
    if (wa) { wa.blendingMode = BlendingMode.ADD; P(wa, "ADBE Opacity").expression = "Math.floor(time * (time > " + rel(w.spinEnd) + " ? 8 : 3)) % 2 == 0 ? 100 : 15;"; kids.push(wa); }
    if (wb) { wb.blendingMode = BlendingMode.ADD; P(wb, "ADBE Opacity").expression = "Math.floor(time * (time > " + rel(w.spinEnd) + " ? 8 : 3)) % 2 == 1 ? 100 : 15;"; kids.push(wb); }
    // The pointer pivots where the art says; it reads the disc's rotation
    // (pegs bend it) and, after an almost-slip, springs back past straight.
    var ptr = part("Wheel Pointer", DATA.assets.wheelPointer, WH.pivot);
    if (ptr) {
      var pw = ptr.source.width, ph2 = ptr.source.height;
      P(ptr, "ADBE Anchor Point").setValue(WH.anchor || [pw / 2, ph2 * 0.2]);
      pos(ptr, WH.pivot);
      ptr.name = "Pointer";
      var kick = w.kick ? "var k = time - " + rel(w.kick[0]) + "; if (k > 0 && k <= 1.6) d += " + w.kick[1] + " * Math.exp(-k * 5.5) * Math.sin(k * Math.PI * 2 * 2.2);\n" : "";
      P(ptr, "ADBE Rotate Z").expression = "var th = thisComp.layer(\"Wheel Disc\").transform.rotation.value; var seg = " + WH.segDeg + ", P = " + WH.pointerAngle + ";\n" +
        "var u = (((th - P) / seg) % 1 + 1) % 1; var w = 0.22, mx = " + WH.max + ", b = 0.3;\n" +
        "var d = u > 1 - w ? -mx * ((u - (1 - w)) / w) : (u < b ? -mx * Math.pow(1 - u / b, 2) * Math.cos(u / b * Math.PI * 1.5) : 0);\n" +
        kick + "P + d;";
      kids.push(ptr);
    }
    for (i = 0; i < kids.length; i++) {
      kids[i].parent = rig;
      P(kids[i], "ADBE Opacity").expression = envExpr + "env * 100;";
    }
    P(rig, "ADBE Scale").expression = EASE_LIB + tInE + " var tOut = c01((time - " + outA + ") / " + Math.max(0.01, outB - outA) + ");\n" +
      "var s = (0.3 + 0.7 * outBack(tIn)) * (1 - 0.35 * inCubic(tOut)) * 100; [s, s];";
    var title = titleLayer(comp, "wheel", WH.title, inA, rel(w.spinStart) + 1.1, W * 0.9);
    if (title) fadeKeys(title, inA, rel(w.spinStart) + 1.1, 0.3, 0.5);
    var pa = rel(w.prizeStart), PL = WH.plaque, Rp = PL[2];
    var plaqueSrc = plaquePH("Prize Plaque", Rp * 1.5, Rp * 0.62, Rp * 0.15, 96, [0.91, 0.73, 0.29], Math.max(2, Rp * 0.03));
    // The plaques are boxes: the plaque, its label (and the counter with the
    // WIN CTRL it reads) in one comp that pops and fades as one.
    var plW = Rp * 1.5 * 1.3, plH = Rp * 0.62 * 1.7;
    // Spin again: the plaque says so between the spins.
    for (i = 0; i < w.agains.length; i++) {
      var g2 = w.agains[i], ga = rel(g2.at), gb = rel(g2.until);
      var ab = boxComp(comp, RBASE + " Spin Again " + (i + 1), PL[0], PL[1], plW, plH, ga, gb);
      inst(ab.comp, plaqueSrc, "Spin Again Plaque", ab.at([PL[0], PL[1]]), ga, gb);
      var albl = text(ab.comp, "Spin Again Label", g2.label, Math.round(Rp * 0.2), ab.at([PL[0], PL[1]]));
      trim(albl, ga, gb);
      P(ab.layer, "ADBE Scale").expression = EASE_LIB + "var k = outBack(c01((time - " + ga + ") / 0.4)) * 100 * c01((" + gb + " - time) / 0.3); [k, k];";
      ring(comp, [PL[0], PL[1]], ga, Rp * 1.3, DATA.accent);
    }
    if (!w.noWin) {
      emitters(comp, R, "under", ["wheel"]);
      ring(comp, [PL[0], PL[1]], pa, Rp * 1.6, DATA.accent);
    }
    // The plaque leaves before the next spin in the wheel game.
    var pEnd = Math.min(outB, rel(w.plaqueEnd));
    var pb = boxComp(comp, RBASE + " Prize Plaque", PL[0], PL[1], plW, plH, pa, pEnd);
    inst(pb.comp, plaqueSrc, "Prize Plaque", pb.at([PL[0], PL[1]]), pa, pEnd);
    // No win: the label sits in the middle and nothing counts.
    var lbl = text(pb.comp, w.noWin ? "No Win Label" : "Prize Label", w.label, Math.round(Rp * 0.2), pb.at([PL[0], PL[1] - (w.noWin ? 0 : Rp * 0.1)]));
    trim(lbl, pa, pEnd);
    P(pb.layer, "ADBE Scale").expression = EASE_LIB + "var k = outBack(c01((time - " + pa + ") / 0.5)) * 100; [k, k];";
    P(pb.layer, "ADBE Opacity").expression = envExpr + "env * 100 * c01((" + pEnd + " - time) / 0.35);";
    if (w.noWin) return;
    winCtrl(pb.comp, countKeys(rel(w.countStart), rel(w.countEnd), R.amount));
    var od = counters(pb.comp, pb.at([PL[0], PL[1] + Rp * 0.12]), Math.round(Rp * 0.14), R.amount);
    trim(od, pa, pEnd);
  }

  // ---------- sound ----------
  // "SFX": one audio layer per cue at its time, named after the cue and its
  // round and coloured by group. Levels are decibels on the SFX MIX null:
  // Master plus one slider per group; each layer reads its two sliders.
  var fSfx = null;
  function buildSound() {
    var S = DATA.sfx, i;
    if (!S) return null;
    var sc = addComp("SFX" + SUFFIX, W, H, DUR, dir("sound", "Sound", top));
    sc.comment = "Every sound cue on its own layer. Mix with the sliders on SFX MIX; mute, move or swap any cue.";
    if (!fSfx) fSfx = folder("SFX", fShared);
    for (i = S.events.length - 1; i >= 0; i--) {
      var e = S.events[i], g = S.groups[e[2]];
      var it = imp(S.clips[e[1]], fSfx);
      if (!it) continue;
      var L = sc.layers.add(it);
      L.name = e[3];
      L.startTime = e[0];
      try { L.label = g.label; } catch (x) {}
      L.property("ADBE Audio Group").property("ADBE Audio Levels").expression = "var m = thisComp.layer(\"SFX MIX\");\nvar d = m.effect(\"Master (dB)\")(1) + m.effect(\"" + g.name + " (dB)\")(1);\n[d, d];";
    }
    var mix = sc.layers.addNull(DUR);
    mix.name = "SFX MIX";
    slider(mix, "Master (dB)").setValue(S.master);
    for (i = 0; i < S.groups.length; i++) slider(mix, S.groups[i].name + " (dB)").setValue(S.groups[i].db);
    roundMarkers(sc);
    var SL = main.layers.add(sc);
    SL.name = "SFX";
    return SL;
  }

  function buildFormat() {
    W = DATA.W;
    H = DATA.H;
    FPS = DATA.fps;
    DUR = DATA.duration;
    PH = {};
    FOLD = {};
    top = folder(DATA.name + SUFFIX);
    mainName = uniqueName(DATA.name + SUFFIX);
    createMain();
    fPH = folder("Placeholder Comps", top);
    fRounds = folder("Rounds", top);
    // The wheel game has no reels, so no symbol comps.
    if (DATA.game !== "wheel") {
      fSymbols = dir("PH/Symbols", "Symbols", fPH);
      fReels = folder("Reels", top);
      fHold = DATA.hold ? folder("Hold and Spin", fReels) : null;
      buildSymbols();
      buildAtlas();
    }
    buildDigits();
    buildMain();
  }

  if (!app.project) app.newProject();
  proj = app.project;
  app.beginUndoGroup("Build slot animation");
  try {
    fShared = folder("Slot Assets");
    buildFonts();
    var f;
    if (DATA_LIST.length > 1) fShPH = folder("Shared Placeholder Comps");
    for (f = 0; f < DATA_LIST.length; f++) {
      DCW = Math.max(DCW, DATA_LIST[f].cellW || 0);
      DCH = Math.max(DCH, DATA_LIST[f].cellH || 0);
    }
    for (f = 0; f < DATA_LIST.length; f++) {
      DATA = DATA_LIST[f];
      SUFFIX = DATA_LIST.length > 1 ? " " + DATA.W + "x" + DATA.H : "";
      buildFormat();
    }
    main.openInViewer();
  } catch (err) {
    alert("The slot build stopped: " + err.toString() + (err.line ? " (script line " + err.line + ")" : ""));
  }
  app.endUndoGroup();
  // Missing files: a few names, and on a Mac the likely cause when none
  // could be read (macOS asks before an app reads Downloads, Desktop or
  // Documents).
  if (missing.length) {
    var mac = $.os && $.os.indexOf("Mac") >= 0;
    alert(missing.length + " asset file" + (missing.length > 1 ? "s were" : " was") + " not found next to the script:\n" + missing.slice(0, 8).join("\n") + (missing.length > 8 ? "\n..." : "") +
      "\n\nKeep the .jsx next to its \"assets\" folder, unzipped." + (mac ? "\nOn a Mac, if After Effects was refused access to this folder, allow it in System Settings > Privacy & Security > Files and Folders, then run the script again." : ""));
  }

re or clusters), how many symbols pay, and how many scatters trigger a feature.","pay-mode"),"sec:machine/framing":W("machine","Framing","Zoom scales the machine with its pots, title and win meter about their middle: out to fit tall pots, in to fill the screen.","machine-zoom"),"sec:machine/look":W("machine","Look","The theme colours, the title (or your logo) above the machine, the marquee bulbs and the win meter under the reels.","marquee"),"sec:machine/money":W("machine","Money","The bet, the currency sign (none by default) and how many decimals every amount shows. As the bet follows how you typed it: 1 shows whole numbers, 1.00 decimals."),"sec:machine/randomness":W("machine","Randomness","Filler symbols come from a seed, so every render is identical. Shuffle picks a new seed."),"sec:features/pots-above-the-machine":W("features","Pots above the machine","Up to three pots stand on the frame where the title was. Winners beam up into them, and they fire boosters that upgrade cells.","pots"),"sec:features/jackpot-boxes":W("features","Jackpot boxes","Grand, Major, Minor and Mini boxes around the machine, with fixed or running values. A jackpot won lights its box.","jackpots"),"sec:spin/spin-type":W("spin","Spin type","How the reels move: together, staggered, turbo, teasing the last reel, cascading or cell by cell. Point at a card to see it."),"sec:spin/respins":W("spin","Respins","How the empty Hold & Spin cells respin: their direction and the order they stop in."),"sec:spin/reel-order":W("spin","Reel order","Which reel starts and which stops first: left to right, right to left, centre out, outside in, random or your own order.","stop-order"),"sec:spin/motion-curve":W("spin","Motion curve","A reel's speed over its spin, drawn as a graph. The Start, Mid and End sections below shape it."),"sec:spin/start":W("spin","Start","How a reel gets going: a wind-up pull back, an ease in, or instantly.","start-windup"),"sec:spin/mid":W("spin","Mid","The full-speed stretch: how long it spins, how fast, and its motion blur.","blur"),"sec:spin/end":W("spin","End","How a reel lands: bounce, elastic, hard stop or soft, how long it takes and how far it overshoots.","end-bounce"),"sec:spin/reel-timing":W("spin","Reel timing","The delay between one reel starting, or stopping, and the next.","stop-stagger"),"sec:spin/anticipation":W("spin","Anticipation","The tease on a reel that could still trigger: extra time, a slower crawl, a zoom in, and scatters kept lit.","antic-time"),"sec:spin/between-rounds":W("spin","Between rounds","The gap between rounds, and the holds before the first and after the last."),"sec:wins/winning-symbols":W("wins","Winning symbols","How winners celebrate: pop in place, fly to a spot (counting into the win or fusing into one big symbol), or beam to the pots; with the winning lines and the rest dimmed.","winfx-fly"),"sec:wins/win-timing":W("wins","Win timing","How long each kind of win shows, the count-up per big win tier, and the beats of tumbles, multipliers and wilds."),"sec:effects/camera":W("effects","Camera","Every camera move in one place: following the winners of a win that lands on a merge or a win title, pushing in on a teased reel, and on the wheel pointer as it slows. In After Effects the WIN CAMERA and CAMERA nulls do it, scaled by Win Camera % and Zoom %.","win-camera"),"cam-follow":W("effects","Follow the winners","The camera pushes in on the winning symbols and lets go on the merge or as the win title appears. The area frames them all and glides in as they gather, one smooth move; One by one visits each as it lifts, in the Fly order. It runs only on a win that lands on something, a merge into a big symbol (Fly \u203A Fuse) or a win title; a round can pick its own in the round inspector.","win-camera-mode"),"cam-zoom":W("effects","How close","The most the win camera zooms in, as a multiple of the full view. The area frames every winner, so a spread-out win stays wider."),"cam-calm":W("effects","Calm","How slowly the win camera glides. The area: how long it averages its frame over, so it never reacts to one symbol. One by one: how long each glide from winner to winner takes."),"cam-release":W("effects","Zoom out","On the merge: as the symbols fuse. As the title appears: just before the win title, so the title lands as the camera settles. A win with only one of them uses that one."),"cam-kick":W("effects","Release kick","The zoom out overshoots past the full view and settles back, like a breath out; the background grows to keep the screen covered. 0 eases straight out."),"cam-map":W("effects","Camera viewport","While the camera is in, a small map of the whole frame at the top right of the preview outlines the part on screen. Only in the editor: never in the MP4, the still frame or After Effects."),"ri-camera":W("round","Camera for this round","Follows Effects \u203A Camera, or picks Off, The area or One by one for this round alone. It runs only when the round's win lands on a merge or a win title."),"sec:effects/intensity":W("effects","Intensity","How strong each effect is, from payline glow and sparkles to light rays, screen shake, flashes and bloom.","shake"),"sec:effects/explosion-templates":W("effects","Explosion templates","Every particle explosion, playing live. Pick one for each win moment in Win particles."),"sec:effects/titles-and-font":W("effects","Titles and font","The display font for titles, counters and wheel labels, and the words of each feature title."),"sec:wheel/segments":W("wheel","Segments","Clockwise from the top: each segment's fill, icon, label and value, and whether it is a prize, a spin again or no win.","seg-icons"),"sec:wheel/framing":W("wheel","Framing","How the wheel sits on screen: whole, half from below, a close-up or rising in, with its own zoom and centre.","frame-half"),"sec:wheel/pointer":W("wheel","Pointer","Where the pointer sits, its size and art, and how pegs bend it as they pass.","pointer-top"),"sec:wheel/look":W("wheel","Look","The labels' font, colour, size and height, the icons, the centre icon, the hub and which parts show.","label-height"),"sec:wheel/spin":W("wheel","Spin","How many turns it makes, how it lands by default (centre, random, tease, almost slips) and whether values are multiplied by the bet.","wheel-slip"),"sec:sound/sound-track":W("sound","Sound track","Every cue is made in sync with the animation. Set the volume and each group's level; it plays with the preview, goes into the MP4 and ships to After Effects."),"sec:export/output":W("export","Output","The project name, canvas size, frame rate and transparent background for every export."),"sec:export/after-effects-project":W("export","After Effects project","The main export: a zip with a script that rebuilds this animation as an editable After Effects project, in every format you pick. With several formats the art (symbols, particles, pots, titles, the logo) is built once in Shared Placeholder Comps and every format uses it: replace or animate it there and every format follows."),"x-extra":W("export","Extra rows below the play rows","A taller format (9:16, 4:5) can show more rows of symbols under the play rows so the machine fills the screen. They spin and stop with the reels; wins, lines, counts, timing and sound stay on the play rows, so every format is the same animation. The extra rows never show a winning symbol, a special or three alike side by side, nor (for ways, pay anywhere and clusters) what would look like a win; a full-screen win fills them too and they join it, an expanding wild covers them, in a tumble they stay put while the play rows above them tumble, and under a Hold & Spin bonus they stay dimmed. 0 unless you set it; Fill picks as many as fit. Not for Hold & Spin or the wheel.","extra-rows"),"x-fill-format":W("export","Fill the screen","Sets as many extra rows as the format has room for without the machine getting smaller."),"sec:export/quick-preview-mp4":W("export","Quick preview (MP4)","A quick video to share, rendered frame by frame at full resolution, with or without the sound track."),"sec:export/soundtrack-wav":W("export","Soundtrack (WAV)","The whole mix as the preview plays it, for editing the sound elsewhere."),"format-strip":W("export","Formats under the preview","Every format you are likely to export, live at the playhead: 16:9, 9:16, 1:1, 4:5, the Canvas and any other package format, each with its own layout and extra rows on the same timeline. Click one to preview it full size; the card beside it sets its extra rows and whether the After Effects package includes it. Fold it to a bar to give the preview more room.","extra-rows"),"fs-thumb":W("export","Preview this format","Makes it the Canvas: the preview, the MP4 and the still frame use it. A gold +3 means 3 extra rows; a faded picture is not in the After Effects package yet."),"fs-include":W("export","In the After Effects package","Whether the package builds this format: each format gets its own comps, laid out for its size, and the art is shared. Keep at least one."),"tl-length":W("timeline","Animation length","The whole animation, from the first frame to the last. Each round\u2019s block shows how long it runs, and faint lines mark where a 15, 30 or 60 second cut would end, so a piece for TikTok, Reels or Shorts is easy to plan. Shorten a round with its Spin length, or the project\u2019s in Wins \u203A Win timing."),"sec:export/still-frame":W("export","Still frame","The frame under the playhead as a PNG, without the background when Output says transparent."),"sec:export/project-file":W("export","Project file","Everything in one .json file, your images and sounds included, to reopen the exact animation later."),"sec:seq/quick-sequence":W("seq","Quick sequence","Builds a whole run of rounds in one go: warm-up spins, then the finale you pick."),"art-progress":W("bank:all","Your art","How much of this machine is your own art: every piece the project shows (symbols, coins, the particles its moments throw, wheel parts, the background, frame and logo, pots and jackpot boxes when they are on) and how many you have replaced. Click a bar to open that kind. Sounds count apart: yours, off and built-in."),"art-builtin-only":W("bank:all","Built-in only","Hides every piece that is already yours, so what still uses the built-in art stands out before you hand the project over. Click again to see everything."),"sec:bank/scene-art":W("bank:scene","Scene art","The background, a frame overlay and your logo. With the pots and jackpot boxes on, their art follows here."),"sec:bank/symbols":W("bank:symbols","Symbols","Each symbol is fitted to its cell. Role: what it does (point at a role, or at the role chips under the symbols). Low or high pay: a round set to Auto wins with a low-pay symbol on a small win, a high-pay one on a bigger win. Shows up: how often it fills the reels around the wins. Built-in art for roles your set lacks sits after your symbols."),"sec:bank/hold-spin-coins":W("bank:coins","Hold & Spin coins","Their own set, apart from the symbols. Values are in bets and shown on the coin (5 shows $5 at a $1 bet). The jackpot coins (Mini, Minor, Major) win their box. A label is painted on built-in coin art; your art is used as it is. Cash symbols on the slot reels use the regular coin. In After Effects each coin is its own comp."),"sec:bank/particle-art":W("bank:effects","Particle art","The art the win explosions throw: one PNG, several PNGs for an animation (a spinning coin, a flapping banknote), or a sprite sheet. A built-in takes your art from the upload button on its card and keeps its name and every use. Pick which particle each win moment uses in Effects \u203A Win particles. In After Effects each particle is a placeholder comp."),"sec:bank/win-effects":W("bank:effects","Win effects","Light rays, shockwaves, cell frames and coin bursts are drawn live. In After Effects each is a placeholder comp in Placeholder Comps/Effects with an FX CONTROLS layer (size, opacity, colour, motion); drop a prerendered movie into one and every use plays it."),"sec:bank/jackpot-box-art":W("bank:scene","Jackpot box art","Each box is painted in its colour until you give it art. Names, seeds and colours are with the boxes in Features. In After Effects each box is its own placeholder comp."),"sec:bank/pot-art":W("bank:scene","Pot art","Each pot stands on the frame. Which pot is which, its colour and role are with the pots in Features. In After Effects each pot is a placeholder comp in Placeholder Comps/Pots."),"sec:bank/wheel-art":W("bank:wheel","Wheel art","The face turns with the wheel and shows through segments with no colour; the rim frames it; the hub sits in the middle; the pointer hinges near its top. In After Effects each is a placeholder comp in Placeholder Comps/Wheel."),"sec:bank/your-own-sounds":W("bank:sounds","Your own sounds","Your file plays from its start at each cue, at the track volume and its group level. A cue without your file plays its built-in placeholder; a cue turned off is left out of the preview, the MP4, the WAV and After Effects. In After Effects each cue is its own audio layer in the SFX comp."),"sec:bank/my-kit":W("bank:sounds","My kit","The house style most of your machines share, set up once: your sounds, your fonts and your particle art, kept in this browser for every project. Each part saves and goes into a project on its own. Each project keeps its own copy, so a finished project does not change when you update the kit. Export saves the kit as a file for another browser, the other copy of the app or a teammate."),"kit-save-sounds":W("bank:sounds","Save the sounds in my kit","Keeps this project's sound design in your kit: your own files, the cues turned off, the volume and the group levels. Saving again updates it."),"kit-use-sounds":W("bank:sounds","Use the kit's sounds here","Puts your kit's sounds, Off cues and mix into this project, in place of its own (sounds are one set of slots). Undo brings them back."),"kit-del-sounds":W("bank:sounds","Take the sounds out of my kit","Click twice. Projects keep the sounds they have."),"kit-save-fonts":W("bank:fonts","Save the fonts in my kit","Keeps this project's font files in your kit, with the display font and wheel label font when they are among them. A built-in or catalogue font picked in a project stays with that project."),"kit-use-fonts":W("bank:fonts","Use the kit's fonts here","Adds your kit's font files to this project (a font of the same name is replaced; none is removed) and, when the kit has them, makes its display font and wheel label font this project's."),"kit-del-fonts":W("bank:fonts","Take the fonts out of my kit","Click twice. Projects keep their fonts."),"kit-save-particles":W("bank:effects","Save the particle art in my kit","Keeps this project's particle art in your kit: your art for the built-in particles (coin, star, confetti...) and your own particles. Which win moment uses which particle stays with each project."),"kit-use-particles":W("bank:effects","Use the kit's particle art here","Adds your kit's particle art to this project: your art replaces the built-in particles it was made for, everywhere they are used, and your own particles join the list. Nothing is removed."),"kit-del-particles":W("bank:effects","Take the particle art out of my kit","Click twice. Projects keep their particle art."),"kit-auto":W("bank:sounds","Start new projects with it","New projects, presets and the demo come with every part of your kit. Opening a project file keeps what is saved in it."),"kit-export":W("bank:sounds","Export the kit","Saves the whole kit as a .reelkit.json file with its sounds, fonts and art inside. Import it in another browser, in the other copy of the app (each keeps its own kit) or on a teammate's machine."),"kit-import":W("bank:sounds","Import a kit","Opens a .reelkit.json (or an older .soundkit.json) file: the parts it holds replace those parts of your kit; the others stay. Use here puts a part in this project."),"sec:bank/fonts":W("bank:fonts","Fonts","Your fonts come first in the font list. They ship in the After Effects package; install them there."),"sym-w-help":W("bank:symbols","Shows up","How often a symbol fills the reels around the wins, in stages, with its share of them. Only in wins: never as filler, but it still wins when a round picks it. Wilds, scatters and the like only show where a round puts them."),"sym-tier-help":W("bank:symbols","Low or high pay","A round whose symbol is Auto wins with a low-pay symbol on a small win and a high-pay one on a bigger win. Pots that upgrade cells turn them into low-pay symbols. Amounts come from the round, not from this."),"sym-roles-help-normal":W("bank:symbols","Paying symbols","Make the wins, along lines, ways or in clusters. Low or high pay decides which one a round set to Auto wins with.","pay-mode"),"sym-roles-help-wild":W("bank:symbols","Wild","Stands in for any paying symbol to complete a win. A round can make it expand, stick, walk or carry a multiplier.","expand"),"sym-roles-help-scatter":W("bank:symbols","Scatter","Counts anywhere on the reels; enough of them trigger free spins or the bonus. One short is a near miss, teased on the last reel.","scatter-lit"),"sym-roles-help-multiplier":W("bank:symbols","Multiplier","Lands with an x value and flies into the win to multiply it. Without one in your set the machine draws its built-in orb.","mult"),"sym-roles-help-mystery":W("bank:symbols","Mystery","Blocks land, glow and turn over together into one symbol. Without one in your set the machine draws its built-in block.","mystery"),"sym-roles-help-collector":W("bank:symbols","Collector","Gathers the value of every cash coin on the reels into the win. Without one in your set the machine draws its built-in collector.","collector"),"sym-roles-help-bonus":W("bank:symbols","Bonus","Triggers the bonus. A machine without a scatter uses it as its scatter.","bonus"),"sym-roles-help-cash":W("bank:symbols","Cash coin","A coin with a value on the slot reels; a collector gathers them. Its art is the regular coin in Coins.","cash"),"coin-kinds-help-regular":W("bank:coins","Regular coin","Lands and locks with a value in Hold & Spin; on the slot reels it is the cash coin.","holdspin"),"coin-kinds-help-special":W("bank:coins","Special coins","Your own coins with a label and values, placed in the respins of a round."),"coin-kinds-help-jackpot":W("bank:coins","Jackpot coins","Mini, Minor and Major: collecting one wins its jackpot box; a full board wins the Grand.","jackpots"),"coin-kinds-help-empty":W("bank:coins","Empty cell","What a cell shows before a coin lands. Built-in: a dark socket."),"jp-art-names":W("bank:scene","Names on your box art","Writes each box's name on your uploaded art. Turn it off when your art already says GRAND, MAJOR and so on."),"m-beam-curve-arc":W("features","Simple arc beams","Each beam bows out in one smooth curve.","beam-collect"),"m-beam-curve-s":W("features","S-curve beams","Each beam swings out one way, then the other, like a whip.","s-curve"),"m-beam-bend":W("features","Beam bend","How far the beams bow out from a straight line.","beam-bend"),"m-beam-width":W("features","Beam thickness","How thick the trail is next to the head; Taper thins it towards the tail. It leaves the head alone. Thickness and Head size share their units: the same number makes the trail as thick as the head, a comet.","beam-width"),"m-beam-taper":W("features","Beam taper","How much the beams thin from the head back to the tail, like a comet. 0 keeps them even; 1 brings the tail to a point. After Effects gets the same taper on each beam's strokes (Stroke \u203A Taper \u203A Start Width).","beam-taper"),"m-beam-head":W("features","Beam head size","How big the round glowing head is, with its white-hot ball. Thickness sets the trail on its own. In After Effects the glow is the FX Beam Head placeholder and the ball is the Head group in each beam layer.","beam-head"),"m-beam-travel":W("features","Beam travel time","How long a beam takes to reach its pot or cell.","beam-travel"),"m-beam-stagger":W("features","Time between beams","The gap between one beam firing and the next.","beam-stagger"),"spin-type-classic":W("spin","Classic spin","All reels start together and stop one after another in the stop order.","spin-classic"),"spin-type-stagger":W("spin","Staggered start","Reels kick off one after another, like a wave.","spin-stagger"),"spin-type-turbo":W("spin","Turbo spin","A short spin: the reels slam down almost together.","spin-turbo"),"spin-type-tease":W("spin","Tease last reel","The last reel to stop always slows down with an anticipation glow.","spin-tease"),"spin-type-cascade":W("spin","Cascade drop","Symbols fall out and new ones drop in, column by column (Sweet Bonanza style).","spin-cascade"),"spin-type-cells":W("spin","Per-cell spin","Every cell is its own little reel and stops on its own.","spin-cells"),"spin-start-windup":W("spin","Wind-up start","The reels pull back a little before they spin off.","start-windup"),"spin-start-ease":W("spin","Ease-in start","The reels speed up smoothly.","start-ease"),"spin-start-instant":W("spin","Instant start","The reels jump straight to full speed.","start-instant"),"spin-end-bounce":W("spin","Bounce stop","Each reel hits its stop still moving and bounces back off it, twice, like a ball. Overshoot sets how high.","end-bounce"),"spin-end-elastic":W("spin","Elastic stop","Each reel runs past its stop and springs back and forth around it, smaller each time, before it settles. Overshoot sets how far.","end-elastic"),"spin-end-hard":W("spin","Hard stop","The reel stops dead on its symbols.","end-hard"),"spin-end-soft":W("spin","Soft stop","The reel glides to a gentle stop.","end-soft"),"spin-blur":W("spin","Motion blur","Smears the symbols while the reels spin fast.","blur"),"spin-speed":W("spin","Top speed","How fast the reels run in the middle of the spin.","speed"),"spin-mid":W("spin","Spin length","How long the reels run at full speed before stopping.","spin-length"),"spin-ss":W("spin","Start stagger","Delay between one reel starting and the next.","start-stagger"),"spin-st":W("spin","Stop stagger","Delay between one reel stopping and the next.","stop-stagger"),"spin-ant":W("spin","Anticipation time","Extra time a teased reel keeps spinning, slowly, before it lands.","antic-time"),"spin-ant-v":W("spin","Anticipation crawl speed","How fast a teased reel crawls while it builds suspense.","antic-crawl"),"spin-zoom-on":W("effects","Push in on a teased reel","The camera pushes in on the teased reel, follows it from reel to reel and eases out after it lands. How long a tease lasts is in Spin \u203A Anticipation.","zoom"),"spin-zoom":W("effects","Tease zoom","How far the camera pushes in on a teased reel.","zoom-amount"),"spin-scatter-lit":W("spin","Keep scatters lit through the tease","While a reel teases the others dim. Scatters that already landed stay lit and glowing over the dim until the teased reel lands; off, they pop and fade back into it.","scatter-lit"),"spin-stop-order":W("spin","Stop order","Which reel stops first. The tease goes to the reels that stop last.","stop-order"),"sec:wins/win-tiers":W("wins","Win tiers","Big win titles (BIG, MEGA, EPIC...), each from its threshold in bets. A big win shows the tier it reaches, or climbs through every tier on the way.","tiers"),"tier-titles-final":W("wins","Only the tier reached","A big win shows just the title of the tier it reaches: EPIC WIN straight away, with one count up and that tier's particles.","tier-titles"),"tier-titles-climb":W("wins","Climb through the tiers","The title starts at the first tier and steps up (BIG, MEGA, EPIC) each time the count passes a threshold, with a flash, a shake and the next tier's particles. The count runs longer, one stretch per tier.","tier-titles"),"wf-style-pop":W("wins","Pop in place","Winning symbols pulse where they are while the win counts.","winfx-pop"),"wf-style-fly":W("wins","Fly","Winning symbols fly to a spot you pick. When they land they count into the win one by one, or fuse into one big symbol. The flight is the same either way: its arc, pace, rotation and timing.","winfx-fly"),"wf-style-collect":W("wins","Beam to the pots","Every winner fires a saber beam up into its pot above the machine, one by one; each catch counts up the win and the pot's nameplate. Needs the pots on (Features).","beam-collect"),"wf-land-count":W("wins","Count into the win","Each winner shrinks and vanishes as it lands, and every landing adds its share to the win meter. Usually aimed at the win meter.","winfx-fly"),"wf-land-fuse":W("wins","Fuse into one","The winners gather at the spot, each waiting for the last, then fuse into one big symbol with a flash and a shake; the win counts up under it. Usually aimed at the middle of the reels.","winfx-fuse"),"wf-big":W("wins","Big symbol size","How big the fused symbol grows, in cells."),"wf-spot":W("wins","Fly to","Where the winners go: the win meter, the win amount, above the reels, the middle of the reels or of the winners, the screen centre, or a custom spot you can pick on the preview. Count and Fuse each keep their own spot, so a round that fuses does not land on the meter. The preview marks the spot while the Wins tab is open."),"wf-arc":W("wins","Arc height","How high winners hop, in cells above the higher of their cell and the spot (a long flight goes a little higher). 0 flies in a straight line; low skims, high lobs. While the Wins tab is open the preview draws each flight as a dashed line, so you can see it change.","arc-height"),"wf-rotate":W("wins","Rotate with the path","How far winners turn to face where they fly, like Auto-Orient in After Effects. 0 keeps them upright; around 25 to 40% they lean with the curve and stay easy to read; 100 points them fully along it. A winner flying left mirrors instead of turning upside down, and one straight above or below its spot stays upright.","fly-rotate"),"wf-pace-even":W("wins","Even pace","Winners are thrown: off the cell at full speed, slowing over the top of the arc and dropping fast into the spot.","pace-even"),"wf-pace-magnet":W("wins","Magnet pace","Winners creep off their cell, then snap into the spot as if pulled by a magnet: halfway through the flight they have gone 6% of the way, and they land at four times the even speed.","pace-magnet"),"wf-pace-wind":W("wins","Wind-up pace","Winners pull back first (half a cell at most), then shoot into the spot. Works on a straight line or an arc.","pace-wind"),"wf-flight":W("wins","Flight time","How long each winner takes from its cell to the spot."),"wf-order":W("wins","All at once or one by one","At 0 every winner leaves together; at 100 they leave one every 0.3 s (closer on a big win). Fusing winners wait at the spot until the last arrives.","fly-order"),"fx-lines-on":W("wins","Winning lines","Draws the payline through a line win. The winners light up either way.","lines"),"fx-pop":W("wins","Winning symbol pop","How much winning symbols grow when they pulse.","pop-size"),"fx-dim":W("wins","Dim other symbols","Darkens the symbols that are not part of the win so the winners stand out.","dim"),"sec:effects/win-particles":W("effects","Win particles","Coins, confetti and sparkles thrown by each win moment. Pick an explosion and a particle per moment.","particles"),"fx-shake":W("effects","Screen shake","How hard the screen shakes on landings, big wins and features.","shake"),"fx-land-shake":W("effects","Build-up shake","Every reel or cell that brings a winner lands with a bump that grows, and a note that climbs.","land-shake"),"fx-flash":W("effects","Flashes","White flashes on big moments.","flash"),"fx-rays":W("effects","Light rays","Rotating light rays behind big win titles and the wheel.","rays"),"fx-bokeh":W("effects","Background lights","Soft floating lights in the background.","bokeh"),"fx-line":W("effects","Payline glow","How strongly the paylines glow.","line-glow"),"w-landing-center":W("wheel","Centred landing","The wheel stops in the middle of the segment.","wheel-center"),"w-landing-random":W("wheel","Natural landing","The wheel stops anywhere inside the segment.","wheel-random"),"w-landing-tease":W("wheel","Edge tease","The wheel stops right next to the boundary, almost on the neighbour.","wheel-tease"),"w-landing-slip":W("wheel","Almost slips","The wheel creeps into the next peg, nearly tips over, rolls back, and the pointer springs past straight.","wheel-slip"),"w-pointer-top":W("wheel","Pointer on top","The pointer hangs at the top, pointing down.","pointer-top"),"w-pointer-bottom":W("wheel","Pointer at the bottom","The pointer stands at the bottom, pointing up.","pointer-bottom"),"w-framing-full":W("wheel","Whole wheel","The whole wheel on screen.","frame-full"),"w-framing-half":W("wheel","Top half","A bigger wheel with only its top half showing.","frame-half"),"w-framing-close":W("wheel","Close-up","A huge wheel: only the cap near the pointer shows.","frame-close"),"w-framing-rise":W("wheel","From above","The wheel hangs from the top of the screen with the pointer at the bottom.","frame-rise"),"w-push":W("effects","Push in on the wheel pointer","The camera leans in on the pointer as the wheel slows down. 0 keeps it still. In After Effects the CAMERA null does it, scaled by Zoom %.","wheel-push"),"seg-k-0":W("wheel","Segment kind","Prize pays its value. Spin again spins the wheel once more. No win pays nothing.","wheel-again"),"seg-icons-all":W("wheel","Icons on every segment","Gives every segment a built-in icon, richer for bigger prizes.","seg-icons"),"w-centre-icon":W("wheel","Centre icon","The icon on the hub: the star by default, any built-in icon or your own."),"w-label-height":W("wheel","Text height","How far out from the hub the segment text sits.","label-height"),"w-icon-height":W("wheel","Icon height","How far out from the hub the segment icons sit.","icon-height"),"ri-fs-wilds-sticky":W("round","Sticky wilds","Wilds that =========================================

1. Unzip this folder anywhere. Keep "${t}" next to the "assets" folder.
2. In After Effects (2026 or any CC version, Mac or Windows): File >
   Scripts > Run Script File... and pick "${t}". Do not double-click
   the .jsx: that opens it in another app.
3. The script builds one project folder per format (${o.join(", ")}).
   Open the main comp and press space to play.${o.length>1?`
   The art every format shows the same way (symbols, particles, pots,
   titles, the logo) is built once in "Shared Placeholder Comps" and every
   format uses it: replace or animate it there and all formats follow.`:""}

On a Mac
- The script and the file names are plain ASCII, so the script reads the
  same on a Mac as on Windows.
- macOS asks before an app reads your Downloads, Desktop or Documents
  folder. If After Effects says the asset files were not found, allow it
  in System Settings > Privacy & Security > Files and Folders (or move
  the unzipped folder elsewhere), then run the script again.
- Fonts: install the fonts listed under Notes below (double-click a font
  file to install it with Font Book).

How the project is organised
Most of the animation is decided in Reel Studio (outcomes, timing, motion,
effects). The After Effects project is built so you can finish the look
there: every piece of art and every effect is a placeholder comp, the
timing lives in the round comps, and a few controls sit on SLOT CONTROL.

- Placeholder Comps/: the art and the effect looks, each built once. Every
  use in the animation is a layer of that comp, so replacing the art or
  animating inside a placeholder updates every use.
  - Boxes/: every box on screen as one comp, so it moves, scales and
    fades as a unit: "Win Meter" (panel, labels, counter), each jackpot
    "<name> Box" (glow, plate, light, value; the box pops), each pot's
    "<name> Nameplate", a wheel's "R03 ... Prize Plaque" (plaque, label,
    counter and the WIN CTRL it reads) and "Spin Again" plaques, and each
    round's full-screen moments ("Big Win", "Total Win", "Banner",
    "Jackpot Title", "Grand"). A box keeps its parent's clock (it starts
    at 0), so its times read the same as the round's.
  - Symbols/: "Symbol 01 <name>" ... one comp per symbol (coins, the
    multiplier orb and the empty cell too), at full resolution: the art
    shows at its own pixel size at 100%. Replace or animate the art there.
    Symbols/Cell size holds "Symbol 01 <name> (cell)" ..., the same symbol
    at reel cell size (scaled down, Collapse Transformations on, so it
    stays sharp), which the reels and effects use. "Win 01 <name>" ... the
    symbol's win animation: it plays once from the start, then loops the
    tail; an uploaded PNG sequence or sprite sheet is laid out frame by
    frame. "Symbols Atlas" holds one symbol per frame for the reels.
  - Machine/: Background, Machine Back, Machine Frame, Marquee Lights (the
    bulbs blink inside it, faster during wins), Logo, Win Meter Panel,
    Vignette.
  - Effects/: FX Shockwave (a ring that grows and fades in 0.7 s), FX Light
    Rays and FX Small Rays (shape layers: wedges with a feathered mask that
    fades them out; change the fill to recolour them, or edit the paths),
    FX Cell Frame (win highlight), FX Anticipation,
    FX Tease Cell, FX Sticky Frame, FX Coin Lock, FX Special Coin Lock,
    FX Near Miss, FX Wild Beam, FX Collected, FX Mystery Glow, FX
    Collector Glow, FX Pot Glow, FX Boost Target, FX Boost Flash, FX Beam
    Head, FX Cell Shade, FX Jackpot Glow and FX Jackpot Fly Glow.
  - Pots/: "Pot 1 <name>" ... the art of each pot above the machine.
    Replace it with your own and every use follows.
  - Jackpots/: "Jackpot Grand", "Jackpot Major", "Jackpot Minor", "Jackpot
    Mini": each box's plate (or your own box art) with its name, at its size. The
    value is a text layer over it in the main comp.
  - Particles/: "Particle <name>" for each particle the win explosions
    throw (gold coin, stars, confetti, your own art...). A set of variants
    holds one per frame and each particle picks one; an animated particle
    holds its frames in order and each particle plays it from a random
    frame. Replace the art here and every explosion follows.
  - Titles/: "Title <tier>" for each title, with its light sweep, and its
    words as a "Text (editable)" layer in the Main Font, switched off: turn
    it on (and the art off) to change the words or their font.
  - Paylines/: "Payline NN", each drawing itself on.
  - Plaques/: the multiplier, prize and hold & spin plaques.
  - Wheel/: Wheel Disc (the turning part: your face art, Wheel Segments,
    an icon layer per segment icon and a text layer per label, and the hub
    with its centre icon when it turns), Wheel Hub, Wheel Center, Wheel
    Icon NN, Wheel Ring, Wheel Bulbs A and B, Wheel Pointer (its anchor is
    the pivot). Replace any of them with your art.
  - Counters/: "Counter Digits", the 0-9 strip every counter rolls
    through. Change its colour or style once and every counter follows.
  The Logo placeholder (a logo painted from the machine's name) and each
  Jackpot plate also hold their words as a text layer, switched off.

Effects and their controls
- Every effect placeholder (Effects/ and Titles/) has an "FX CONTROLS"
  null. Its sliders and switches drive every use of that effect:
  - "Size %" and "Opacity %": every use bigger, smaller, brighter, fainter.
  - "Colour": effect art is white and each use is tinted to its colour;
    untick it to keep your art's own colours ("FX Colour" on SLOT CONTROL
    does it for all effects at once).
  - "Speed %" (FX Shockwave): how fast the ring grows.
  - "Spin %" (rays): how fast the rays turn.
  - "Built-in Motion" (rays and titles): untick it when your art brings
    its own motion; the uses then stop spinning, popping and springing.
  - "Light Sweep" (titles): the sweep across the title.
- Swap an effect for a prerendered movie (a .mov with alpha, a PNG
  sequence...): open its placeholder, switch off or delete the art layer,
  and drop your movie in at 0:00. Every use starts it
  at the moment the effect happens: shockwave uses last 4 s, so a movie up
  to 4 s plays in full; frames and glows last as long as they show (set a
  looping movie to loop in Interpret Footage). Untick "Colour" for a
  coloured movie and "Built-in Motion" for one that moves by itself.
- Or swap the whole comp: select the uses and Alt-drag (Option-drag on a
  Mac) your own comp onto them in the timeline. Each use reads the
  controls of the comp it shows, so your comp can bring its own "FX
  CONTROLS" null (copy it from the placeholder); without one, the uses
  play it at 100%, untinted and moving by themselves. Nothing refers to the
  placeholder by name, so you can delete it.
- Particle explosions: replace the art in Particles/ and every explosion
  follows; to swap one explosion for a movie, open its comp in
  Rounds/Particles, switch its particle layers off and drop the movie in.

Full-screen wins in HD
- Titles, the logo and the particle art are painted twice the size they
  show, and their uses are scaled to 50% (or less): enlarge a title or a
  particle up to 200% and it stays sharp. The light rays are vector shapes
  in comps twice the size of their biggest use (nothing to ship, same
  sharpness). The counters are built at twice the size of the biggest
  amount, and the shockwave ring is drawn as big as its biggest use. A
  winning symbol that merges into a big one is drawn from its full-size
  art.
- Reels/: one precomp per reel (or per cell for per-cell spins). Each has a
  CTRL null with a "Spin" slider: its keyframes are the start, mid and end
  phases from Reel Studio, with the same speed and influence eases. Open the
  Graph Editor on that slider to reshape a start or a stop. The reel reads
  its symbols from Symbols Atlas as the slider rolls it, like an odometer
  wheel. Tumbling symbols are ordinary keyframed layers in the same
  precomps.
  - Hold and Spin/ (when the animation has coins): "Hold Cell C-R", one
    little reel of coins and empty cells per cell, on its own Spin slider,
    with the coin values on "Value" text layers.
- Rounds/: one comp per round that shows something. It places the
  placeholders in time: paylines, win comps on the winning cells, cell
  frames, shockwaves, expanding wilds, multipliers, titles, the wheel, coin
  landings and the collect. Move a layer to retime an effect.
  Mystery blocks turn over as "Mystery Block" then "Mystery Reveal"
  layers; the collector takes each cash value as a flying text layer.
  Boosters: "Boost Target" marks a cell in its pot's colour, "Boost From"
  trembles until the beam hits, the new symbol pops and "Boost Flash"
  bursts. Beams are "Beam Down n" (a pot firing) and "Beam Up n" (a
  winner beaming to its pot) shape layers: a Bezier path drawn on by Trim
  Paths, soft strokes in the pot's colour round a white core that thin to
  the tail (each stroke's Taper, After Effects 2020+: Start Width is the
  tail's width), a "Head" group with the white-hot ball, and a "Beam Head
  n" glow riding on the head. Edit the path to reshape a beam.
  A winner that beams to its pot darkens under a "Drained n" shade.
  For a saber plug-in (Video Copilot Saber and the like, which draw along
  a layer's masks): every beam, payline, jump or merge flight, winning
  cell frame and anticipation frame has a "Saber Path ..." solid, switched
  off at the bottom of its comp, with the path as a mask in mode None.
  Its "Head %" and "Tail %" sliders follow the effect's own draw-on: put
  the plug-in on that solid, switch it on, and link the plug-in's End and
  Start Offset to them.
  A round that awards a jackpot sends its amount from the box down into
  the win meter (with no meter, into the middle of the reels, where it
  stays a moment) as a "Jackpot <tier> Win" text with a "Fly Glow". A box
  with its win title on takes the whole screen instead, like the Grand:
  "Title jp_major" (and so on) and a counter reading its own "MAJOR
  JACKPOT n CTRL" slider.
  While a cell is held (a sticky or walking wild, a mystery block turning,
  a booster landing) a "Sticky n" or "Reveal n" mask cuts it out of its
  reel.
  Winning symbols that jump into the score are "Jump <symbol>" layers and
  ones that merge are "Pull <symbol>" layers plus a "Merged <symbol>": their
  position, scale and opacity expressions hold the flight from Reel Studio
  (time, path, landing spot), so they move exactly as in the preview.
  - Particles/: every win explosion (small burst, fountain, rain, confetti
    cannons, fireworks...) is a comp of its own. Each layer is one
    particle: a use of its Particle placeholder whose position, rotation,
    scale and opacity expressions hold the exact flight it has in Reel
    Studio (gravity, air drag, flutter). Slide the comp to retime it.
    Long running emitters loop a 5 second cycle seamlessly: each particle's
    age wraps by the cycle, so extending the comp keeps them going.
- Counter Rigs/: the rolling money counters (win meter, big win amounts,
  the hold & spin collect, the grand). Each COUNTER CTRL > Value reads its
  source slider (WIN CTRL > Amount in a round comp, SLOT CONTROL in the
  main comp); key or pick-whip it to drive the counter yourself. Each
  column turns as the one below it wraps, like the Odometer plugin, so no
  plugin is needed.
- Sound/SFX: ${n?`every sound cue on its own audio layer at its time (${n} distinct clips in assets/sfx), named after the cue and its round and coloured by group: Reels blue, Wins green, Coins yellow, Big Win red, UI purple. The SFX MIX null holds the levels in dB: "Master" and one slider per group; every layer reads its two sliders. Mute, move or swap any cue layer; to change a sound everywhere it plays, select its file in Slot Assets/SFX and use File > Replace Footage.${s<0?` Master includes ${s} dB of headroom so the loudest moment stays below 0 dB (After Effects has no compressor).`:""}`:"sound was switched off in Reel Studio, so there are no sound cues."}
- Main comp: the machine, reels, sticky wilds and walking wilds (each step
  hops in from the reel it left), the tease ("Tease Dim Rn" over the
  other reels and a lit "Scatter Lands" copy of every scatter that
  lands), coin lock frames, logo, free spins ribbon, HUD texts, the win
  meter, the round comps, the flash and the SFX comp, with a marker where
  each round starts. With pots above the machine: each "Pot n" stands
  behind the frame with a "Charge Light" copy, squashing as it catches
  and kicking as it fires; over the frame its "Glow" and its nameplate
  ("Pot n Plate" and a counter reading the "Pot n" slider). With jackpot
  boxes: each "Jackpot <tier>" plate with a "Glow" behind it, a "Light"
  copy over it and a "Win Sweep" (CC Light Sweep), all popping and
  glowing by expressions when the box is won or its coin lands; its
  "Value" text reads the "Jackpot <tier>" slider, and a Shockwave plays at
  every win. SCREEN SHAKE is a
  parent null whose position expression holds the shake events. Ambient
  particles ("Ambient <template>") sit right above the background, and
  particles set to run to the end ("Rxx <template>") above the round
  comps. With the anticipation zoom on, a CAMERA null parents SCREEN SHAKE
  and the background: its position and scale expressions push in on the
  teased reel and ease back out.
- SLOT CONTROL (main comp):
  - "Meter", "FS Total" (and "Collect" with Hold & Spin, "Pot 1" to "Pot 3"
    with pots) drive the counters.
  - "Jackpot Grand" ... "Jackpot Mini" (with jackpot boxes): what each box
    shows. Its expression holds the seed, the growth per second and every
    win (when, and what it paid); edit them there, or replace the
    expression with your own keyframes and the value text follows.
  - "Shake %", "Flash %", "Dim %", "Particles %" (thins every explosion
    out), "Spin Blur %" (the reels' up-and-down blur), "Win Pop %", "Zoom %"
    (the anticipation zoom), "Win Camera %" (the camera following the
    winners: its keys are on the WIN CAMERA null, one a frame, editable) and
    "Glow %" (every glow at once; each glow
    keeps its art on top) scale those effects; 100 is what Reel Studio
    showed.
  - "FX Colour": tints the effect placeholders (see above).
- The wheel game has no machine layers: just the background, the wheel and
  its prizes, one round comp per spin handing the wheel to the next.

Transparency
- ${a?"Background and Vignette are switched off in this build.":"Switch off the Background and Vignette layers in the main comp."}
  Then Composition > Add to Render Queue, Output Module: QuickTime, Apple
  ProRes 4444, Channels: RGB + Alpha. That gives a transparent MOV.

Notes
- Fonts: text layers ask for ${i}. Install them (Google Fonts, or the
  files in fonts/). Every text layer takes its font from the "Fonts" comp
  (in Slot Assets): pick another font on its "Main Font" layer (or "Wheel
  Font" for the wheel labels) and all the text follows (After Effects 2020
  or later; older versions keep the font each layer was built with).
- Reel curvature and bloom are preview-only effects; the AE reels are flat.
- assets/ holds only the art and sounds this animation uses, and each
