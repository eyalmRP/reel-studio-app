    return L;
  }
  // Eases for a property of n dimensions: After Effects wants one per
  // dimension, and says which by refusing the others.
  function easeAt(prop, i, sIn, iIn, sOut, iOut) {
    var n, a, b, j;
    for (n = 1; n <= 3; n++) {
      a = []; b = [];
      for (j = 0; j < n; j++) { a.push(new KeyframeEase(sIn, pct(iIn))); b.push(new KeyframeEase(sOut, pct(iOut))); }
      try { prop.setTemporalEaseAtKey(i, a, b); return; } catch (e) {}
    }
  }
  // The engine's keys: [t, v, in speed, in influence, out speed, out influence, hold].
  function setKeys(prop, keys) {
    var i, times = [], vals = [];
    for (i = 0; i < keys.length; i++) { times.push(keys[i][0]); vals.push(keys[i][1]); }
    prop.setValuesAtTimes(times, vals);
    for (i = 0; i < keys.length; i++) {
      var k = keys[i];
      var prevHold = i > 0 && keys[i - 1][6];
      try {
        prop.setInterpolationTypeAtKey(i + 1, prevHold ? HOLD : BEZ, k[6] ? HOLD : BEZ);
        prop.setTemporalContinuousAtKey(i + 1, false);
        prop.setTemporalAutoBezierAtKey(i + 1, false);
      } catch (e) {}
      easeAt(prop, i + 1, k[2], k[3], k[4], k[5]);
    }
  }
  // Pairs [t, v] eased in and out; two numbers make a 2D value (a scale).
  function easeKeys(prop, pairs, twoD) {
    var i, times = [], vals = [];
    for (i = 0; i < pairs.length; i++) {
      var t = pairs[i][0];
      if (i > 0 && t <= times[i - 1]) t = times[i - 1] + 0.01;
      times.push(t);
      vals.push(twoD ? [pairs[i][1], pairs[i][1]] : pairs[i][1]);
    }
    prop.setValuesAtTimes(times, vals);
    for (i = 1; i <= pairs.length; i++) easeAt(prop, i, 0, 0.55, 0, 0.55);
  }
  function shapeLayer(comp, name) {
    var L = comp.layers.addShape();
    L.name = name;
    P(L, "ADBE Position").setValue([0, 0]);
    return L;
  }
  function group(L, name) {
    var g = L.property("ADBE Root Vectors Group").addProperty("ADBE Vector Group");
    if (name) g.name = name;
    return g.property("ADBE Vectors Group");
  }
  function rect(cont, xy, size, round) {
    var r = cont.addProperty("ADBE Vector Shape - Rect");
    r.property("ADBE Vector Rect Size").setValue(size);
    r.property("ADBE Vector Rect Position").setValue(xy);
    r.property("ADBE Vector Rect Roundness").setValue(round || 0);
  }
  function ellipse(cont, xy, size) {
    var e = cont.addProperty("ADBE Vector Shape - Ellipse");
    e.property("ADBE Vector Ellipse Size").setValue(size);
    e.property("ADBE Vector Ellipse Position").setValue(xy);
  }
  function stroke(cont, rgb, width) {
    var s = cont.addProperty("ADBE Vector Graphic - Stroke");
    s.property("ADBE Vector Stroke Color").setValue(rgb);
    s.property("ADBE Vector Stroke Width").setValue(width);
  }
  function fill(cont, rgb) {
    var f = cont.addProperty("ADBE Vector Graphic - Fill");
    f.property("ADBE Vector Fill Color").setValue(rgb);
  }
  // A path through the points, closed (a shape) or open (a line).
  function path(cont, pts, closed) {
    var sh = new Shape();
    sh.vertices = pts;
    sh.closed = closed;
    cont.addProperty("ADBE Vector Shape - Group").property("ADBE Vector Shape").setValue(sh);
  }
  function fitScale(it, size) { return 100 * size / Math.max(it.width || size, it.height || size, 1); }

  // ---------- The symbols' (or coins') Idle and Win comps ----------
  function buildPieces() {
    var fPieces = folder(D.machine === "holdspin" ? "Coins" : "Symbols", top);
    var i, k;
    for (i = 0; i < D.pieces.length; i++) {
      var pc = D.pieces[i];
      var it = imp(pc.file);
      var sub = folder(pc.name, fPieces);
      var idle = addComp(pc.name + " Idle", S, S, D.idleLen, sub);
      idle.comment = "Animate " + pc.name + "'s idle here: it loops on every cell it lands on, in every round and format.";
      if (it) {
        var a = idle.layers.add(it);
        a.name = pc.name;
        P(a, "ADBE Position").setValue([S / 2, S / 2]);
        var f0 = fitScale(it, S * 0.84);
        P(a, "ADBE Scale").setValue([f0, f0]);
      }
      IDLE.push(idle);
      if (!pc.win) { WIN.push(null); continue; }
      var WS = Math.round(S * 1.4);
      var wc = addComp(pc.name + " Win", WS, WS, D.winLen + D.exitLen, sub);
      wc.comment = "Animate " + pc.name + "'s win here. It plays from its start on the frame the win starts, then loops from the Loop marker to its end" + (D.exitLen ? " (here, to the Exit marker). From the Exit marker the symbol leaves the board: end it gone; the tumble's fall follows." : ".");
      try { wc.markerProperty.setValueAtTime(D.loopAt, new MarkerValue("Loop")); } catch (eM) {}
      if (D.exitLen) { try { wc.markerProperty.setValueAtTime(D.winLen, new MarkerValue("Exit")); } catch (eX) {} }
      // A soft glow behind it, pulsing.
      var gl = shapeLayer(wc, "Glow");
      var gg = group(gl, "Glow");
      ellipse(gg, [WS / 2, WS / 2], [S * 0.95, S * 0.95]);
      fill(gg, GOLD);
      try { fx(gl, "ADBE Gaussian Blur 2", "Soft").property("ADBE Gaussian Blur 2-0001").setValue(S * 0.12); } catch (eG) {}
      var gk = [[0, 0], [0.3, 55]];
      for (k = D.loopAt; k + 0.38 < D.winLen; k += 0.3846) gk.push([k + 0.3846, (gk.length % 2) ? 35 : 55]);
      gk.push([D.winLen, 55]);
      if (D.exitLen) gk.push([D.winLen + D.exitLen, 0]);
      easeKeys(P(gl, "ADBE Opacity"), gk);
      if (it) {
        var w = wc.layers.add(it);
        w.name = pc.name;
        P(w, "ADBE Position").setValue([WS / 2, WS / 2]);
        var f1 = fitScale(it, S * 0.84);
        // The stand-in: a pop, then a pulse (three beats: a seamless loop).
        var sk = [[0, f1], [0.15, f1 * 1.21], [0.3, f1 * 1.13], [0.42, f1 * 1.17], [D.loopAt, f1 * 1.16]];
        var on = false;
        for (k = D.loopAt + 0.3846; k < D.winLen + 0.001; k += 0.3846) { sk.push([Math.min(k, D.winLen), f1 * (on ? 1.16 : 1.09)]); on = !on; }
        if (D.exitLen) { sk.push([D.winLen + D.exitLen * 0.4, f1 * 1.35]); sk.push([D.winLen + D.exitLen, f1 * 0.02]); }
        easeKeys(P(w, "ADBE Scale"), sk, true);
        if (D.exitLen) easeKeys(P(w, "ADBE Opacity"), [[D.winLen, 100], [D.winLen + D.exitLen * 0.4, 100], [D.winLen + D.exitLen, 0]]);
      }
      WIN.push(wc);
    }
    if (D.popLen) {
      // The shared Pop: a flash, a ring and sparks over every symbol that goes.
      POPC = addComp("Pop", S, S, D.popLen, fPieces);
      POPC.comment = "The burst over each winning symbol as it leaves the board, in every tumble. Animate it once here.";
      var fl = shapeLayer(POPC, "Flash");
      var fg = group(fl, "Flash");
      ellipse(fg, [S / 2, S / 2], [S * 0.6, S * 0.6]);
      fill(fg, [1, 0.97, 0.85]);
      easeKeys(P(fl, "ADBE Opacity"), [[0, 85], [D.popLen * 0.6, 0]]);
      var ring = shapeLayer(POPC, "Ring");
      var rg = group(ring, "Ring");
      ellipse(rg, [S / 2, S / 2], [S * 0.5, S * 0.5]);
      stroke(rg, [1, 0.88, 0.59], S * 0.03);
      try { P(ring, "ADBE Anchor Point").setValue([S / 2, S / 2]); P(ring, "ADBE Position").setValue([S / 2, S / 2]); } catch (eA) {}
      easeKeys(P(ring, "ADBE Scale"), [[0, 40], [D.popLen * 0.8, 160]], true);
      easeKeys(P(ring, "ADBE Opacity"), [[0, 90], [D.popLen * 0.8, 0]]);
      for (k = 0; k < 8; k++) {
        var sp = shapeLayer(POPC, "Spark " + (k + 1));
        var sg = group(sp, "Spark");
        ellipse(sg, [0, 0], [S * 0.05, S * 0.05]);
        fill(sg, [1, 0.93, 0.67]);
        var an = k / 8 * Math.PI * 2 + 0.3;
        var spp = P(sp, "ADBE Position");
        spp.setValuesAtTimes([0, D.popLen * 0.8], [[S / 2 + Math.cos(an) * S * 0.18, S / 2 + Math.sin(an) * S * 0.18], [S / 2 + Math.cos(an) * S * 0.62, S / 2 + Math.sin(an) * S * 0.62]]);
        easeAt(spp, 1, 0, 0.1, 0, 0.1);
        easeAt(spp, 2, 0, 0.7, 0, 0.7);
        easeKeys(P(sp, "ADBE Opacity"), [[0, 100], [D.popLen * 0.8, 0]]);
      }
    }
  }

  // ---------- A format's own comps to fill in ----------
  function textLayer(comp, sp) {
    var L = comp.layers.addText(sp.t || " ");
    var td = L.property("ADBE Text Properties").property("ADBE Text Document");
    var v = td.value;
    v.fontSize = sp.size;
    // Its face by name (Impact, Arial Bold: on every Mac and PC).
    try { v.font = sp.font === "label" ? D.fonts.label : D.fonts.num; } catch (eF) {}
    // Everything set here, not left to the Character panel: a new text
    // layer otherwise takes whatever stroke, tracking and style it last had.
    // The fill always over the stroke.
    v.applyFill = true;
    v.fillColor = sp.color;
    v.applyStroke = !!sp.stroke;
    if (sp.stroke) {
      v.strokeColor = sp.stroke;
      v.strokeWidth = Math.max(1, sp.size * 0.1);
    }
    try { v.strokeOverFill = false; } catch (eS) {}
    try { v.tracking = 0; v.fauxBold = false; v.fauxItalic = false; v.allCaps = false; v.smallCaps = false; } catch (eT) {}
    v.justification = sp.just === "r" ? ParagraphJustification.RIGHT_JUSTIFY : (sp.just === "l" ? ParagraphJustification.LEFT_JUSTIFY : ParagraphJustification.CENTER_JUSTIFY);
    // Two lines (a jackpot's name over its value): their spacing as drawn.
    if (sp.lead) {
      try { v.autoLeading = false; v.leading = sp.lead; } catch (eL) {}
    }
    td.setValue(v);
    return L;
  }
  function buildPlaceholder(F, ph, into) {
    // A box of its own size (the counters), else the frame it is for.
    var c = addComp(ph.name + F.sfx, ph.size ? ph.size[0] : F.W, ph.size ? ph.size[1] : F.H, LONG, into);
    c.comment = F.sfx === "" && !F.format ? "Fill or replace: every round of every format uses it." : "Fill or replace: every round of this format uses it.";
    var L, g;
    if (ph.kind === "background") {
      L = c.layers.addSolid([0.1, 0.06, 0.16], "Background", F.W, F.H, 1);
      try {
        var r = fx(L, "ADBE Ramp", "Glow");
        r.property("ADBE Ramp-0001").setValue([F.W / 2, F.H * 0.45]);
        r.property("ADBE Ramp-0002").setValue([0.23, 0.12, 0.34]);
        r.property("ADBE Ramp-0003").setValue([F.W / 2 + Math.max(F.W, F.H) * 0.75, F.H * 0.45]);
        r.property("ADBE Ramp-0004").setValue([0.04, 0.03, 0.06]);
        r.property("ADBE Ramp-0005").setValue(2);
      } catch (eR) {}
      // Faint rays fanning down from above the top.
      if (ph.rays && ph.rays.length) {
        var ray = shapeLayer(c, "Rays");
        var rg2 = group(ray, "Rays");
        var q;
        for (q = 0; q < ph.rays.length; q++) path(rg2, ph.rays[q], true);
        fill(rg2, [1, 0.85, 0.54]);
        P(ray, "ADBE Opacity").setValue(5);
      }
    } else if (ph.kind === "backing") {
      L = shapeLayer(c, "Reel Backing");
      g = group(L, "Backing");
      rect(g, [ph.x + ph.w / 2, ph.y + ph.h / 2], [ph.w, ph.h], ph.round);
      fill(g, [0.09, 0.06, 0.13]);
      // A faint line between the reels.
      if (ph.lines && ph.lines.length) {
        var ln = shapeLayer(c, "Reel Lines");
        var lg = group(ln, "Lines");
        var q2;
        for (q2 = 0; q2 < ph.lines.length; q2++) path(lg, ph.lines[q2], false);
        stroke(lg, [1, 1, 1], ph.lineW || 1);
        P(ln, "ADBE Opacity").setValue(ph.lineOp || 20);
      }
      // And between the rows.
      if (ph.rows && ph.rows.length) {
        var rl = shapeLayer(c, "Row Lines");
        var rg3 = group(rl, "Lines");
        var q3;
        for (q3 = 0; q3 < ph.rows.length; q3++) path(rg3, ph.rows[q3], false);
        stroke(rg3, [1, 1, 1], ph.lineW || 1);
        P(rl, "ADBE Opacity").setValue(ph.lineOp || 20);
      }
    } else if (ph.kind === "frame") {
      L = shapeLayer(c, "Reel Frame");
      g = group(L, "Frame");
      rect(g, [ph.x + ph.w / 2, ph.y + ph.h / 2], [ph.w, ph.h], ph.round);
      stroke(g, GOLD, ph.line);
      var g2 = group(L, "Inner Line");
      rect(g2, [ph.x + ph.w / 2, ph.y + ph.h / 2], [ph.w - ph.line * 1.8, ph.h - ph.line * 1.8], ph.round * 0.7);
      stroke(g2, [0.16, 0.08, 0], Math.max(1, ph.line * 0.25));
    } else if (ph.kind === "plaque") {
      L = shapeLayer(c, ph.name);
      g = group(L, "Plaque");
      rect(g, [ph.x + ph.w / 2, ph.y + ph.h / 2], [ph.w, ph.h], ph.h * 0.3);
      fill(g, [0.13, 0.09, 0.19]);
      stroke(g, GOLD, Math.max(1.5, ph.h * 0.05));
      if (ph.label) {
        var T = textLayer(c, { t: ph.label, size: ph.h * 0.24, color: [0.79, 0.65, 0.35], just: "l", font: "label" });
        P(T, "ADBE Position").setValue([ph.x + ph.h * 0.35, ph.y + ph.h / 2 + ph.h * 0.08]);
      }
      var d;
      for (d = 0; ph.dots && d < ph.dots.length; d++) {
        var dl = shapeLayer(c, "Unlit Dot " + (d + 1));
        var dg = group(dl, "Dot");
        ellipse(dg, [ph.dots[d][0], ph.dots[d][1]], [ph.dots[d][2] * 2, ph.dots[d][2] * 2]);
        fill(dg, [0.23, 0.18, 0.3]);
      }
    }
    return c;
  }

  // ---------- Layers as the plan lists them ----------
  function addLayer(comp, sp, made) {
    var L;
    if (sp.k === "piece") L = comp.layers.add(IDLE[sp.i]);
    else if (sp.k === "win") L = comp.layers.add(WIN[sp.i]);
    else if (sp.k === "pop") L = comp.layers.add(POPC);
    else if (sp.k === "ph") L = comp.layers.add(PH[sp.ph]);
    else if (sp.k === "pre") L = comp.layers.add(PRE[sp.pre]);
    else if (sp.k === "board") L = comp.layers.add(PART[sp.part || "board"][sp.i]);
    else if (sp.k === "null") {
      L = comp.layers.addNull(comp.duration);
      P(L, "ADBE Anchor Point").setValue([0, 0]);
    } else if (sp.k === "solid") L = comp.layers.addSolid(sp.color, sp.n || "Solid", sp.w, sp.h, 1);
    else if (sp.k === "text" || sp.k === "count") L = textLayer(comp, sp);
    else if (sp.k === "line") {
      // The win line: a soft wide stroke under a bright core, drawn on by
      // Trim Paths, with a Glow.
      L = shapeLayer(comp, sp.n);
      // Each group made whole before the next (adding one invalidates the
      // references to the others).
      var lgs = [["Glow Stroke", [1, 0.7, 0.28], sp.w1, 55], ["Core", [1, 0.945, 0.72], sp.w2, 100]];
      var li;
      for (li = 0; li < lgs.length; li++) {
        var lg = group(L, lgs[li][0]);
        path(lg, sp.pts, false);
        var st = lg.addProperty("ADBE Vector Graphic - Stroke");
        st.property("ADBE Vector Stroke Color").setValue(lgs[li][1]);
        st.property("ADBE Vector Stroke Width").setValue(lgs[li][2]);
        st.property("ADBE Vector Stroke Opacity").setValue(lgs[li][3]);
        try { st.property("ADBE Vector Stroke Line Cap").setValue(2); st.property("ADBE Vector Stroke Line Join").setValue(2); } catch (eC) {}
      }
      var trim = L.property("ADBE Root Vectors Group").addProperty("ADBE Vector Filter - Trim");
      trim.name = "Draw On";
      if (sp.trim) easeKeys(trim.property("ADBE Vector Trim End"), sp.trim);
      else trim.property("ADBE Vector Trim End").setValue(100);
      try {
        var lgw = fx(L, "ADBE Glo2", "Glow");
        lgw.property("ADBE Glo2-0003").setValue(sp.glow);
        lgw.property("ADBE Glo2-0004").setValue(1.5);
      } catch (eLg) {}
    } else if (sp.k === "ring") {
      // A glowing ring (the teasing reel's or cell's): a stroke and a Glow.
      L = shapeLayer(comp, sp.n);
      var rgr = group(L, "Ring");
      rect(rgr, [0, 0], [sp.w, sp.h], sp.round);
      stroke(rgr, [1, 0.84, 0.43], sp.line);
      try {
        var gw = fx(L, "ADBE Glo2", "Glow");
        gw.property("ADBE Glo2-0003").setValue(sp.glow);
        gw.property("ADBE Glo2-0004").setValue(1.5);
      } catch (eGw) {}
    } else if (sp.k === "dot") {
      L = shapeLayer(comp, sp.n);
      var g = group(L, "Dot");
      ellipse(g, [0, 0], [sp.r * 2, sp.r * 2]);
      fill(g, [1, 0.83, 0.35]);
    }
    if (!L) return null;
    if (sp.n) L.name = sp.n;
    if (sp.tr) {
      L.timeRemapEnabled = true;
      L.property("ADBE Time Remapping").expression = sp.tr === "loop" ? D.loopExpr : sp.tr;
    }
    span(L, sp.st, sp.inT, sp.outT);
    if (sp.par !== undefined && sp.par !== null && made[sp.par]) L.parent = made[sp.par];
    if (sp.py) {
      P(L, "ADBE Position").dimensionsSeparated = true;
      P(L, "ADBE Position_0").setValue(sp.x);
      if (sp.py[0].length > 2) setKeys(P(L, "ADBE Position_1"), sp.py);
      else easeKeys(P(L, "ADBE Position_1"), sp.py);
    } else if (sp.x !== undefined) P(L, "ADBE Position").setValue([sp.x, sp.y]);
    if (sp.sc) easeKeys(P(L, "ADBE Scale"), sp.sc, true);
    else if (sp.s) P(L, "ADBE Scale").setValue([sp.s, sp.s]);
    if (sp.op) easeKeys(P(L, "ADBE Opacity"), sp.op);
    if (sp.expr) P(L, "ADBE Opacity").expression = sp.expr;
    if (sp.k === "count") {
      var sl = fx(L, "ADBE Slider Control", "Win").property(1);
      easeKeys(sl, sp.win);
      L.property("ADBE Text Properties").property("ADBE Text Document").expression = D.countExpr;
    }
    if (sp.mb) L.motionBlur = true;
    return L;
  }
  function fill2(comp, list) {
    var made = [], i;
    for (i = 0; i < list.length; i++) {
      var sp = list[i];
      sp.inT = sp["in"];
      sp.outT = sp.out;
      made.push(addLayer(comp, sp, made));
    }
  }

  // Once, for every format: each round's board (the grid and all on it)
  // and its counters, and the placeholders they hold.
  function buildBoard() {
    var B = D.board;
    var fB = folder("Board", top), fReels = folder("Reels", fB), fPh = folder("Placeholders", fB);
    var i, j;
    for (i = 0; i < B.ph.length; i++) PH[B.ph[i].name] = buildPlaceholder({ W: B.W, H: B.H, sfx: "" }, B.ph[i], fPh);
    for (i = 0; i < B.rounds.length; i++) {
      var R = B.rounds[i];
      PRE = [];
      for (j = 0; j < R.pre.length; j++) {
        var pc = addComp(R.pre[j].name, R.pre[j].w, R.pre[j].h, R.len, fReels);
        fill2(pc, R.pre[j].layers);
        PRE.push(pc);
      }
      var bc = addComp(R.name, B.W, B.H, R.len, fB);
      bc.comment = "This round's board for every format: the reels and all on them. Animate it here, once.";
      fill2(bc, R.layers);
      PART.board.push(bc);
      var parts = ["counter", "respins"], q;
      for (q = 0; q < parts.length; q++) {
        var sp = R[parts[q]];
        if (!sp) { PART[parts[q]].push(null); continue; }
        var cc = addComp(sp.name, sp.w, sp.h, R.len, fB);
        fill2(cc, sp.layers);
        PART[parts[q]].push(cc);
      }
    }
  }

  // A format: its background, each round's comp (the board and counters
  // scaled into place over it) and Main.
  function buildFormat(F) {
    var fF = folder(F.tag + " - " + F.W + "x" + F.H, top);
    var fRounds = folder("Rounds", fF), fPh = folder("Placeholders", fF);
    var i;
    for (i = 0; i < F.ph.length; i++) PH[F.ph[i].name] = buildPlaceholder({ W: F.W, H: F.H, sfx: F.sfx, format: true }, F.ph[i], fPh);
    var rcs = [];
    for (i = 0; i < F.rounds.length; i++) {
      var R = F.rounds[i];
      var rc = addComp(R.name, F.W, F.H, R.len, fRounds);
      fill2(rc, R.layers);
      rcs.push(rc);
    }
    var main = addComp("Main" + F.sfx, F.W, F.H, D.total, fF);
    main.comment = "Every round end to end. Each round starts on the board the last one landed, so it loops.";
    for (i = 0; i < rcs.length; i++) {
      var L = main.layers.add(rcs[i]);
      L.startTime = F.rounds[i].start;
    }
    return main;
  }

  app.beginUndoGroup("Quick Win");
  try {
    proj = app.project || app.newProject();
    top = folder("Quick Win - " + D.name);
    fArt = folder("Art", top);
    var ctl = addComp("Quick Win Controls", 400, 120, LONG, top);
    var cn = ctl.layers.addNull(LONG);
    cn.name = "CONTROLS";
    fx(cn, "ADBE Slider Control", "Darken %").property(1).setValue(D.darken);
    buildPieces();
    buildBoard();
    var first = null, f;
    for (f = 0; f < D.formats.length; f++) {
      var m = buildFormat(D.formats[f]);
      if (!first) first = m;
    }
    if (first) first.openInViewer();
  } catch (err) {
    alert("The Quick Win build stopped: " + err.toString() + (err.line ? " (script line " + err.line + ")" : ""));
