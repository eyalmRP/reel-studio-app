ct you had."],save:["Save","Saves the project as a file, your art included, to open later here or in the other copy of the app. Your work is also kept in this browser as you go."],mp4:["MP4 preview","A video of the whole run in the format shown, at its full size, to watch or send. Needs a current Chrome, Edge or Safari."],ae:["After Effects","A zip with a script that builds the project in After Effects: every symbol (or coin) as an Idle and a Win comp, the reels on the very keyframes you see here, and full-frame placeholders to fill in. Unzip it and run the .jsx with File \u203A Scripts \u203A Run Script File."],help:["Help","Help videos (a narrated video for each machine and for the export, on a page of their own) or the guided tour of this screen."],helpvideos:["Help videos","Opens the Help page in a new tab: a narrated video for Reels, Cascade, Hold & Spin and the export to After Effects, each with chapters and a transcript."],tour:["Guided tour","Five stops round this screen, each lit with a card: the machine, the round, the timeline, the art, the formats and After Effects."],fmt:["Format shown","Shows the picture in this format (the gold one is shown). One not in the package goes in as it shows; its check takes it out again. Its extra rows, if it has any, are under its size."],names:["Comp names","Labels each part of the picture with the comp that shows it in After Effects: Idle or Win, the reels, the placeholders."],picture:["The picture","Click a cell to put it in the picked round\u2019s win (or tumble), or to place a coin in Hold & Spin. A mouse outlines the cell first."],play:["Play","Plays the run (Space). It loops when Loop is on."],loop:["Loop","Plays round and round. The first round starts on the last one\u2019s board, so the run loops without a jump."],solo:["This round only","Plays the picked round alone."],track:["Timeline","The rounds end to end. Click one to pick it (its settings come up on the left); drag along it to scrub. The tints show its parts: the spin, the stops, the win."],marks:["Marks","Drag a white mark to move it: where the reels start stopping and where the win starts (in a cascade, the drop and each tumble\u2019s pop). The reels always land before the win; Auto puts the marks back."],addround:["Add a round","A copy of the picked round after it, with new filler symbols. In Hold & Spin, a respin before the collect."],delround:["Remove this round","Takes the picked round out. Undo brings it back."],"sec:round":["The picked round","Everything about the round picked on the timeline: its length, when its parts happen, what teases and what wins."],len:["Length","How long the round lasts, in seconds. The spin, the stops and the win share it as the marks on the timeline say."],split:["Its parts","How long each part lasts: the spin until the first reel stops, the stops until the last one lands, then the win (or the rest). Drag the marks on the timeline to change them."],automarks:["Auto","Puts the marks back where the app places them for this spin style."],winsym:["Winning symbol","The symbol that wins on the winning cells. The other cells are filled so that nothing else looks like a win."],nowin:["No win","The reels land and nothing wins."],cells:["Winning cells","The cells that win, a square per cell. Click to put one in or take it out; a preset becomes your own cells when you do."],clear:["Clear","Takes every cell out of the win (Hold & Spin: every coin out of this round)."],savepreset:["Save as my preset","Keeps these cells as a preset of your own, to use in any round or tumble."],mypreset:["My preset","Cells you saved. On a smaller grid the cells outside it are left out."],delpreset:["Remove this preset","Rounds that use it keep its cells as their own."],"pre:Paylines":["Payline presets","A straight row or a line across the reels, one cell per reel."],"pre:Shapes":["Shape presets","A shape on the grid: full screen, an X, a plus, the frame, the corners."],"pre:Scatter":["Scatter presets","Cells anywhere, one per reel while there are reels enough; Reshuffle moves them."],"pre:Clusters":["Cluster presets","Touching cells grown from the middle; Reshuffle grows them another way."],win:["Win","The amount the counter counts up to. Each winning cell\u2019s points are an even share of it."],reshuffle:["Reshuffle","New symbols on the other cells (and new places for scatter and cluster presets), still with nothing else winning."],tumble:["Tumble","Each tumble pops its winners; the rest fall into the gaps and new symbols drop in. Pick its cells on the board as the fall before it leaves it."],addtumble:["Add a tumble","Another win after the last one: a new symbol on 5 touching cells to start with. Up to 8 a round."],"addtumble-full":["Add a tumble","This round has 8 tumbles, the most a round takes. Remove one to add another, or win again in the next round."],deltumble:["Remove this tumble","Takes the picked tumble (the lit tab) out of the round; the ones after it move up. Undo brings it back."],coins:["Coins on the board","Click a cell to place what is picked in Place: a coin of that value, a jackpot coin, or Empty to take one off. The same again takes it off. On a respin, the coins already there stay locked."],"brush-coin":["Place a coin","Pick a value, then click cells to place that value\u2019s coin. The values are the ones under Coins, each a coin of its own."],"brush-jackpot":["Place a jackpot coin","Pick it, then click cells to place it. It adds its tier\u2019s value at the collect (set under Coins)."],"tease-reels":["Tease","Reels that slow down and crawl before they land, this round only. They stop last, one by one in the stop order, the one crawling lit and the rest dark; the round leaves them room."],"tease-reel":["Tease this reel","It stops after the others, slowing down and crawling into its stop. Again to stop teasing it."],"tease-cells":["Tease","Cells that slow down and crawl before they land, this round only (every cell spins alone in the Per cell style). T
