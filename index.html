    if (R.grand) buildGrand(screenBox(comp, RBASE + " Grand", rel(R.grand.start)).comp, R, rel);
    if (R.jpShows) buildJackpotShows(screenBox(comp, RBASE + " Jackpot Title", rel(R.jpShows[0].start)).comp, R, rel);

  // ---------- pots above the machine (core/pots.js) ----------
  // Pot i's reactions at time: b = squash or kick, bc = squash from catches
  // only, fl = flash, ch = charge (core/pots.js potBump, potCharge).
  function potExpr(i) {
    var Pd = DATA.pots, k, n1 = 0, n2 = 0, h = "var PH = [", c = "var PC = [";
    for (k = 0; k < Pd.hits.length; k++) if (Pd.hits[k][1] === i) h += (n1++ ? "," : "") + "[" + Pd.hits[k][0] + "," + Pd.hits[k][2] + "]";
    for (k = 0; k < Pd.charges.length; k++) if (Pd.charges[k][2] === i) c += (n2++ ? "," : "") + "[" + Pd.charges[k][0] + "," + Pd.charges[k][1] + "]";
    return h + "];\n" + c + "];\n" +
      "function c01(x){return x<0?0:(x>1?1:x);}\n" +
      "var b = 0, bc = 0, fl = 0, ch = 0;\n" +
      "for (var i = 0; i < PH.length; i++) { var a = time - PH[i][0]; if (a < 0) continue; var d = PH[i][1] ? " + Pd.times[1] + " : " + Pd.times[0] + ";\n" +
      "  if (a < d) { var bb = (PH[i][1] ? 0.55 : 1) * Math.pow(1 - a / d, 2); b = Math.max(b, bb); if (!PH[i][1]) bc = Math.max(bc, bb); }\n" +
      "  if (a < 0.4) fl = Math.max(fl, (PH[i][1] ? 0.7 : 1) * (1 - a / 0.4)); }\n" +
      "for (var j = 0; j < PC.length; j++) { if (time < PC[j][0] || time > PC[j][1] + 0.3) continue; ch = Math.max(ch, Math.min(c01((time - PC[j][0]) / 0.25), c01((PC[j][1] + 0.3 - time) / 0.3))); }\n";
  }
  // The pots stand on the frame's top edge, behind the frame. A catch

  function buildPots(kids) {

      if (!src) continue;
      var s = r4(100 * it.size / src.width), ex = potExpr(i);
      var two = [inst(main, src, it.name, [it.x, it.bottom]), inst(main, src, it.name + " Charge Light", [it.x, it.bottom])];

        P(two[k], "ADBE Scale").expression = ex + "[" + s + " * (1 + 0.08 * b + 0.02 * ch), " + s + " * (1 - 0.08 * b + 0.03 * ch)];";
        kids.push(two[k]);
      }
      two[1].blendingMode = BlendingMode.ADD;

  // Over the frame: each pot's glow (charging, firing, catching) and its

      sh += "]; var sa = 0; for (var q = 0; q < S.length; q++) sa = Math.max(sa, Math.min(c01((time - S[q][0]) / 0.2), c01((S[q][1] + 0.3 - time) / 0.3)));\n" +
        "if (!(" + ctrl("Pot " + (i + 1)) + ".valueAtTime(time) > 0.0001)) sa = 0;\n";

      kids.push(nb.layer);

  // ---------- progressive jackpot boxes (core/jackpots.js) ----------
  // What a box shows at time (jackpotValue): its seed growing while it
  // runs; once won, the amount it paid while it holds, then the seed again.
  function jpValueExpr(it) {
    var J = DATA.jackpots, h = "var HT = [", k;
    for (k = 0; k < it.hits.length; k++) h += (k ? "," : "") + "[" + it.hits[k][0] + "," + it.hits[k][1] + "]";
    return h + "];\nvar SEED = " + it.base + ", GROW = " + it.rate + ", HOLD = " + J.times[2] + ", RUN = " + J.running + ";\n" +
      "var from = 0, v = null;\n" +
      "for (var i = 0; i < HT.length; i++) { if (HT[i][0] > time) break; if (time < HT[i][0] + HOLD) { v = HT[i][1]; break; } if (RUN) from = HT[i][0] + HOLD; }\n" +
      "v === null ? SEED + GROW * Math.max(0, time - from) : v;";
  }
  // How a box reacts at time (jackpotFx): sc = its scale, gl = glow, sw =
  // the light sweep (0..1, else -1), held = showing what it paid.
  function jpFxExpr(it) {
    var J = DATA.jackpots, k, h = "var HT = [", b = "var BT = [";
    for (k = 0; k < it.hits.length; k++) h += (k ? "," : "") + it.hits[k][0];
    for (k = 0; k < it.blinks.length; k++) b += (k ? "," : "") + it.blinks[k];
    return h + "];\n" + b + "];\nvar C = " + J.times[0] + ", BL = " + J.times[1] + ", HOLD = " + J.times[2] + ";\n" +
      "var sc = 1, gl = 0, sw = -1, held = 0;\n" +
      "for (var i = 0; i < HT.length; i++) { var a = time - HT[i]; if (a < 0 || a > C) continue;\n" +
      "  var env = Math.min(1, a / 0.15) * Math.min(1, (C - a) / 0.6);\n" +
      "  sc = Math.max(sc, 1 + env * (0.05 + 0.1 * Math.exp(-3 * a) + 0.025 * Math.sin(a * 12)));\n" +
      "  gl = Math.max(gl, env * (0.75 + 0.25 * Math.sin(a * 10)));\n" +
      "  if (a < 0.9) sw = a / 0.9; if (a < HOLD) held = 1; }\n" +
      "for (var j = 0; j < BT.length; j++) { var a2 = time - BT[j]; if (a2 < 0 || a2 > BL) continue; var kk = Math.sin(Math.PI * a2 / BL); sc = Math.max(sc, 1 + 0.06 * kk); gl = Math.max(gl, 0.8 * kk); }\n";
  }
  // Each box: a glow behind it, its plate (the "Jackpot <tier>" placeholder,

  function buildJackpots(kids) {
    var J = DATA.jackpots, i, k;

      var it = J.items[i], ex = jpFxExpr(it);

      P(jb.layer, "ADBE Scale").expression = ex + "[100 * sc, 100 * sc];";
      kids.push(jb.layer);
      var G = frameAt(jb.comp, "FX Jackpot Glow", it.w * 1.1, it.h * 1.1, { round: 0.3, fill: [1, 1, 1], fillOp: 70, glow: 0.6, glowI: 2 }, it.name + " Glow", jb.at([it.x, it.y]), 0, DUR);
      G.blendingMode = BlendingMode.ADD;

      if (src) {

          try { swp.property("Center").expression = ex + "[(sw < 0 ? -1 : sw * 1.6 - 0.3) * thisLayer.width, thisLayer.height / 2];"; } catch (e1) {}
          try { swp.property("Width").setValue(Math.round(it.h * 0.6)); } catch (e2) {}

        } catch (e4) {}
        var LT = inst(jb.comp, src, it.name + " Light", jb.at([it.x, it.y]));
        LT.blendingMode = BlendingMode.ADD;
        P(LT, "ADBE Opacity").expression = ex + "35 * Math.min(1, gl);";
      }
      var V = text(jb.comp, it.name + " Value", " ", it.size, jb.at(it.value), [1, 0.86, 0.4]);
      textExpr(V, fmtExpr(), "fmt(" + ctrl(it.name) + ".value)");
      var fit = fmtExpr() + "var str = fmt(" + ctrl(it.name) + ".value); var fit = Math.min(1, " + it.fitW + " / (str.length * " + it.size + " * 0.62));\n";
      P(V, "ADBE Scale").expression = fit + "[100 * fit, 100 * fit];";
      P(V, "ADBE Opacity").expression = ex + "held ? 75 + 25 * Math.sin(time * 16) : 100;";
      for (k = 0; k < it.hits.length; k++) {
        var rg = ring(main, [it.x, it.y], it.hits[k][0], it.w * 0.95, it.color);

    }
  }
  // A round's jackpot: its amount flies from the box down into the win
  // meter, in an arc (the meter counts it in on SLOT CONTROL "Meter").
  // With no meter it lands in the middle of the reels, pops and stays
  // until J.until (core/jackpots.js jackpotFlight).
  function buildJackpotFly(comp, R, rel) {
    var J = R.jackpot, it = DATA.jackpots.items[J.box];
    if (!it) return;
    var a = rel(J.fly[0]), b = rel(J.fly[1]), e = rel(J.until);
    var path = "var u = Math.max(0, Math.min(1, (time - " + a + ") / " + (b - a) + ")); var k = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;\n" +
      "var x = " + J.from[0] + " + (" + (J.to[0] - J.from[0]) + ") * k; var y = " + J.from[1] + " + (" + (J.to[1] - J.from[1]) + ") * k - Math.sin(k * Math.PI) * " + J.lift + ";\n";

    fxOpacity(GL, fade, "80 * (1 - f)");
    var T = text(comp, it.name + " Win", J.text, J.size, J.from, [1, 0.86, 0.4]);
    P(T, "ADBE Position").expression = path + "[x, y + " + (J.size * 0.36) + "];";
    P(T, "ADBE Scale").expression = size + "[100 * s, 100 * s];";
    P(T, "ADBE Opacity").expression = fade + "100 * (1 - f);";

  // Boosters (core/timeline.js BOOST): each target cell is marked in its

  // A stroke that thins from the path's end back to its start: After
  // Effects 2020's stroke Taper (Length Units Percent, Start Length 100%,
  // Start Width the tail's %, no ease; core/pots.js beamTaperAt). Earlier
  // versions keep an even stroke. After Effects 26 lists a menu's items,
  // so Percent is found by its name there; before, it is the second item.
  function taperStroke(st, tail) {
    if (tail >= 100) return;
    try {
      var tp = st.property("ADBE Vector Stroke Taper");
      menuPick(tp.property("ADBE Vector Taper Length Units"), /percent|prozent|pourcent|porcentaje|percentuale|procent|%/i, 2);
      tp.property("ADBE Vector Taper Start Length").setValue(100);
      tp.property("ADBE Vector Taper Start Width").setValue(tail);
      tp.property("ADBE Vector Taper Start Ease").setValue(0);
      tp.property("ADBE Vector Taper End Length").setValue(0);

  }
  // Saber beams between the pots and the cells: a Bezier path drawn on by
  // Trim Paths (start = the tail, end = the head; core/pots.js beamState),
  // stroked in soft passes of the pot's colour round a white core, thinning
  // to the tail, with a white-hot ball and a glow riding on the head.
  function buildBeams(comp, R, rel) {
    var i, k, BM = DATA.beam;
    for (i = 0; i < R.beams.length; i++) {
      var bm = R.beams[i], f0 = rel(bm.fire), dur = bm.travel + BM.hold + BM.fade, z = bm.bez;
      var pre = "function c01(x){return x<0?0:(x>1?1:x);}\nvar f = time - " + f0 + "; var tr = " + bm.travel + ";\n" +
        "var u = c01(f / tr); var head = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;\n" +
        "var tail = Math.min(head, c01((f - tr * 0.6) / (tr * 0.4 + " + BM.hold + " + " + (BM.fade * 0.5) + ")));\n";
      var fade = "(1 - c01((f - tr - " + BM.hold + ") / " + BM.fade + "))";
      var onPath = pre + rowsExpr("Q", bm.pts) + "var n = Q.length - 1; var x = head * n; var j = Math.min(n - 1, Math.floor(x)); var kk = x - j;\n[Q[j][0] + (Q[j + 1][0] - Q[j][0]) * kk, Q[j][1] + (Q[j + 1][1] - Q[j][1]) * kk];";
      var L = shapeLayer(comp, (bm.up ? "Beam Up " : "Beam Down ") + (i + 1) + " " + DATA.pots.items[bm.pot].name);
      // The white-hot ball on the head, first so it sits in front.
      var hb = group(L, "Head");
      var el = ellipse(hb, [0, 0], [BM.core, BM.core]);
      el.property("ADBE Vector Ellipse Position").expression = onPath;
      fill(hb, [1, 1, 1], 100);
      var g = group(L, "Beam");
      var p = g.addProperty("ADBE Vector Shape - Group");
      var sh = new Shape();
      sh.vertices = [[z[0], z[1]], [z[6], z[7]]];
      sh.outTangents = [[z[2] - z[0], z[3] - z[1]], [0, 0]];
      sh.inTangents = [[0, 0], [z[4] - z[6], z[5] - z[7]]];
      sh.closed = false;
      p.property("ADBE Vector Shape").setValue(sh);
      var tp = g.addProperty("ADBE Vector Filter - Trim");
      tp.property("ADBE Vector Trim Start").expression = pre + "tail * 100;";
      tp.property("ADBE Vector Trim End").expression = pre + "head * 100;";

        if (ps[2]) continue;
        var fk = "(0.85 + 0.15 * Math.sin(time * 61) * Math.sin(time * 37 + 1))";
        st.property("ADBE Vector Stroke Width").expression = "value * " + fk + ";";
        st.property("ADBE Vector Stroke Opacity").expression = "value * " + fk + ";";
      }
      L.blendingMode = BlendingMode.ADD;
      P(L, "ADBE Opacity").expression = pre + "100 * " + fade + ";";
      trim(L, f0, f0 + dur);
      saberPath(comp, (bm.up ? "Up " : "Down ") + (i + 1) + " " + DATA.pots.items[bm.pot].name, sh, f0, f0 + dur, pre + "head * 100;", pre + "tail * 100;");
      var hd = inst(comp, beamHeadPH(), "Beam Head " + (i + 1), null, f0, f0 + dur);

      hd.blendingMode = BlendingMode.ADD;

  // The beam head's glow: white discs stacked to fade out like the

  function beamHeadPH() {
    var key = "FX Beam Head";

  // Beaming to the pots: each winner fires (a ring in its pot's colour) and

  // ---------- Hold & Spin ----------
  // A coin layer that bounces in at time t, with its value on it.
  // The tease (core/tease.js): while a reel teases, a black solid dims each
  // other reel; scatters and trigger coins that land pop lit over the dim,
  // then fade into it, or stay lit to the end of the tease with "keep
  // scatters lit". Dim % on SLOT CONTROL scales the dim.
  function buildTease(kids) {
    var TE = DATA.tease, TW = [], r, i, t0 = 1e9, t1 = 0;
    var envFn = "function tEnv(w) { var a = w[0] - " + TE.lead + ", b = w[1] + " + TE.tail + "; if (time < a || time > b) return 0; return Math.min(Math.min(1, (time - a) / " + TE.fin + "), Math.min(1, (b - time) / " + TE.tail + ")); }\n";
    for (r = 0; r < DATA.rounds.length; r++) {
      for (i = 0; i < DATA.rounds[r].tease.length; i++) {
        var w = DATA.rounds[r].tease[i];
        if (w[2] < 0) continue;
        TW.push(w);
        t0 = Math.min(t0, w[0] - TE.lead);
        t1 = Math.max(t1, w[1] + TE.tail);
      }
    }
    if (TW.length) {
      for (i = 0; i < DATA.reels; i++) {
        var td = solid(main, [0, 0, 0], "Tease Dim R" + (i + 1), DATA.cellW, DATA.winH, [DATA.reelXs[i], DATA.winTop + DATA.winH / 2]);
        P(td, "ADBE Opacity").expression = rowsExpr("TW", TW) + envFn +
          "var all = 0, own = 0; for (var k = 0; k < TW.length; k++) { var e = tEnv(TW[k]); all = Math.max(all, e); if (TW[k][2] == " + i + ") own = Math.max(own, e); }\n" +
          "(own > 0 ? 0 : " + TE.dim * 100 + " * all) * " + ctrl("Dim %") + " / 100;";
        trim(td, t0, t1);
        kids.push(td);
      }
    }
    for (r = 0; r < DATA.rounds.length; r++) {
      var RR = DATA.rounds[r];
      for (i = 0; i < RR.lands.length; i++) {
        var ld = RR.lands[i];
        kids.push(ring(main, [ld.x, ld.y], ld.t, DATA.cellW * 0.95, DATA.accent));
        var LL = inst(main, symComps[ld.s] || symComps[0], (ld.coin ? "Coin Lands R" : "Scatter Lands R") + (r + 1), [ld.x, ld.y], ld.t, ld.until);
        P(LL, "ADBE Scale").expression = "var u = Math.max(0, Math.min(1, (time - " + ld.t + ") / " + TE.fade + ")); var s = 100 * (1 + 0.25 * Math.sin(u * Math.PI)); [s, s];";
        var lit = "var a = time - " + ld.t + "; var k = a < 0 ? 0 : (a < " + TE.pop + " ? 1 - Math.max(0, Math.min(1, (a - " + TE.fade + ") / " + (TE.pop - TE.fade) + ")) : 0);\n";
        if (TE.keepLit && RR.tease.length) lit += rowsExpr("W", RR.tease) + envFn + "if (a >= 0) for (var j = 0; j < W.length; j++) k = Math.max(k, tEnv(W[j]));\n";
        lit += "100 * k;";
        P(LL, "ADBE Opacity").expression = lit;
        glow(LL, DATA.cellW * 0.2, 1.2);
        kids.push(LL);
        if (ld.lab) {
          var lsz = Math.round(DATA.cellH * 0.3);
          var T = text(main, "Value " + ld.lab[0], ld.lab[0], lsz, [0, 0], [1, 0.9, 0.55]);
          pos(T, [ld.x, ld.y + ld.lab[1] * DATA.cellH + lsz * 0.36 * ld.lab[2]]);
          P(T, "ADBE Scale").setValue([ld.lab[2] * 100, ld.lab[2] * 100]);
          P(T, "ADBE Opacity").expression = lit;
          T.parent = LL;
          trim(T, ld.t, ld.until);
        }
      }
    }
  }
  function coinPop(comp, it, t, dur, lab, name) {
    var L = inst(comp, symComps[it.s] || symComps[0], name, [it.x, it.y], t, t + dur);
    P(L, "ADBE Scale").expression = EASE_LIB + "var k = c01((time - " + t + ") / " + dur + "); var s = 100 * (1 + 0.26 * Math.sin(k * Math.PI)); [s, s];";

  // The turning part of the wheel as one placeholder comp: your face art,

  function wheelDiscPH() {
    var WH = DATA.wheel, D = WH.disc;

      var i, L;
      var part = function (key, rel2) {

      };
      part("Wheel Face", DATA.assets.wheelFace);
      part("Wheel Segments", DATA.assets.wheelSegments);
      for (i = 0; i < WH.icons.length; i++) {
        var ic = WH.icons[i], ia = ic.a * Math.PI / 180;
        var isrc = imagePH("Wheel Icon " + pad2(ic.k + 1), "Wheel", ic.file);
        if (!isrc) continue;
        L = inst(c, isrc, "Icon " + pad2(ic.k + 1), [D / 2 + Math.cos(ia) * ic.r, D / 2 + Math.sin(ia) * ic.r]);
        P(L, "ADBE Rotate Z").setValue(ic.a + 90);
      }
      for (i = 0; i < WH.labels.length; i++) {
        var lb = WH.labels[i], la = lb.a * Math.PI / 180;
        L = c.layers.addText(lb.text);
        L.name = "Label " + (i + 1) + " " + lb.text;
        var prop = L.property("ADBE Text Properties").property("ADBE Text Document");
        var td = prop.value;
        td.fontSize = lb.px;
        td.applyFill = true;
        td.fillColor = WH.fill;
        td.applyStroke = true;
        td.strokeColor = WH.stroke;
        td.strokeWidth = Math.max(1, Math.round(lb.px * 0.22));
        td.strokeOverFill = false;
        td.justification = ParagraphJustification.CENTER_JUSTIFY;
        try { td.font = WH.font; } catch (e) { try { td.font = DATA.font; } catch (e2) {} }
        prop.setValue(td);
        textExpr(L, null, undefined, "Wheel Font");
        // Turn about the middle of the text, reading outwards.
        P(L, "ADBE Anchor Point").setValue([0, -lb.px * 0.36]);
        pos(L, [D / 2 + Math.cos(la) * lb.r, D / 2 + Math.sin(la) * lb.r]);
        P(L, "ADBE Rotate Z").setValue(lb.a);

eeking over its top edge.","pots-overlap"),"m-pots-plates":D("features","Pot nameplates","A plate on the frame under each pot shows what it caught this round, counting up with every beam.","plates"),"m-pots-aim":D("features","Which pot fires or catches","Nearest: each cell goes to the pot above its reels. By symbol: each symbol has its pot (gems to the pot of gems, fruit to the pot of fruits). Or the pots take turns, or one pot does it all.","pots-aim"),"m-pot-role-0":D("features","What a pot does","Collects wins (winners beam up into it), upgrades cells (it fires boosters), or both. A pot that does not do something passes it to the nearest one that does."),"m-pots-collect":D("features","Winners beam up into the pots","Every winner fires a beam up into its pot, one by one; each catch counts up the win and the pot's nameplate. The same switch as Wins \u2192 Beam to pots.","beam-collect"),"m-pot-owners":D("features","Each symbol's pot","By symbol: the pot a symbol's winners beam to, and the pot that fires a booster making that symbol. Auto follows the pots' art."),"jp-on":D("features","Jackpot boxes","Grand, Major, Minor and Mini boxes around the machine. Their values are the Hold & Spin jackpots, fixed or running up. A jackpot won on the machine lights its box and pays what it shows; a box with its win title on (the Major, unless you change it) also takes the whole screen. Jackpot coins show only their name.","jackpots"),"jp-place-above":D("features","Boxes above","A row over the machine, under the title.","jp-above"),"jp-place-below":D("features","Boxes below","A row under the machine, above the win meter.","jp-below"),"jp-place-left":D("features","Boxes on the left","A column beside the machine; the machine moves over to make room.","jp-left"),"jp-place-right":D("features","Boxes on the right","A column beside the machine; the machine moves over to make room.","jp-right"),"jp-place-sides":D("features","Left and right","Four boxes, two on each side of the machine.","jp-sides"),"jp-place-ends":D("features","Above and below","Four boxes, two above the machine and two below it.","jp-ends"),"jp-sizing-tiers":D("features","Sized by tier","The Grand biggest, then the Major, the Minor and the Mini.","jp-sizing"),"jp-sizing-same":D("features","All the same size","Every box the same size.","jp-sizing"),"jp-padding":D("features","Distance from the machine","How far the boxes stand from the frame. Below 0 they tuck over its edge.","jp-padding"),"jp-spacing":D("features","Space between boxes","The gap between one box and the next.","jp-spacing"),"jp-values-fixed":D("features","Fixed values","Each box shows its seed value, always.","jp-values"),"jp-values-running":D("features","Running values","The numbers climb like a progressive jackpot. Won, a box shows what it paid for a moment, then starts again from its seed.","jp-values"),"jp-growth":D("features","Running speed","How much of its seed a running box adds every second.","jp-values"),"jp-titles":D("features","Win title","Pick the boxes whose win takes the whole screen: the box's name and JACKPOT, with the amount counting up (and the win meter with it). A box without one flies its amount into the win meter, or with no meter into the middle of the reels. Only the Major has one at first. A full Hold & Spin board shows the Grand's own screen either way.","jp-title"),"jp-decimals-auto":D("features","Decimals as the bet","Amounts show cents when the bet is typed with them (1.00), whole numbers when not (1). The same setting as Machine \u203A Money, for every amount."),"jp-decimals-0":D("features","Whole numbers","Every amount without cents: 1,250."),"jp-decimals-2":D("features","Two decimals","Every amount with cents, even a whole one: 1,250.00."),"sec:machine/reels":D("machine","Reels","Reels and rows, the size of each cell, how much of the symbols above and below shows, a drum-like curve and lines between the rows.","peek"),"sec:machine/how-it-pays":D("machine","How it pays","How wins are found (paylines, ways, anywhere or clusters), how many symbols pay, and how many scatters trigger a feature.","pay-mode"),"sec:machine/framing":D("machine","Framing","Zoom scales the machine with its pots, title and win meter about their middle: out to fit tall pots, in to fill the screen.","machine-zoom"),"sec:machine/look":D("machine","Look","The theme colours, the title (or your logo) above the machine, the marquee bulbs and the win meter under the reels.","marquee"),"sec:machine/money":D("machine","Money","The bet, the currency sign (none by default) and how many decimals every amount shows. As the bet follows how you typed it: 1 shows whole numbers, 1.00 decimals."),"sec:machine/randomness":D("machine","Randomness","Filler symbols come from a seed, so every render is identical. Shuffle picks a new seed."),"sec:features/pots-above-the-machine":D("features","Pots above the machine","Up to three pots stand on the frame where the title was. Winners beam up into them, and they fire boosters that upgrade cells.","pots"),"sec:features/jackpot-boxes":D("features","Jackpot boxes","Grand, Major, Minor and Mini boxes around the machine, with fixed or running values. A jackpot won lights its box.","jackpots"),"sec:spin/spin-type":D("spin","Spin type","How the reels move: together, staggered, turbo, teasing the last reel, cascading or cell by cell. Point at a card to see it."),"sec:spin/respins":D("spin","Respins","How the empty Hold & Spin cells respin: their direction and the order they stop in."),"sec:spin/reel-order":D("spin","Reel order","Which reel starts and which stops first: left to right, right to left, centre out, outside in, random or your own order.","stop-order"),"sec:spin/motion-curve":D("spin","Motion curve","A reel's speed over its spin, drawn as a graph. The Start, Mid and End sections below shape it."),"sec:spin/start":D("spin","Start","How a reel gets going: a wind-up pull back, an ease in, or instantly.","start-windup"),"sec:spin/mid":D("spin","Mid","The full-speed stretch: how long it spins, how fast, and its motion blur.","blur"),"sec:spin/end":D("spin","End","How a reel lands: bounce, elastic, hard stop or soft, how long it takes and how far it overshoots.","end-bounce"),"sec:spin/reel-timing":D("spin","Reel timing","The delay between one reel starting, or stopping, and the next.","stop-stagger"),"sec:spin/anticipation":D("spin","Anticipation","The tease on a reel that could still trigger: extra time, a slower crawl, a zoom in, and scatters kept lit.","antic-time"),"sec:spin/between-rounds":D("spin","Between rounds","The gap between rounds, and the holds before the first and after the last."),"sec:wins/winning-symbols":D("wins","Winning symbols","How winners celebrate: pop in place, fly to a spot (counting into the win or fusing into one big symbol), or beam to the pots; with the winning lines and the rest dimmed.","winfx-fly"),"sec:wins/win-timing":D("wins","Win timing","How long each kind of win shows, the count-up per big win tier, and the beats of tumbles, multipliers and wilds."),"sec:effects/camera":D("effects","Camera","Every camera move in one place: following the winners of a win that lands on a merge or a win title, pushing in on a teased reel, and on the wheel pointer as it slows. In After Effects the WIN CAMERA and CAMERA nulls do it, scaled by Win Camera % and Zoom %.","win-camera"),"cam-follow":D("effects","Follow the winners","The camera pushes in on the winning symbols and lets go on the merge or as the win title appears. The area frames them all and glides in as they gather, one smooth move; One by one visits each as it lifts, in the Fly order. It runs only on a win that lands on something, a merge into a big symbol (Fly \u203A Fuse) or a win title; a round can pick its own in the round inspector.","win-camera-mode"),"cam-zoom":D("effects","How close","The most the win camera zooms in, as a multiple of the full view. The area frames every winner, so a spread-out win stays wider."),"cam-calm":D("effects","Calm","How slowly the win camera glides. The area: how long it averages its frame over, so it never reacts to one symbol. One by one: how long each glide from winner to winner takes."),"cam-release":D("effects","Zoom out","On the merge: as the symbols fuse. As the title appears: just before the win title, so the title lands as the camera settles. A win with only one of them uses that one."),"cam-kick":D("effects","Release kick","The zoom out overshoots past the full view and settles back, like a breath out; the background grows to keep the screen covered. 0 eases straight out."),"cam-map":D("effects","Camera viewport","While the camera is in, a small map of the whole frame at the top right of the preview outlines the part on screen. Only in the editor: never in the MP4, the still frame or After Effects."),"ri-camera":D("round","Camera for this round","Follows Effects \u203A Camera, or picks Off, The area or One by one for this round alone. It runs only when the round's win lands on a merge or a win title."),"sec:effects/intensity":D("effects","Intensity","How strong each effect is, from payline glow and sparkles to light rays, screen shake, flashes and bloom.","shake"),"sec:effects/explosion-templates":D("effects","Explosion templates","Every particle explosion, playing live. Pick one for each win moment in Win particles."),"sec:effects/titles-and-font":D("effects","Titles and font","The display font for titles, counters and wheel labels, and the words of each feature title."),"sec:wheel/segments":D("wheel","Segments","Clockwise from the top: each segment's fill, icon, label and value, and whether it is a prize, a spin again or no win.","seg-icons"),"sec:wheel/framing":D("wheel","Framing","How the wheel sits on screen: whole, half from below, a close-up or rising in, with its own zoom and centre.","frame-half"),"sec:wheel/pointer":D("wheel","Pointer","Where the pointer sits, its size and art, and how pegs bend it as they pass.","pointer-top"),"sec:wheel/look":D("wheel","Look","The labels' font, colour, size and height, the icons, the centre icon, the hub and which parts show.","label-height"),"sec:wheel/spin":D("wheel","Spin","How many turns it makes, how it lands by default (centre, random, tease, almost slips) and whether values are multiplied by the bet.","wheel-slip"),"sec:sound/sound-track":D("sound","Sound track","Every cue is made in sync with the animation. Set the volume and each group's level; it plays with the preview, goes into the MP4 and ships to After Effects."),"sec:export/output":D("export","Output","The project name, canvas size, frame rate and transparent background for every export."),"sec:export/after-effects-project":D("export","After Effects project","The main export: a zip with a script that rebuilds this animation as an editable After Effects project, in every format you pick. With several formats the art (symbols, particles, pots, titles, the logo) is built once in Shared Placeholder Comps and every format uses it: replace or animate it there and every format follows."),"x-extra":D("export","Extra rows below the play rows","A taller format (9:16, 4:5) can show more rows of symbols under the play rows so the machine fills the screen. They spin and stop with the reels; wins, lines, counts, timing and sound stay on the play rows, so every format is the same animation. The extra rows never show a winning symbol, a special or three alike side by side, nor (for ways, pay anywhere and clusters) what would look like a win; a full-screen win fills them too and they join it, an expanding wild covers them, in a tumble they stay put while the play rows above them tumble, and under a Hold & Spin bonus they stay dimmed. 0 unless you set it; Fill picks as many as fit. Not for Hold & Spin or the wheel.","extra-rows"),"x-fill-format":D("export","Fill the screen","Sets as many extra rows as the format has room for without the machine getting smaller."),"sec:export/quick-preview-mp4":D("export","Quick preview (MP4)","A quick video to share, rendered frame by frame at full resolution, with or without the sound track."),"sec:export/soundtrack-wav":D("export","Soundtrack (WAV)","The whole mix as the preview plays it, for editing the sound elsewhere."),"format-strip":D("export","Formats under the preview","Every format you are likely to export, live at the playhead: 16:9, 9:16, 1:1, 4:5, the Canvas and any other package format, each with its own layout and extra rows on the same timeline. Click one to preview it full size; the card beside it sets its extra rows and whether the After Effects package includes it. Fold it to a bar to give the preview more room.","extra-rows"),"fs-thumb":D("export","Preview this format","Makes it the Canvas: the preview, the MP4 and the still frame use it. A gold +3 means 3 extra rows; a faded picture is not in the After Effects package yet."),"fs-include":D("export","In the After Effects package","Whether the package builds this format: each format gets its own comps, laid out for its size, and the art is shared. Keep at least one."),"tl-length":D("timeline","Animation length","The whole animation, from the first frame to the last. Each round\u2019s block shows how long it runs (in gold when you set it), and faint lines mark where a 15, 30 or 60 second cut would end, so a piece for TikTok, Reels or Shorts is easy to plan. Fit beside it sets the whole length; a round\u2019s own is in the round inspector."),"tm-fit":D("spin","Whole animation length","Fits the whole animation to a length: 15, 30 or 60 seconds for a social cut, or your own. The waiting parts of every round stretch or squeeze together (spin length, anticipation, how long a win shows, counts, holds, banners, the gaps); starts, stops, flights and pops keep their feel. Rounds with a length of their own keep it. A length out of reach stops at the shortest or longest the animation can be, and says so."),"tm-fit-own":D("spin","Your own length","The whole animation's length in seconds, when 15, 30 or 60 do not fit the cut."),"ri-fit-on":D("round","Set this round's length","Gives this round a length of its own: its waiting parts (spin length, anticipation, how long the win shows, counts, holds, the gap after it) stretch or squeeze to land on it, and its starts, stops, flights and pops keep their feel. Off, it runs as long as its timings make it."),"ri-fit":D("round","Round length","How long this round runs, from its spin to the next round. The slider stops at the shortest and longest it can be; its timeline block shows the length in gold."),"sec:export/still-frame":D("export","Still frame","The frame under the playhead as a PNG, without the background when Output says transparent."),"sec:export/project-file":D("export","Project file","Everything in one .json file, your images and sounds included, to reopen the exact animation later."),"sec:seq/quick-sequence":D("seq","Quick sequence","Builds a whole run of rounds in one go: warm-up spins, then the finale you pick."),"art-progress":D("bank:all","Your art","How much of this machine is your own art: every piece the project shows (symbols, coins, the particles its moments throw, wheel parts, the background, frame and logo, pots and jackpot boxes when they are on) and how many you have replaced. Click a bar to open that kind. Sounds count apart: yours, off and built-in."),"fk-about":D("bank:scene","Smart frame","Your own machine frame, for every format: the app builds it around the machine, its corners (and a crest) as drawn, its edges growing to fit any number of reels and rows, in the preview, the MP4 and After Effects. Load a frame PNG in the frame builder, or paint one on the template. It takes the built-in frame's place; the marquee bulbs stay on it while they are on.","frame-builder"),"fb-open":D("bank:scene","Frame builder","Opens the frame builder, a window like this one: load a PNG of your frame (its reel window clear), and it is sliced for you. Drag its cut lines to adjust, choose how each edge grows and see it on other machines. Every change shows in the preview at once.","frame-builder"),"fk-template":D("bank:scene","Smart frame template","Another way to make a smart frame: a zip to paint in, the sheet as a Photoshop file with guides on every slice line and a hidden layer that shows what each part does, the same sheet as a PNG, a picture of how it grows and a README. Paint it, export a PNG with transparency and load it in the frame builder: a sheet is used as it is, with no slicing.","smart-frame"),"fk-fill":D("bank:scene","Template edges and dividers","For a frame painted on the template. Repeat to fit lays whole tiles of each edge along the frame, each a little wider or narrower so they fit: best for patterns (studs, lights, carvings). Stretch pulls one piece across: best for smooth metal. Corners and ornaments never stretch. A frame from the builder sets this per edge in the builder.","fk-fill"),"fk-clear":D("bank:scene","Remove your frame","Takes your smart frame off the machine; the built-in frame comes back. Undo brings yours back."),"fb-load":D("builder","Load your frame","A PNG (or WebP) of your machine frame with transparency, its reel window clear. The builder finds the window, how thick the frame is, where the corners end and any piece in the middle of an edge (a crest, a plate). A big picture is kept at 2000 px. The smart frame template's sheet, painted, is used as it is."),"fb-iso":D("builder","Lines to work on","Shows one kind of line alone, with round handles, so nothing else is in the way: where the corners end (gold), the middle pieces (pink), the section that repeats (green) or the reel window (blue). Drag a line or its handle; arrow keys nudge the one you picked, Shift for 10 px."),"fb-parts":D("builder","Show parts","Colours your frame by what happens to each part: red stays as drawn (corners, middle pieces), blue grows, green is the section repeated, a dashed box a pattern added whole."),"fb-slices":D("builder","Show slices","On the other machines: red stayed as drawn, blue grew, green is each repeated copy."),"fb-other":D("builder","On other machines","Your frame around a few machines it was not drawn for (3 reels, 7 reels, portrait, square), so you see how it grows before you change your reels or formats.","frame-builder"),"fb-sec-edges":D("builder","How the edges grow","Each edge is one strip of your art: corners and middle pieces stay as drawn, the rest grows. Keep the art adds whole repeats of a pattern and widens the plainest columns. Repeat a section copies a stretch that joins onto itself (the green lines). Stretch draws it longer.","fb-modes"),...Object.fromEntries(["top","bottom","sides"].map(e=>[`fb-mode-${e}`,D("builder",`How the ${e==="sides"?"sides grow":`${e} edge grows`}`,"Keep the art: whole repeats of its pattern, the rest into its plainest columns, so studs, stripes and glyphs keep their shape. Repeat a section: copies of one stretch that joins onto itself, from one green line to the other. Stretch: drawn longer, for smooth metal.","fb-modes")])),...Object.fromEntries(["top","bottom","sides"].map(e=>[`fb-rep-${e}`,D("builder","Pattern repeat","How long one repeat of the pattern is, in your frame's pixels, when the builder does not find it (or finds another). 0: the one it finds.")])),"fb-sec-middle":D("builder","Middle pieces","A crest, a plate or a knot in the middle of an edge keeps its shape, and the edge grows evenly on both sides of it, so it stays in the middle."),...Object.fromEntries(["top","bottom","sides"].map(e=>[`fb-mid-${e}`,D("builder","Keep its middle whole",`The middle of the ${e==="sides"?"sides":`${e} edge`} stays as drawn and the edge grows either side of it. Turned on where none was found, it starts as a fifth of the edge: drag its pink lines.`)])),"fb-sec-clean":D("builder","Clean up","Remove glow takes away the faint haze left around a cut-out; Mirror uses the left half for both sides. Reset to auto keeps both."),"fb-sec-fit":D("builder","Fit","How big your frame is drawn against the reels, how far in over them, and room for it: with Make room for the frame on, the machine is a little smaller so a crest or lanterns stay on screen, clear of the title and the win meter."),"fb-room":D("builder","Make room for the frame","The machine gets a little smaller in every format, so the whole frame (its crest, its lanterns) fits between the title and the win meter, and jackpot boxes stand clear of it. Off: the machine keeps its size and the frame may reach into the title."),"fb-div-colour":D("builder","Divider colour","The colour of the line between the reels; with Metal sheen on it shades from dark to bright across."),"fb-div-shadow":D("builder","Drop shadow","A soft shadow beside each divider, so it stands off the reels."),"fb-div-sheen":D("builder","Metal sheen","Shades the divider like polished metal; off, it is one flat colour."),"fb-zoom":D("builder","Zoom","Closer in on your frame, to place a line on the exact pixel: \u2212 and + (or the keys), Fit shows it whole. Scroll or pinch zooms where you point; drag to move around."),"fb-found":D("builder","What the builder found","The reel window, how thick the frame is, how wide the corners are, the middle pieces kept whole, dividers drawn into the frame and any pattern it adds whole. Each colour is a kind of line on your frame."),"fb-clean":D("builder","Remove glow","Takes away faint paint left around a cut-out (a coloured haze), keeping the solid frame. Higher takes more."),"fb-mirror":D("builder","Mirror","Uses the left half of your frame for both sides, turned over on the right: for a frame meant to be symmetrical that came out a little off."),"fb-sec-dividers":D("builder","Dividers between reels","A colour line (with a drop shadow and a metal sheen if you like), a strip cut from your frame (the divider drawn into it when it has one) or none. With per-cell spins, a line between the rows too."),"fb-div":D("builder","Divider","A colour line, a strip from your frame (its own divider when it has one), or none."),"fb-div-width":D("builder","Divider width","How wide the divider is, against the gap between the reels."),"fb-thick":D("builder","Frame size","How big your frame is drawn against the reels: 100% keeps it in proportion to the reels it was drawn around."),"fb-over":D("builder","Over the reels","Moves the frame in over the edge of the reels, for a frame whose window is a little bigger than the reels it should hold."),"fb-bulbs":D("builder","Marquee bulbs","The chasing bulbs on your frame: off, along its straight stretches (not over the corners or a crest), or all around. The same switch as Marquee bulbs in Machine \u203A Look.","marquee"),"fb-bulb-line":D("builder","Bulb line","Where across the frame the bulbs sit: towards its outer edge or towards the reels."),"fb-sec-orns":D("builder","Ornaments","A crest, a gem or a plate painted in the machine's metal (the crest and the plate with your words), or your own PNG, over the frame. Each sits at a place on the frame (the top, a corner, a side) and moves from there; drag one in the preview. It keeps its place and its size against the frame in every format, the marquee bulbs leave it clear, and After Effects gets the ornaments as their own layer.","fb-ornaments"),"fb-orn-add-crest":D("builder","Add a crest","A shield in the machine's metal with a number or a word on it, on the top of the frame to begin with.","fb-ornaments"),"fb-orn-add-gem":D("builder","Add a gem","A jewel in a metal setting, on the top left corner to begin with.","fb-ornaments"),"fb-orn-add-plate":D("builder","Add a plate","A name plate in the machine's metal with your words (JACKPOT to begin with), on the bottom of the frame.","fb-ornaments"),"fb-orn-add-yours":D("builder","Add your PNG","Your own ornament: a PNG (or WebP) with transparency, drawn at the frame's scale (Size makes it bigger or smaller). A big picture is kept at 1200 px."),"fb-orns":D("builder","Your ornaments","Each ornament: where it sits on the frame, its words (a crest or a plate), its size, and how far it is moved, across and up or down, in frame widths, so it stays put in every format. The trash can takes it off. Drag one in the preview to move it."),"fb-kit":D("builder","Save to My kit","Keeps this frame, its settings and its ornaments in My kit (Asset Bank), for your other projects. With Start new projects with it on, every new project starts with it."),"fb-reset":D("builder","Reset to auto","Slices your frame again as the builder first found it: the lines you moved, the middle pieces and how each edge grows go back. The dividers, clean up and fit stay."),"fb-remove":D("builder","Remove frame","Takes your frame off the machine; the built-in frame comes back. Undo brings yours back."),"art-download":D("bank:all","Download all art","Every piece of art in the bank, built-in or yours, as PNGs in a zip at the size the app uses them, with a README on which row each goes back to. Edit them in Photoshop or anywhere else and upload each to its row. In one kind (Scene, Symbols\u2026) the zip holds that kind. Built-in wheel parts stay out: they are painted in pieces that do not follow the upload layout."),"art-download-piece":D("bank:all","Download to edit","This piece as a PNG: yours as you gave it, or the built-in one painted at the size the app uses. Edit it and upload it back here. Built-in symbols and coins are 512 px squares; a jackpot box comes as the plate alone, since the app writes its name and value over it."),"art-download-frame":D("bank:scene","Download the frame overlay","The machine's frame alone, painted at the size of the format on screen, its reel window clear: the ring, the dividers and the bulb sockets. Edit it and upload it back as the frame overlay; it lines up in this format. For a frame that fits every format and grows with the reels and rows, use the smart frame above."),"art-builtin-only":D("bank:all","Built-in only","Hides every piece that is already yours, so what still uses the built-in art stands out before you hand the project over. Click again to see everything."),"sec:bank/scene-art":D("bank:scene","Scene art","The background, a frame overlay and your logo. With the pots and jackpot boxes on, their art follows here."),"sec:bank/symbols":D("bank:symbols","Symbols","Each symbol is fitted to its cell. Role: what it does (point at a role, or at the role chips under the symbols). Low or high pay: a round set to Auto wins with a low-pay symbol on a small win, a high-pay one on a bigger win. Shows up: how often it fills the reels around the wins. Built-in art for roles your set lacks sits after your symbols."),"sec:bank/hold-spin-coins":D("bank:coins","Hold & Spin coins","Their own set, apart from the symbols. Values are in bets and shown on the coin (5 shows $5 at a $1 bet). The jackpot coins (Mini, Minor, Major) win their box. A label is painted on built-in coin art; your art is used as it is. Cash symbols on the slot reels use the regular coin. In After Effects each coin is its own comp."),"sec:bank/particle-art":D("bank:effects","Particle art","The art the win explosions throw: one PNG, several PNGs for an animation (a spinning coin, a flapping banknote), or a sprite sheet. A built-in takes your art from the upload button on its card and keeps its name and every use. Pick which particle each win moment uses in Effects \u203A Win particles. In After Effects each particle is a placeholder comp."),"sec:bank/win-effects":D("bank:effects","Win effects","Light rays, shockwaves, cell frames and coin bursts are drawn live. In After Effects each is a placeholder comp in Placeholder Comps/Effects with an FX CONTROLS layer (size, opacity, colour, motion); drop a prerendered movie into one and every use plays it."),"sec:bank/jackpot-box-art":D("bank:scene","Jackpot box art","Each box is painted in its colour until you give it art. Names, seeds and colours are with the boxes in Features. In After Effects each box is its own placeholder comp."),"sec:bank/pot-art":D("bank:scene","Pot art","Each pot stands on the frame. Which pot is which, its colour and role are with the pots in Features. In After Effects each pot is a placeholder comp in Placeholder Comps/Pots."),"sec:bank/wheel-art":D("bank:wheel","Wheel art","The face turns with the wheel and shows through segments with no colour; the rim frames it; the hub sits in the middle; the pointer hinges near its top. In After Effects each is a placeholder comp in Placeholder Comps/Wheel."),"sec:bank/your-own-sounds":D("bank:sounds","Your own sounds","Your file plays from its start at each cue, at the track volume and its group level. A cue without your file plays its built-in placeholder; a cue turned off is left out of the preview, the MP4, the WAV and After Effects. In After Effects each cue is its own audio layer in the SFX comp."),"sec:bank/my-kit":D("bank:sounds","My kit","The house style most of your machines share, set up once: your sounds, your fonts, your particle art and your frame, kept in this browser for every project. Each part saves and goes into a project on its own. Each project keeps its own copy, so a finished project does not change when you update the kit. Export saves the kit as a file for another browser, the other copy of the app or a teammate."),"kit-save-sounds":D("bank:sounds","Save the sounds in my kit","Keeps this project's sound design in your kit: your own files, the cues turned off, the volume and the group levels. Saving again updates it."),"kit-use-sounds":D("bank:sounds","Use the kit's sounds here","Puts your kit's sounds, Off cues and mix into this project, in place of its own (sounds are one set of slots). Undo brings them back."),"kit-del-sounds":D("bank:sounds","Take the sounds out of my kit","Click twice. Projects keep the sounds they have."),"kit-save-fonts":D("bank:fonts","Save the fonts in my kit","Keeps this project's font files in your kit, with the display font and wheel label font when they are among them. A built-in or catalogue font picked in a project stays with that project."),"kit-use-fonts":D("bank:fonts","Use the kit's fonts here","Adds your kit's font files to this project (a font of the same name is replaced; none is removed) and, when the kit has them, makes its display font and wheel label font this project's."),"kit-del-fonts":D("bank:fonts","Take the fonts out of my kit","Click twice. Projects keep their fonts."),"kit-save-particles":D("bank:effects","Save the particle art in my kit","Keeps this project's particle art in your kit: your art for the built-in particles (coin, star, confetti...) and your own particles. Which win moment uses which particle stays with each project."),"kit-use-particles":D("bank:effects","Use the kit's particle art here","Adds your kit's particle art to this project: your art replaces the built-in particles it was made for, everywhere they are used, and your own particles join the list. Nothing is removed."),"kit-del-particles":D("bank:effects","Take the particle art out of my kit","Click twice. Projects keep their particle art."),"kit-save-frame":D("bank:scene","Save the frame in my kit","Keeps this machine's frame in your kit: the frame builder's (its picture, how it is sliced and grown, its ornaments) or a sheet painted on the template. Saving again updates it."),"kit-use-frame":D("bank:scene","Use the kit's frame here","Puts your kit's frame on this machine, in place of its own, ornaments and all, in every format. Undo takes it off."),"kit-del-frame":D("bank:scene","Take the frame out of my kit","Click twice. Projects keep their frames."),"kit-auto":D("bank:sounds","Start new projects with it","New projects, presets and the demo come with every part of your kit. Opening a project file keeps what is saved in it."),"kit-export":D("bank:sounds","Export the kit","Saves the whole kit as a .reelkit.json file with its sounds, fonts and art inside. Import it in another browser, in the other copy of the app (each keeps its own kit) or on a teammate's machine."),"kit-import":D("bank:sounds","Import a kit","Opens a .reelkit.json (or an older .soundkit.json) file: the parts it holds replace those parts of your kit; the others stay. Use here puts a part in this project."),"sec:bank/fonts":D("bank:fonts","Fonts","Your fonts come first in the font list. They ship in the After Effects package; install them there."),"sym-w-help":D("bank:symbols","Shows up","How often a symbol fills the reels around the wins, in stages, with its share of them. Only in wins: never as filler, but it still wins when a round picks it. Wilds, scatters and the like only show where a round puts them."),"sym-tier-help":D("bank:symbols","Low or high pay","A round whose symbol is Auto wins with a low-pay symbol on a small win and a high-pay one on a bigger win. Pots that upgrade cells turn them into low-pay symbols. Amounts come from the round, not from this."),"sym-roles-help-normal":D("bank:symbols","Paying symbols","Make the wins, along lines, ways or in clusters. Low or high pay decides which one a round set to Auto wins with.","pay-mode"),"sym-roles-help-wild":D("bank:symbols","Wild","Stands in for any paying symbol to complete a win. A round can make it expand, stick, walk or carry a multiplier.","expand"),"sym-roles-help-scatter":D("bank:symbols","Scatter","Counts anywhere on the reels; enough of them trigger free spins or the bonus. One short is a near miss, teased on the last reel.","scatter-lit"),"sym-roles-help-multiplier":D("bank:symbols","Multiplier","Lands with an x value and flies into the win to multiply it. Without one in your set the machine draws its built-in orb.","mult"),"sym-roles-help-mystery":D("bank:symbols","Mystery","Blocks land, glow and turn over together into one symbol. Without one in your set the machine draws its built-in block.","mystery"),"sym-roles-help-collector":D("bank:symbols","Collector","Gathers the value of every cash coin on the reels into the win. Without one in your set the machine draws its built-in collector.","collector"),"sym-roles-help-bonus":D("bank:symbols","Bonus","Triggers the bonus. A machine without a scatter uses it as its scatter.","bonus"),"sym-roles-help-cash":D("bank:symbols","Cash coin","A coin with a value on the slot reels; a collector gathers them. Its art is the regular coin in Coins.","cash"),"coin-kinds-help-regular":D("bank:coins","Regular coin","Lands and locks with a value in Hold & Spin; on the slot reels it is the cash coin.","holdspin"),"coin-kinds-help-special":D("bank:coins","Special coins","Your own coins with a label and values, placed in the respins of a round."),"coin-kinds-help-jackpot":D("bank:coins","Jackpot coins","Mini, Minor and Major: collecting one wins its jackpot box; a full board wins the Grand.","jackpots"),"coin-kinds-help-empty":D("bank:coins","Empty cell","What a cell shows before a coin lands. Built-in: a dark socket."),"jp-art-names":D("bank:scene","Names on your box art","Writes each box's name on your uploaded art. Turn it off when your art already says GRAND, MAJOR and so on."),"m-beam-curve-arc":D("features","Simple arc beams","Each beam bows out in one smooth curve.","beam-collect"),"m-beam-curve-s":D("features","S-curve beams","Each beam swings out one way, then the other, like a whip.","s-curve"),"m-beam-bend":D("features","Beam bend","How far the beams bow out from a straight line.","beam-bend"),"m-beam-width":D("features","Beam thickness","How thick the trail is next to the head; Taper thins it towards the tail. It leaves the head alone. Thickness and Head size share their units: the same number makes the trail as thick as the head, a comet.","beam-width"),"m-beam-taper":D("features","Beam taper","How much the beams thin from the head back to the tail, like a comet. 0 keeps them even; 1 brings the tail to a point. After Effects gets the same taper on each beam's strokes (Stroke \u203A Taper \u203A Start Width).","beam-taper"),"m-beam-head":D("features","Beam head size","How big the round glowing head is, with its white-hot ball. Thickness sets the trail on its own. In After Effects the glow is the FX Beam Head placeholder and the ball is the Head group in each beam layer.","beam-head"),"m-beam-travel":D("features","Beam travel time","How long a beam takes to reach its pot or cell.","beam-travel"),"m-beam-stagger":D("features","Time between beams","The gap between one beam firing and the next.","beam-stagger"),"spin-type-classic":D("spin","Classic spin","All reels start together and stop one after another in the stop order.","spin-classic"),"spin-type-stagger":D("spin","Staggered start","Reels kick off one after another, like a wave.","spin-stagger"),"spin-type-turbo":D("spin","Turbo spin","A short spin: the reels slam down almost together.","spin-turbo"),"spin-type-tease":D("spin","Tease last reel","The last reel to stop always slows down with an anticipation glow.","spin-tease"),"spin-type-cascade":D("spin","Cascade drop","Symbols fall out and new ones drop in, column by column (Sweet Bonanza style).","spin-cascade"),"spin-type-cells":D("spin","Per-cell spin","Every cell is its own little reel and stops on its own.","spin-cells"),"spin-start-windup":D("spin","Wind-up start","The reels pull back a little before they spin off.","start-windup"),"spin-start-ease":D("spin","Ease-in start","The reels speed up smoothly.","start-ease"),"spin-start-instant":D("spin","Instant start","The reels jump straight to full speed.","start-instant"),"spin-end-bounce":D("spin","Bounce stop","Each reel hits its stop still moving and bounces back off it, twice, like a ball. Overshoot sets how high.","end-bounce"),"spin-end-elastic":D("spin","Elastic stop","Each reel runs past its stop and springs back and forth around it, smaller each time, before it settles. Overshoot sets how far.","end-elastic"),"spin-end-hard":D("spin","Hard stop","The reel stops dead on its symbols.","end-hard"),"spin-end-soft":D("spin","Soft stop","The reel glides to a gentle stop.","end-soft"),"spin-blur":D("spin","Motion blur","Smears the symbols while the reels spin fast.","blur"),"spin-speed":D("spin","Top speed","How fast the reels run in the middle of the spin.","speed"),"spin-mid":D("spin","Spin length","How long the reels run at full speed before stopping.","spin-length"),"spin-ss":D("spin","Start stagger","Delay between one reel starting and the next.","start-stagger"),"spin-st":D("spin","Stop stagger","Delay between one reel stopping and the next.","stop-stagger"),"spin-ant":D("spin","Anticipation time","Extra time a teased reel keeps spinning, slowly, before it lands.","antic-time"),"spin-ant-v":D("spin","Anticipation crawl speed","How fast a teased reel crawls while it builds suspense.","antic-crawl"),"spin-zoom-on":D("effects","Push in on a teased reel","The camera pushes in on the teased reel, follows it from reel to reel and eases out after it lands. How long a tease lasts is in Spin \u203A Anticipation.","zoom"),"spin-zoom":D("effects","Tease zoom","How far the camera pushes in on a teased reel.","zoom-amount"),"spin-scatter-lit":D("spin","Keep scatters lit through the tease","While a reel teases the others dim. Scatters that already landed stay lit and glowing over the dim until the teased reel lands; off, they pop and fade back into it.","scatter-lit"),"spin-stop-order":D("spin","Stop order","Which reel stops first. The tease goes to the reels that stop last.","stop-order"),"sec:wins/win-tiers":D("wins","Win tiers","Big win titles (BIG, MEGA, EPIC...), each from its threshold in bets. A big win shows the tier it reaches, or climbs through every tier on the way.","tiers"),"tier-titles-final":D("wins","Only the tier reached","A big win shows just the title of the tier it reaches: EPIC WIN straight away, with one count up and that tier's particles.","tier-titles"),"tier-titles-climb":D("wins","Climb through the tiers","The title starts at the first tier and steps up (BIG, MEGA, EPIC) each time the count passes a threshold, with a flash, a shake and the next tier's particles. The count runs longer, one stretch per tier.","tier-titles"),"wf-style-pop":D("wins","Pop in place","Winning symbols pulse where they are while the win counts.","winfx-pop"),"wf-style-fly":D("wins","Fly","Winning symbols fly to a spot you pick. When they land they count into the win one by one, or fuse into one big symbol. The flight is the same either way: its arc, pace, rotation and timing.","winfx-fly"),"wf-style-collect":D("wins","Beam to the pots","Every winner fires a saber beam up into its pot above the machine, one by one; each catch counts up the win and the pot's nameplate. Needs the pots on (Features).","beam-collect"),"wf-land-count":D("wins","Count into the win","Each winner shrinks and vanishes as it lands, and every landing adds its share to the win meter. Usually aimed at the win meter.","winfx-fly"),"wf-land-fuse":D("wins","Fuse into one","The winners gather at the spot, each waiting for the last, then fuse into one big symbol with a flash and a shake; the win counts up under it. Usually aimed at the middle of the reels.","winfx-fuse"),"wf-big":D("wins","Big symbol size","How big the fused symbol grows, in cells."),"wf-spot":D("wins","Fly to","Where the winners go: the win meter, the win amount, above the reels, the middle of the reels or of the winners, the screen centre, or a custom spot you can pick on the preview. Count and Fuse each keep their own spot, so a round that fuses does not land on the meter. The preview marks the spot while the Wins tab is open."),"wf-arc":D("wins","Arc height","How high winners hop, in cells above the higher of their cell and the spot (a long flight goes a little higher). 0 flies in a straight line; low skims, high lobs. While the Wins tab is open the preview draws each flight as a dashed line, so you can see it change.","arc-height"),"wf-rotate":D("wins","Rotate with the path","How far winners turn to face where they fly, like Auto-Orient in After Effects. 0 keeps them upright; around 25 to 40% they lean with the curve and stay easy to read; 100 points them fully along it. A winner flying left mirrors instead of turning upside down, and one straight above or below its spot stays upright.","fly-rotate"),"wf-pace-even":D("wins","Even pace","Winners are thrown: off the cell at full speed, slowing over the top of the arc and dropping fast into the spot.","pace-even"),"wf-pace-magnet":D("wins","Magnet pace","Winners creep off their cell, then snap into the spot as if pulled by a magnet: halfway through the flight they have gone 6% of the way, and they land at four times the even speed.","pace-magnet"),"wf-pace-wind":D("wins","Wind-up pace","Winners pull back first (half a cell at most), then shoot into the spot. Works on a straight line or an arc.","pace-wind"),"wf-flight":D("wins","Flight time","How long each winner takes from its cell to the spot."),"wf-order":D("wins","All at once or one by one","At 0 every winner leaves together; at 100 they leave one every 0.3 s (closer on a big win). Fusing winners wait at the spot until the last arrives.","fly-order"),"fx-lines-on":D("wins","Winning lines","Draws the payline through a line win. The winners light up either way.","lines"),"fx-pop":D("wins","Winning symbol pop","How much winning symbols grow when they pulse.","pop-size"),"fx-dim":D("wins","Dim other symbols","Darkens the symbols that are not part of the win so the winners stand out.","dim"),"sec:effects/win-particles":D("effects","Win particles","Coins, confetti and sparkles thrown by each win moment. Pick an explosion and a particle per moment.","particles"),"fx-shake":D("effects","Screen shake","How hard the screen shakes on landings, big wins and features.","shake"),"fx-land-shake":D("effects","Build-up shake","Every reel or cell that brings a winner lands with a bump that grows, and a note that climbs.","land-shake"),"fx-flash":D("effects","Flashes","White flashes on big moments.","flash"),"fx-rays":D("effects","Light rays","Rotating light rays behind big win titles and the wheel.","rays"),"fx-bokeh":D("effects","Background lights","Soft floating lights in the background.","bokeh"),"fx-line":D("effects","Payline glow","How strongly the paylines glow.","line-glow"),"w-landing-center":D("wheel","Centred landing","The wheel stops in the middle of the segment.","wheel-center"),"w-landing-random":D("wheel","Natural landing","The wheel stops anywhere inside the segment.","wheel-random"),"w-landing-tease":D("wheel","Edge tease","The wheel stops right next to the boundary, almost on the neighbour.","wheel-tease"),"w-landing-slip":D("wheel","Almost slips","The wheel creeps into the next peg, nearly tips over, rolls back, and the pointer springs past straight.","wheel-slip"),"w-pointer-top":D("wheel","Pointer on top","The pointer hangs at the top, pointing down.","pointer-top"),"w-pointer-bottom":D("wheel","Pointer at the bottom","The pointer stands at the bottom, pointing up.","pointer-bottom"),"w-framing-full":D("wheel","Whole wheel","The whole wheel on screen.","frame-full"),"w-framing-half":D("wheel","Top half","A bigger wheel with only its top half showing.","frame-half"),"w-framing-close":D("wheel","Close-up","A huge wheel: only the cap near the pointer shows.","frame-close"),"w-framing-rise":D("wheel","From above","The wheel hangs from the top of the screen with the pointer at the bottom.","frame-rise"),"w-push":D("effects","Push in on the wheel pointer","The camera leans in on the pointer as the wheel slows down. 0 keeps it still. In After Effects the CAMERA null does it, scaled by Zoom %.","wheel-push"),"seg-k-0":D("wheel","Segment kind","Prize pays its value. Spin again spins the wheel once more. No win pays nothing.","wheel-again"),"seg-icons-all":D("wheel","Icons on every segment","Gives every segment a built-in icon, richer for bigger prizes.","seg-icons"),"w-centre-icon":D("wheel","Centre icon","The icon on the hub: the star by default, any built-in icon or your own."),"w-label-height":D("wheel","Text height","How far out from the hub the segment text sits.","label-height"),"w-icon-height":D("wheel","Icon height","How far out from the hub the segment icons sit.","icon-height"),"ri-fs-wilds-sticky":D("round","Sticky wilds","Wilds that land stay put for the rest of the free spins; their reel spins on around them. A free spin lands a wild when it asks for one (Include a Wild in the win, Extra wilds, an expanding or multiplier wild, a wild booster); with none, nothing sticks and the trigger round offers to add one. Needs a Wild symbol.","sticky",["freespins"]),"ri-fs-wilds-walking":D("round","Walking wilds","Every wild that lands in these free spins steps one reel to the left as each spin starts, until it walks off the grid. With no free spin landing a wild nothing walks, and the trigger round offers to add one. Needs a Wild symbol.","walking",["freespins"]),"ri-fs":D("round","Free spins and retriggers","How many free spins the trigger awards. Inside free spins (marked Free spin) it is a retrigger: EXTRA SPINS shows and the counter grows by this many.","retrigger",["freespins"]),"ri-wmult":D("round","Multiplier wilds","Wilds in the win carry an x2, x3... badge. After the win shows, the badges fly in and multiply it by their sum.","wild-mult",["small","medium","big"]),"ri-mystery":D("round","Mystery symbols","Mystery blocks land, glow and turn over together into one symbol. On a win they sit on winners and reveal the winning symbol.","mystery",["none","small","medium","big"]),"ri-cash":D("round","Cash symbols","Coins that land carrying a value, in bets. On their own they just land; a collector takes them all.","cash",["none","small","medium","big","nearmiss","freespins","bonus"]),"ri-collector":D("round","Collector","A collector lands, on the last reel to stop when it can, and every cash value flies into it one by one, on top of the win.","collector",["none","small","medium","big","nearmiss","freespins","bonus"]),"ri-boost":D("round","Boosters","After the spin lands the pots charge up an On a Mac
- The script and the file names are plain ASCII, so the script reads the
  same on a Mac as on Windows.
- macOS asks before an app reads your Downloads, Desktop or Documents
  folder. If After Effects says the asset files were not found, allow it
  in System Settings > Privacy & Security > Files and Folders (or move
  the unzipped folder elsewhere), then run the script again.
- Fonts: install the fonts listed under Notes below (double-click a font
  file to install it with Font Book).

How the project is organised
Most of the animation is decided in Reel Studio (outcomes, timing, motion,
effects). The After Effects project is built so you can finish the look
there: every piece of art and every effect is a placeholder comp, the
timing lives in the round comps, and a few controls sit on SLOT CONTROL.

- Placeholder Comps/: the art and the effect looks, each built once. Every
  use in the animation is a layer of that comp, so replacing the art or
  animating inside a placeholder updates every use.
  - Boxes/: every box on screen as one comp, so it moves, scales and
    fades as a unit: "Win Meter" (panel, labels, counter), each jackpot
    "<name> Box" (glow, plate, light, value; the box pops), each pot's
    "<name> Nameplate", a wheel's "R03 ... Prize Plaque" (plaque, label,
    counter and the WIN CTRL it reads) and "Spin Again" plaques, and each
    round's full-screen moments ("Big Win", "Total Win", "Banner",
    "Jackpot Title", "Grand"). A box keeps its parent's clock (it starts
    at 0), so its times read the same as the round's.
  - Symbols/: "Symbol 01 <name>" ... one comp per symbol (coins, the
    multiplier orb and the empty cell too), at full resolution: the art
    shows at its own pixel size at 100%. Replace or animate the art there.
    Symbols/Cell size holds "Symbol 01 <name> (cell)" ..., the same symbol
    at reel cell size (scaled down, Collapse Transformations on, so it
    stays sharp), which the reels and effects use. "Win 01 <name>" ... the
    symbol's win animation: it plays once from the start, then loops the
    tail; an uploaded PNG sequence or sprite sheet is laid out frame by
    frame. "Symbols Atlas" holds one symbol per frame for the reels.
  - Machine/: Background, Machine Back, Machine Frame, Marquee Lights (the
    bulbs blink inside it, faster during wins), Logo, Win Meter Panel,
    Vignette.
  - Effects/: FX Shockwave (a ring that grows and fades in 0.7 s), FX Light
    Rays and FX Small Rays (shape layers: wedges with a feathered mask that
    fades them out; change the fill to recolour them, or edit the paths),
    FX Cell Frame (win highlight), FX Anticipation,
    FX Tease Cell, FX Sticky Frame, FX Coin Lock, FX Special Coin Lock,
    FX Near Miss, FX Wild Beam, FX Collected, FX Mystery Glow, FX
    Collector Glow, FX Pot Glow, FX Boost Target, FX Boost Flash, FX Beam
    Head, FX Cell Shade, FX Jackpot Glow and FX Jackpot Fly Glow.
  - Pots/: "Pot 1 <name>" ... the art of each pot above the machine.
    Replace it with your own and every use follows.
  - Jackpots/: "Jackpot Grand", "Jackpot Major", "Jackpot Minor", "Jackpot
    Mini": each box's plate (or your own box art) with its name, at its size. The
    value is a text layer over it in the main comp.
  - Particles/: "Particle <name>" for each particle the win explosions
    throw (gold coin, stars, confetti, your own art...). A set of variants
    holds one per frame and each particle picks one; an animated particle
    holds its frames in order and each particle plays it from a random
    frame. Replace the art here and every explosion follows.
  - Titles/: "Title <tier>" for each title, with its light sweep, and its
    words as a "Text (editable)" layer in the Main Font, switched off: turn
    it on (and the art off) to change the words or their font.
  - Paylines/: "Payline NN", each drawing itself on.
  - Plaques/: the multiplier, prize and hold & spin plaques.
  - Wheel/: Wheel Disc (the turning part: your face art, Wheel Segments,
    an icon layer per segment icon and a text layer per label, and the hub
    with its centre icon when it turns), Wheel Hub, Wheel Center, Wheel
    Icon NN, Wheel Ring, Wheel Bulbs A and B, Wheel Pointer (its anchor is
    the pivot). Replace any of them with your art.
  - Counters/: "Counter Digits", the 0-9 strip every counter rolls
    through. Change its colour or style once and every counter follows.
  The Logo placeholder (a logo painted from the machine's name) and each
  Jackpot plate also hold their words as a text layer, switched off.

Effects and their controls
- Every effect placeholder (Effects/ and Titles/) has an "FX CONTROLS"
  null. Its sliders and switches drive every use of that effect:
  - "Size %" and "Opacity %": every use bigger, smaller, brighter, fainter.
  - "Colour": effect art is white and each use is tinted to its colour;
    untick it to keep your art's own colours ("FX Colour" on SLOT CONTROL
    does it for all effects at once).
  - "Speed %" (FX Shockwave): how fast the ring grows.
  - "Spin %" (rays): how fast the rays turn.
  - "Built-in Motion" (rays and titles): untick it when your art brings
    its own motion; the uses then stop spinning, popping and springing.
  - "Light Sweep" (titles): the sweep across the title.
- Swap an effect for a prerendered movie (a .mov with alpha, a PNG
  sequence...): open its placeholder, switch off or delete the art layer,
  and drop your movie in at 0:00. Every use starts it
  at the moment the effect happens: shockwave uses last 4 s, so a movie up
  to 4 s plays in full; frames and glows last as long as they show (set a
  looping movie to loop in Interpret Footage). Untick "Colour" for a
  coloured movie and "Built-in Motion" for one that moves by itself.
- Or swap the whole comp: select the uses and Alt-drag (Option-drag on a
  Mac) your own comp onto them in the timeline. Each use reads the
  controls of the comp it shows, so your comp can bring its own "FX
  CONTROLS" null (copy it from the placeholder); without one, the uses
  play it at 100%, untinted and moving by themselves. Nothing refers to the
  placeholder by name, so you can delete it.
- Particle explosions: replace the art in Particles/ and every explosion
  follows; to swap one explosion for a movie, open its comp in
  Rounds/Particles, switch its particle layers off and drop the movie in.

Full-screen wins in HD
- Titles, the logo and the particle art are painted twice the size they
  show, and their uses are scaled to 50% (or less): enlarge a title or a
  particle up to 200% and it stays sharp. The light rays are vector shapes
  in comps twice the size of their biggest use (nothing to ship, same
  sharpness). The counters are built at twice the size of the biggest
  amount, and the shockwave ring is drawn as big as its biggest use. A
  winning symbol that merges into a big one is drawn from its full-size
  art.
- Reels/: one precomp per reel (or per cell for per-cell spins). Each has a
  CTRL null with a "Spin" slider: its keyframes are the start, mid and end
  phases from Reel Studio, with the same speed and influence eases. Open the
  Graph Editor on that slider to reshape a start or a stop. The reel reads
  its symbols from Symbols Atlas as the slider rolls it, like an odometer
  wheel. Tumbling symbols are ordinary keyframed layers in the same
  precomps.
  - Hold and Spin/ (when the animation has coins): "Hold Cell C-R", one
    little reel of coins and empty cells per cell, on its own Spin slider,
    with the coin values on "Value" text layers.
- Rounds/: one comp per round that shows something. It places the
  placeholders in time: paylines, win comps on the winning cells, cell
  frames, shockwaves, expanding wilds, multipliers, titles, the wheel, coin
  landings and the collect. Move a layer to retime an effect.
  Mystery blocks turn over as "Mystery Block" then "Mystery Reveal"
  layers; the collector takes each cash value as a flying text layer.
  Boosters: "Boost Target" marks a cell in its pot's colour, "Boost From"
  trembles until the beam hits, the new symbol pops and "Boost Flash"
  bursts. Beams are "Beam Down n" (a pot firing) and "Beam Up n" (a
  winner beaming to its pot) shape layers: a Bezier path drawn on by Trim
  Paths, soft strokes in the pot's colour round a white core that thin to
  the tail (each stroke's Taper, After Effects 2020+: Start Width is the
  tail's width), a "Head" group with the white-hot ball, and a "Beam Head
  n" glow riding on the head. Edit the path to reshape a beam.
  A winner that beams to its pot darkens under a "Drained n" shade.
  For a saber plug-in (Video Copilot Saber and the like, which draw along
  a layer's masks): every beam, payline, jump or merge flight, winning
  cell frame and anticipation frame has a "Saber Path ..." solid, switched
  off at the bottom of its comp, with the path as a mask in mode None.
  Its "Head %" and "Tail %" sliders follow the effect's own draw-on: put
  the plug-in on that solid, switch it on, and link the plug-in's End and
  Start Offset to them.
  A round that awards a jackpot sends its amount from the box down into
  the win meter (with no meter, into the middle of the reels, where it
  stays a moment) as a "Jackpot <tier> Win" text with a "Fly Glow". A box
  with its win title on takes the whole screen instead, like the Grand:
  "Title jp_major" (and so on) and a counter reading its own "MAJOR
  JACKPOT n CTRL" slider.
  While a cell is held (a sticky or walking wild, a mystery block turning,
  a booster landing) a "Sticky n" or "Reveal n" mask cuts it out of its
  reel.
  Winning symbols that jump into the score are "Jump <symbol>" layers and
  ones that merge are "Pull <symbol>" layers plus a "Merged <symbol>": their
  position, scale and opacity expressions hold the flight from Reel Studio
  (time, path, landing spot), so they move exactly as in the preview.
  - Particles/: every win explosion (small burst, fountain, rain, confetti
    cannons, fireworks...) is a comp of its own. Each layer is one
    particle: a use of its Particle placeholder whose position, rotation,
    scale and opacity expressions hold the exact flight it has in Reel
    Studio (gravity, air drag, flutter). Slide the comp to retime it.
    Long running emitters loop a 5 second cycle seamlessly: each particle's
    age wraps by the cycle, so extending the comp keeps them going.
- Counter Rigs/: the rolling money counters (win meter, big win amounts,
  the hold & spin collect, the grand). Each COUNTER CTRL > Value reads its
  source slider (WIN CTRL > Amount in a round comp, SLOT CONTROL in the
  main comp); key or pick-whip it to drive the counter yourself. Each
  column turns as the one below it wraps, like the Odometer plugin, so no
  plugin is needed.
- Sound/SFX: ${n?`every sound cue on its own audio layer at its time (${n} distinct clips in assets/sfx), named after the cue and its round and coloured by group: Reels blue, Wins green, Coins yellow, Big Win red, UI purple. The SFX MIX null holds the levels in dB: "Master" and one slider per group; every layer reads its two sliders. Mute, move or swap any cue layer; to change a sound everywhere it plays, select its file in Slot Assets/SFX and use File > Replace Footage.${s<0?` Master includes ${s} dB of headroom so the loudest moment stays below 0 dB (After Effects has no compressor).`:""}`:"sound was switched off in Reel Studio, so there are no sound cues."}
- Main comp: the machine, reels, sticky wilds and walking wilds (each step
  hops in from the reel it left), the tease ("Tease Dim Rn" over the
  other reels and a lit "Scatter Lands" copy of every scatter that
  lands), coin lock frames, logo, free spins ribbon, HUD texts, the win
  meter, the round comps, the flash and the SFX comp, with a marker where
  each round starts. With pots above the machine: each "Pot n" stands
  behind the frame with a "Charge Light" copy, squashing as it catches
  and kicking as it fires; over the frame its "Glow" and its nameplate
  ("Pot n Plate" and a counter reading the "Pot n" slider). With jackpot
  boxes: each "Jackpot <tier>" plate with a "Glow" behind it, a "Light"
  copy over it and a "Win Sweep" (CC Light Sweep), all popping and
  glowing by expressions when the box is won or its coin lands; its
  "Value" text reads the "Jackpot <tier>" slider, and a Shockwave plays at
  every win. SCREEN SHAKE is a
  parent null whose position expression holds the shake events. Ambient
  particles ("Ambient <template>") sit right above the background, and
  particles set to run to the end ("Rxx <template>") above the round
  comps. With the anticipation zoom on, a CAMERA null parents SCREEN SHAKE
  and the background: its position and scale expressions push in on the
  teased reel and ease back out.
- SLOT CONTROL (main comp):
  - "Meter", "FS Total" (and "Collect" with Hold & Spin, "Pot 1" to "Pot 3"
    with pots) drive the counters.
  - "Jackpot Grand" ... "Jackpot Mini" (with jackpot boxes): what each box
    shows. Its expression holds the seed, the growth per second and every
    win (when, and what it paid); edit them there, or replace the
    expression with your own keyframes and the value text follows.
  - "Shake %", "Flash %", "Dim %", "Particles %" (thins every explosion
    out), "Spin Blur %" (the reels' up-and-down blur), "Win Pop %", "Zoom %"
    (the anticipation zoom), "Win Camera %" (the camera following the
    winners: its keys are on the WIN CAMERA null, one a frame, editable) and
    "Glow %" (every glow at once; each glow
    keeps its art on top) scale those effects; 100 is what Reel Studio
    showed.
  - "FX Colour": tints the effect placeholders (see above).
- The wheel game has no machine layers: just the background, the wheel and
  its prizes, one round comp per spin handing the wheel to the next.

Transparency
- ${a?"Background and Vignette are switched off in this build.":"Switch off the Background and Vignette layers in the main comp."}
  Then Composition > Add to Render Queue, Output Module: QuickTime, Apple
  ProRes 4444, Channels: RGB + Alpha. That gives a transparent MOV.

Notes
- Fonts: text layers ask for ${i}. Install them (Google Fonts, or the
  files in fonts/). Every text layer takes its font from the "Fonts" comp
  (in Slot Assets): pick another font on its "Main Font" layer (or "Wheel

  or later; older versions keep the font each layer was built with).
- Reel curvature and bloom are preview-only effects; the AE reels are flat.
- assets/ holds only the art and sounds this animation uses, and each
  identical file once: two placeholders (or two formats) can share one
  PNG. Replace a shared file and both follow.

=====================

Paint your machine's frame once on this sheet: Reel Studio builds it around
any number of reels and rows, in every format and size.

Files
- Smart_frame_template.psd: the sheet, with guides on every slice line. Its
  layer "What each part does" is hidden: show it to see the parts, and hide
  it again before you export.
- Smart_frame_template.png: the same sheet, for any other editor.
- Smart_frame_parts.png: the map of the parts on its own.
- How_it_grows.png: this kit around a few machines.

How it is built
- The four corners keep their shape.
- The edges between them repeat along the frame, scaled a little so whole
  tiles fit (or stretch: Asset Bank > Scene > Smart frame). Paint them the
  same all along, or as a pattern that ends the way it starts.
- The reel window in the middle stays clear: the reels show there.
- The dashed line is the frame's outer edge. Outside it is room for art
  that hangs over the edge (shadows, ornaments).
- The divider goes between every two reels, centred on the gap (its middle
  ${Ot.divider.core} px is the gap). Its caps, the top and bottom squares, keep
  their shape; the middle repeats down.
- The row divider is used with per-cell spins only.
- The top and bottom ornaments are optional: leave them empty for none. Each
  keeps its shape, centred on the middle of the top or the bottom edge.
- Keep the sheet's size, ${t.width} x ${t.height}, or any multiple of
  ${Ot.W} x ${Ot.H} (twice that for more detail).

Bring it back
Export the sheet as a PNG with transparency (Photoshop: File > Export >
Export As, PNG, Transparency on) and upload it in Reel Studio: Asset Bank >
Scene > Smart frame > Upload. With Machine > Look > Marquee bulbs on, the
app puts its lights along the middle of your frame's edges; turn it off if
your frame has lights of its own.
