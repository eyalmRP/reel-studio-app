        var beam = frameAt(comp, "FX Wild Beam", DATA.cellW, DATA.winH, { stroke: 0.04, round: 0.06, fill: [1, 0.8, 0.4], fillOp: 22, glow: 0.25, glowI: 1.5, color: [1, 0.84, 0.35] }, "Expanding Wild Glow", [er.x, winC[1]], rel(R.expand.start), rel(R.expand.end + 0.5));

  // ---------- pots above the machine (core/pots.js) ----------
  // Pot i's reactions at time: b = squash or kick, bc = squash from catches

  function potExpr(i) {
    var Pd = DATA.pots, k, n1 = 0, n2 = 0, h = "var PH = [", c = "var PC = [";
    for (k = 0; k < Pd.hits.length; k++) if (Pd.hits[k][1] === i) h += (n1++ ? "," : "") + "[" + Pd.hits[k][0] + "," + Pd.hits[k][2] + "]";
    for (k = 0; k < Pd.charges.length; k++) if (Pd.charges[k][2] === i) c += (n2++ ? "," : "") + "[" + Pd.charges[k][0] + "," + Pd.charges[k][1] + "]";
    return h + "];\n" + c + "];\n" +
      "function c01(x){return x<0?0:(x>1?1:x);}\n" +
      "var b = 0, bc = 0, fl = 0, ch = 0;\n" +
      "for (var i = 0; i < PH.length; i++) { var a = time - PH[i][0]; if (a < 0) continue; var d = PH[i][1] ? " + Pd.times[1] + " : " + Pd.times[0] + ";\n" +
      "  if (a < d) { var bb = (PH[i][1] ? 0.55 : 1) * Math.pow(1 - a / d, 2); b = Math.max(b, bb); if (!PH[i][1]) bc = Math.max(bc, bb); }\n" +
      "  if (a < 0.4) fl = Math.max(fl, (PH[i][1] ? 0.7 : 1) * (1 - a / 0.4)); }\n" +
      "for (var j = 0; j < PC.length; j++) { if (time < PC[j][0] || time > PC[j][1] + 0.3) continue; ch = Math.max(ch, Math.min(c01((time - PC[j][0]) / 0.25), c01((PC[j][1] + 0.3 - time) / 0.3))); }\n";
  }
  // The pots stand on the frame's top edge, behind the frame. A catch

      var s = r4(100 * it.size / src.width), ex = potExpr(i);

        P(two[k], "ADBE Scale").expression = ex + "[" + s + " * (1 + 0.08 * b + 0.02 * ch), " + s + " * (1 - 0.08 * b + 0.03 * ch)];";

  // ---------- progressive jackpot boxes (core/jackpots.js) ----------
  // What a box shows at time (jackpotValue): its seed growing while it

  function jpValueExpr(it) {
    var J = DATA.jackpots, h = "var HT = [", k;
    for (k = 0; k < it.hits.length; k++) h += (k ? "," : "") + "[" + it.hits[k][0] + "," + it.hits[k][1] + "]";
    return h + "];\nvar SEED = " + it.base + ", GROW = " + it.rate + ", HOLD = " + J.times[2] + ", RUN = " + J.running + ";\n" +
      "var from = 0, v = null;\n" +
      "for (var i = 0; i < HT.length; i++) { if (HT[i][0] > time) break; if (time < HT[i][0] + HOLD) { v = HT[i][1]; break; } if (RUN) from = HT[i][0] + HOLD; }\n" +

  // How a box reacts at time (jackpotFx): sc = its scale, gl = glow, sw =

  function jpFxExpr(it) {
    var J = DATA.jackpots, k, h = "var HT = [", b = "var BT = [";
    for (k = 0; k < it.hits.length; k++) h += (k ? "," : "") + it.hits[k][0];
    for (k = 0; k < it.blinks.length; k++) b += (k ? "," : "") + it.blinks[k];
    return h + "];\n" + b + "];\nvar C = " + J.times[0] + ", BL = " + J.times[1] + ", HOLD = " + J.times[2] + ";\n" +
      "var sc = 1, gl = 0, sw = -1, held = 0;\n" +
      "for (var i = 0; i < HT.length; i++) { var a = time - HT[i]; if (a < 0 || a > C) continue;\n" +
      "  var env = Math.min(1, a / 0.15) * Math.min(1, (C - a) / 0.6);\n" +
      "  sc = Math.max(sc, 1 + env * (0.05 + 0.1 * Math.exp(-3 * a) + 0.025 * Math.sin(a * 12)));\n" +
      "  gl = Math.max(gl, env * (0.75 + 0.25 * Math.sin(a * 10)));\n" +
      "  if (a < 0.9) sw = a / 0.9; if (a < HOLD) held = 1; }\n" +
      "for (var j = 0; j < BT.length; j++) { var a2 = time - BT[j]; if (a2 < 0 || a2 > BL) continue; var kk = Math.sin(Math.PI * a2 / BL); sc = Math.max(sc, 1 + 0.06 * kk); gl = Math.max(gl, 0.8 * kk); }\n";
  }

  // A stroke that thins from the path's end back to its start: After

  function taperStroke(st, tail) {

      menuPick(tp.property("ADBE Vector Taper Length Units"), /percent|prozent|pourcent|porcentaje|percentuale|procent|%/i, 2);

  // to the tail, with a white-hot ball and a glow riding on the head.
  function buildBeams(comp, R, rel) {

    for (i = 0; i < R.beams.length; i++) {

      var pre = "function c01(x){return x<0?0:(x>1?1:x);}\nvar f = time - " + f0 + "; var tr = " + bm.travel + ";\n" +
        "var u = c01(f / tr); var head = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;\n" +
        "var tail = Math.min(head, c01((f - tr * 0.6) / (tr * 0.4 + " + BM.hold + " + " + (BM.fade * 0.5) + ")));\n";
      var fade = "(1 - c01((f - tr - " + BM.hold + ") / " + BM.fade + "))";
      var onPath = pre + rowsExpr("Q", bm.pts) + "var n = Q.length - 1; var x = head * n; var j = Math.min(n - 1, Math.floor(x)); var kk = x - j;\n[Q[j][0] + (Q[j + 1][0] - Q[j][0]) * kk, Q[j][1] + (Q[j + 1][1] - Q[j][1]) * kk];";
      var L = shapeLayer(comp, (bm.up ? "Beam Up " : "Beam Down ") + (i + 1) + " " + DATA.pots.items[bm.pot].name);
      // The white-hot ball on the head, first so it sits in front.
      var hb = group(L, "Head");
      var el = ellipse(hb, [0, 0], [BM.core, BM.core]);
      el.property("ADBE Vector Ellipse Position").expression = onPath;
      fill(hb, [1, 1, 1], 100);
      var g = group(L, "Beam");
      var p = g.addProperty("ADBE Vector Shape - Group");
      var sh = new Shape();
      sh.vertices = [[z[0], z[1]], [z[6], z[7]]];
      sh.outTangents = [[z[2] - z[0], z[3] - z[1]], [0, 0]];
      sh.inTangents = [[0, 0], [z[4] - z[6], z[5] - z[7]]];
      sh.closed = false;
      p.property("ADBE Vector Shape").setValue(sh);
      var tp = g.addProperty("ADBE Vector Filter - Trim");
      tp.property("ADBE Vector Trim Start").expression = pre + "tail * 100;";
      tp.property("ADBE Vector Trim End").expression = pre + "head * 100;";
      // The white core first: it sits in front.
      for (k = BM.passes.length - 1; k >= 0; k--) {
        var ps = BM.passes[k];
        var st = stroke(g, ps[2] ? [1, 1, 1] : bm.color, ps[0]);
        st.property("ADBE Vector Stroke Opacity").setValue(ps[1] * 100);
        taperStroke(st, BM.tail);
        if (ps[2]) continue;
        var fk = "(0.85 + 0.15 * Math.sin(time * 61) * Math.sin(time * 37 + 1))";
        st.property("ADBE Vector Stroke Width").expression = "value * " + fk + ";";
        st.property("ADBE Vector Stroke Opacity").expression = "value * " + fk + ";";
      }
      L.blendingMode = BlendingMode.ADD;
      P(L, "ADBE Opacity").expression = pre + "100 * " + fade + ";";
      trim(L, f0, f0 + dur);
      saberPath(comp, (bm.up ? "Up " : "Down ") + (i + 1) + " " + DATA.pots.items[bm.pot].name, sh, f0, f0 + dur, pre + "head * 100;", pre + "tail * 100;");
      var hd = inst(comp, beamHeadPH(), "Beam Head " + (i + 1), null, f0, f0 + dur);
      if (!hd) continue;
      fxScale(hd);
      hd.blendingMode = BlendingMode.ADD;
      tint(hd, bm.color);
      P(hd, "ADBE Position").expression = onPath;
      fxOpacity(hd, pre, "100 * " + fade);
    }
  }
  // The beam head's glow: white discs stacked to fade out like the
  // preview's glow (core/pots.js beamHeadRings), softened a little. Each
  // use is tinted to its pot's colour; put your own art in its place.
  function beamHeadPH() {
    var key = "FX Beam Head";
    if (PH.hasOwnProperty(key)) return PH[key];
    var G = Math.max(8, DATA.beam.head), S = Math.ceil(G * 1.2), R = DATA.beam.rings;
    return ph(key, "Effects", S, S, DUR + 2, function (c) {
      var L = shapeLayer(c, "Beam Head"), k;
      for (k = R.length - 1; k >= 0; k--) {
        var g = group(L);
        ellipse(g, [S / 2, S / 2], [G * R[k][0], G * R[k][0]]);
        fill(g, [1, 1, 1], R[k][1] * 100);
      }
      try { fx(L, "ADBE Gaussian Blur 2").property("ADBE Gaussian Blur 2-0001").setValue(G * 0.03); } catch (e) {}
      fxControls(c, FX_STD);
    });
  }
  // Beaming to the pots: each winner fires (a ring in its pot's colour) and

  function drainCells(comp, st, rel) {
    var F = st.fx, i, e = rel(st.end);

      fxOpacity(dk, "var d = Math.min(1, Math.max(0, (time - " + (l0 + 0.05) + ") / 0.3)); var o = Math.min(1, Math.max(0, (" + e + " - time) / 0.3));\n", "45 * d * o");
    }
  }

  // Mystery blocks turn over together (core/timeline.js MYSTERY): the block
  // narrows to its edge, the revealed symbol opens out; the reels under

  function buildMystery(comp, R, rel) {
    var M = R.mystery, i;
    var f0 = rel(M.flipAt), f1 = rel(M.flipEnd), mid = rel(M.mid), d = M.flipEnd - M.flipAt;
    var turn = "var u = Math.max(0, Math.min(1, (time - " + f0 + ") / " + d + ")); var lift = 1 + 0.12 * Math.sin(u * Math.PI); var sx = Math.max(0.02, Math.abs(Math.cos(u * Math.PI))) * lift;\n";
    for (i = 0; i < M.cells.length; i++) {
      var cl = M.cells[i];
      var gl = frameAt(comp, "FX Mystery Glow", DATA.cellW * 0.96, DATA.cellH * 0.96, { round: 0.14, fill: [0.77, 0.55, 1], fillOp: 35, glow: 0.35, glowI: 1.6, color: [0.77, 0.55, 1] }, "Mystery Glow", [cl.x, cl.y], rel(M.start), f1 + 0.3);
      gl.blendingMode = BlendingMode.ADD;
      fadeKeys(gl, rel(M.start), f1 + 0.3, 0.3, 0.4);
      var A = inst(comp, symComps[M.from], "Mystery Block", [cl.x, cl.y], f0, mid);
      P(A, "ADBE Scale").expression = turn + "[100 * sx, 100 * lift];";
      var B = inst(comp, symComps[M.sym], "Mystery Reveal", [cl.x, cl.y], mid, f1);
      P(B, "ADBE Scale").expression = turn + "[100 * sx, 100 * lift];";
      ring(comp, [cl.x, cl.y], mid, DATA.cellW * 0.95, [0.88, 0.7, 1]);
    }
  }
  // The collector wakes, every cash value flies in one by one, and it shows
  // what it took (the meter counts each in on WIN CTRL).
  function buildCollector(comp, R, rel) {
    var C = R.collector, i;
    var a = rel(C.start), b = rel(C.end) + 0.4;
    var tg = [C.x, C.y];
    var arr = "var A = [";
    for (i = 0; i < C.items.length; i++) arr += (i ? "," : "") + rel(C.items[i].arrive);
    arr += "]; var bump = 0, got = -1; for (var i = 0; i < A.length; i++) if (time >= A[i]) { got = i; bump = Math.max(bump, 1 - Math.min(1, (time - A[i]) / 0.25)); }\n";
    var cg = frameAt(comp, "FX Collector Glow", DATA.cellW * 1.1, DATA.cellH * 1.1, { round: 0.5, fill: DATA.accent, fillOp: 30, glow: 0.45, glowI: 1.8, color: DATA.accent }, "Collector Glow", tg, a, b);
    cg.blendingMode = BlendingMode.ADD;
    fadeKeys(cg, a, b, 0.25, 0.4);
    var CL = inst(comp, symComps[C.sym], "Collector", tg, a, b);
    P(CL, "ADBE Scale").expression = arr + "var s = 100 * (1 + 0.05 * Math.sin((time - " + a + ") * 9) + 0.16 * bump); [s, s];";
    fadeKeys(CL, a, b, 0.25, 0.4);
    for (i = 0; i < C.items.length; i++) {
      var it = C.items[i], t0 = rel(it.at), t1 = rel(it.arrive);
      ring(comp, [it.x, it.y], t0, DATA.cellW * 0.8, DATA.accent);
      var fly = text(comp, "Cash " + it.text, it.text, Math.round(DATA.cellH * 0.24), [it.x, it.y], [1, 0.88, 0.45]);
      var p0 = P(fly, "ADBE Position").value;
      ease1(P(fly, "ADBE Position"), [[t0, p0], [(t0 + t1) / 2, [(p0[0] + tg[0]) / 2, Math.min(p0[1], tg[1]) - DATA.cellH * 0.6]], [t1, tg]]);
      glow(fly, DATA.cellW * 0.1, 1.3);
      trim(fly, t0, t1);
    }
    // The running total under the collector, one value at a time.
    var tot = "var T = [";
    for (i = 0; i < C.items.length; i++) tot += (i ? "," : "") + "\"" + C.items[i].after + "\"";
    tot += "];\n";
    var TX = text(comp, "Collected", C.items.length ? C.items[0].after : "", Math.round(DATA.cellH * 0.3), [tg[0], tg[1] + DATA.cellH * 0.3]);
    textExpr(TX, arr + tot, "got >= 0 ? T[got] : ''");
    P(TX, "ADBE Scale").expression = arr + "var s = 100 * (1 + 0.2 * bump); [s, s];";
    glow(TX, DATA.cellW * 0.1, 1.3);
    trim(TX, C.items.length ? rel(C.items[0].arrive) : a, b);
    ring(comp, tg, rel(C.done), DATA.cellW * 1.4, DATA.accent);
  }
  function buildMult(comp, R, rel) {
    var M = R.mult, i;

      var it = M.items[i];

      var mid = [(a0[0] + tg[0]) / 2, Math.min(a0[1], tg[1]) - DATA.cellH * 0.8];

    fadeKeys(pl, rel(M.start), rel(M.end + 0.3), 0.25, 0.4);
    var items = "var I = [";
    for (i = 0; i < M.items.length; i++) items += (i ? "," : "") + "[" + rel(M.items[i].t) + "," + M.items[i].value + "]";
    items += "]; var sum = 0; for (var i = 0; i < I.length; i++) if (time >= I[i][0] + 0.45) sum += I[i][1];\n";

    P(tx, "ADBE Scale").expression = EASE_LIB + "var a = time - " + rel(M.applyAt) + "; var s = a > 0 ? 100 * (1 + 0.25 * Math.pow(1 - c01(a / 0.4), 2)) : 100; [s, s];";
    fadeKeys(tx, rel(M.start), rel(M.end + 0.3), 0.25, 0.4);
    ring(comp, tg, rel(M.applyAt), DATA.cellW * 2.6, [1, 0.82, 0.35]);

  // ---------- Hold & Spin ----------
  // A coin layer that bounces in at time t, with its value on it.
  // The tease (core/tease.js): while a reel teases, a black solid dims each
  // other reel; scatters and trigger coins that land pop lit over the dim,
  // then fade into it, or stay lit to the end of the tease with "keep
  // scatters lit". Dim % on SLOT CONTROL scales the dim.
  function buildTease(kids) {
    var TE = DATA.tease, TW = [], r, i, t0 = 1e9, t1 = 0;
    var envFn = "function tEnv(w) { var a = w[0] - " + TE.lead + ", b = w[1] + " + TE.tail + "; if (time < a || time > b) return 0; return Math.min(Math.min(1, (time - a) / " + TE.fin + "), Math.min(1, (b - time) / " + TE.tail + ")); }\n";
    for (r = 0; r < DATA.rounds.length; r++) {
      for (i = 0; i < DATA.rounds[r].tease.length; i++) {
        var w = DATA.rounds[r].tease[i];
        if (w[2] < 0) continue;
        TW.push(w);
        t0 = Math.min(t0, w[0] - TE.lead);
        t1 = Math.max(t1, w[1] + TE.tail);
      }
    }
    if (TW.length) {
      for (i = 0; i < DATA.reels; i++) {
        var td = solid(main, [0, 0, 0], "Tease Dim R" + (i + 1), DATA.cellW, DATA.winH, [DATA.reelXs[i], DATA.winTop + DATA.winH / 2]);
        P(td, "ADBE Opacity").expression = rowsExpr("TW", TW) + envFn +
          "var all = 0, own = 0; for (var k = 0; k < TW.length; k++) { var e = tEnv(TW[k]); all = Math.max(all, e); if (TW[k][2] == " + i + ") own = Math.max(own, e); }\n" +
          "(own > 0 ? 0 : " + TE.dim * 100 + " * all) * " + ctrl("Dim %") + " / 100;";
        trim(td, t0, t1);
        kids.push(td);
      }
    }
    for (r = 0; r < DATA.rounds.length; r++) {
      var RR = DATA.rounds[r];
      for (i = 0; i < RR.lands.length; i++) {
        var ld = RR.lands[i];
        kids.push(ring(main, [ld.x, ld.y], ld.t, DATA.cellW * 0.95, DATA.accent));
        var LL = inst(main, symComps[ld.s] || symComps[0], (ld.coin ? "Coin Lands R" : "Scatter Lands R") + (r + 1), [ld.x, ld.y], ld.t, ld.until);
        P(LL, "ADBE Scale").expression = "var u = Math.max(0, Math.min(1, (time - " + ld.t + ") / " + TE.fade + ")); var s = 100 * (1 + 0.25 * Math.sin(u * Math.PI)); [s, s];";
        var lit = "var a = time - " + ld.t + "; var k = a < 0 ? 0 : (a < " + TE.pop + " ? 1 - Math.max(0, Math.min(1, (a - " + TE.fade + ") / " + (TE.pop - TE.fade) + ")) : 0);\n";
        if (TE.keepLit && RR.tease.length) lit += rowsExpr("W", RR.tease) + envFn + "if (a >= 0) for (var j = 0; j < W.length; j++) k = Math.max(k, tEnv(W[j]));\n";
        lit += "100 * k;";
        P(LL, "ADBE Opacity").expression = lit;
        glow(LL, DATA.cellW * 0.2, 1.2);
        kids.push(LL);
        if (ld.lab) {
          var lsz = Math.round(DATA.cellH * 0.3);
          var T = text(main, "Value " + ld.lab[0], ld.lab[0], lsz, [0, 0], [1, 0.9, 0.55]);
          pos(T, [ld.x, ld.y + ld.lab[1] * DATA.cellH + lsz * 0.36 * ld.lab[2]]);
          P(T, "ADBE Scale").setValue([ld.lab[2] * 100, ld.lab[2] * 100]);
          P(T, "ADBE Opacity").expression = lit;
          T.parent = LL;
          trim(T, ld.t, ld.until);
        }
      }
    }
  }
  function coinPop(comp, it, t, dur, lab, name) {
    var L = inst(comp, symComps[it.s] || symComps[0], name, [it.x, it.y], t, t + dur);
    P(L, "ADBE Scale").expression = EASE_LIB + "var k = c01((time - " + t + ") / " + dur + "); var s = 100 * (1 + 0.26 * Math.sin(k * Math.PI)); [s, s];";

  function buildRespin(comp, R, rel) {

  function buildCollect(comp, R, rel) {

centre icon, the hub and which parts show.","label-height"),"sec:wheel/spin":P("wheel","Spin","How many turns it makes, how it lands by default (centre, random, tease, almost slips) and whether values are multiplied by the bet.","wheel-slip"),"sec:sound/sound-track":P("sound","Sound track","Every cue is made in sync with the animation. Set the volume and each group's level; it plays with the preview, goes into the MP4 and ships to After Effects."),"sec:export/output":P("export","Output","The project name, canvas size, frame rate and transparent background for every export."),"sec:export/after-effects-project":P("export","After Effects project","The main export: a zip with a script that rebuilds this animation as an editable After Effects project, in every format you pick. With several formats the art (symbols, particles, pots, titles, the logo) is built once in Shared Placeholder Comps and every format uses it: replace or animate it there and every format follows."),"x-extra":P("export","Extra rows below the play rows","A taller format (9:16, 4:5) can show more rows of symbols under the play rows so the machine fills the screen. They spin and stop with the reels; wins, lines, counts, timing and sound stay on the play rows, so every format is the same animation. The extra rows never show a winning symbol, a special or three alike side by side (a full-screen win fills them too, and they join it), and in a tumble they stay put while the play rows above them tumble. 0 unless you set it; Fill picks as many as fit. Not for Hold & Spin or the wheel.","extra-rows"),"x-fill-format":P("export","Fill the screen","Sets as many extra rows as the format has room for without the machine getting smaller."),"sec:export/quick-preview-mp4":P("export","Quick preview (MP4)","A quick video to share, rendered frame by frame at full resolution, with or without the sound track."),"sec:export/soundtrack-wav":P("export","Soundtrack (WAV)","The whole mix as the preview plays it, for editing the sound elsewhere."),"sec:export/still-frame":P("export","Still frame","The frame under the playhead as a PNG, without the background when Output says transparent."),"sec:export/project-file":P("export","Project file","Everything in one .json file, your images and sounds included, to reopen the exact animation later."),"sec:seq/quick-sequence":P("seq","Quick sequence","Builds a whole run of rounds in one go: warm-up spins, then the finale you pick."),"sec:bank/scene-art":P("bank:scene","Scene art","The background, a frame overlay and your logo. With the pots and jackpot boxes on, their art follows here."),"sec:bank/symbols":P("bank:symbols","Symbols","Each symbol is fitted to its cell. Role: what it does (point at a role, or at the role chips under the symbols). Low or high pay: a round set to Auto wins with a low-pay symbol on a small win, a high-pay one on a bigger win. Shows up: how often it fills the reels around the wins. Built-in art for roles your set lacks sits after your symbols."),"sec:bank/hold-spin-coins":P("bank:coins","Hold & Spin coins","Their own set, apart from the symbols. Values are in bets and shown on the coin (5 shows $5 at a $1 bet). The jackpot coins (Mini, Minor, Major) win their box. A label is painted on built-in coin art; your art is used as it is. Cash symbols on the slot reels use the regular coin. In After Effects each coin is its own comp."),"sec:bank/particle-art":P("bank:effects","Particle art","The art the win explosions throw: one PNG, several PNGs for an animation (a spinning coin, a flapping banknote), or a sprite sheet. A built-in takes your art from the upload button on its card and keeps its name and every use. Pick which particle each win moment uses in Effects \u203A Win particles. In After Effects each particle is a placeholder comp."),"sec:bank/win-effects":P("bank:effects","Win effects","Light rays, shockwaves, cell frames and coin bursts are drawn live. In After Effects each is a placeholder comp in Placeholder Comps/Effects with an FX CONTROLS layer (size, opacity, colour, motion); drop a prerendered movie into one and every use plays it."),"sec:bank/jackpot-box-art":P("bank:scene","Jackpot box art","Each box is painted in its colour until you give it art. Names, seeds and colours are with the boxes in Features. In After Effects each box is its own placeholder comp."),"sec:bank/pot-art":P("bank:scene","Pot art","Each pot stands on the frame. Which pot is which, its colour and role are with the pots in Features. In After Effects each pot is a placeholder comp in Placeholder Comps/Pots."),"sec:bank/wheel-art":P("bank:wheel","Wheel art","The face turns with the wheel and shows through segments with no colour; the rim frames it; the hub sits in the middle; the pointer hinges near its top. In After Effects each is a placeholder comp in Placeholder Comps/Wheel."),"sec:bank/your-own-sounds":P("bank:sounds","Your own sounds","Your file plays from its start at each cue, at the track volume and its group level. A cue without your file plays its built-in placeholder; a cue turned off is left out of the preview, the MP4, the WAV and After Effects. In After Effects each cue is its own audio layer in the SFX comp."),"sec:bank/my-kit":P("bank:sounds","My kit","The house style most of your machines share, set up once: your sounds, your fonts and your particle art, kept in this browser for every project. Each part saves and goes into a project on its own. Each project keeps its own copy, so a finished project does not change when you update the kit. Export saves the kit as a file for another browser, the other copy of the app or a teammate."),"kit-save-sounds":P("bank:sounds","Save the sounds in my kit","Keeps this project's sound design in your kit: your own files, the cues turned off, the volume and the group levels. Saving again updates it."),"kit-use-sounds":P("bank:sounds","Use the kit's sounds here","Puts your kit's sounds, Off cues and mix into this project, in place of its own (sounds are one set of slots). Undo brings them back."),"kit-del-sounds":P("bank:sounds","Take the sounds out of my kit","Click twice. Projects keep the sounds they have."),"kit-save-fonts":P("bank:fonts","Save the fonts in my kit","Keeps this project's font files in your kit, with the display font and wheel label font when they are among them. A built-in or catalogue font picked in a project stays with that project."),"kit-use-fonts":P("bank:fonts","Use the kit's fonts here","Adds your kit's font files to this project (a font of the same name is replaced; none is removed) and, when the kit has them, makes its display font and wheel label font this project's."),"kit-del-fonts":P("bank:fonts","Take the fonts out of my kit","Click twice. Projects keep their fonts."),"kit-save-particles":P("bank:effects","Save the particle art in my kit","Keeps this project's particle art in your kit: your art for the built-in particles (coin, star, confetti...) and your own particles. Which win moment uses which particle stays with each project."),"kit-use-particles":P("bank:effects","Use the kit's particle art here","Adds your kit's particle art to this project: your art replaces the built-in particles it was made for, everywhere they are used, and your own particles join the list. Nothing is removed."),"kit-del-particles":P("bank:effects","Take the particle art out of my kit","Click twice. Projects keep their particle art."),"kit-auto":P("bank:sounds","Start new projects with it","New projects, presets and the demo come with every part of your kit. Opening a project file keeps what is saved in it."),"kit-export":P("bank:sounds","Export the kit","Saves the whole kit as a .reelkit.json file with its sounds, fonts and art inside. Import it in another browser, in the other copy of the app (each keeps its own kit) or on a teammate's machine."),"kit-import":P("bank:sounds","Import a kit","Opens a .reelkit.json (or an older .soundkit.json) file: the parts it holds replace those parts of your kit; the others stay. Use here puts a part in this project."),"sec:bank/fonts":P("bank:fonts","Fonts","Your fonts come first in the font list. They ship in the After Effects package; install them there."),"sym-w-help":P("bank:symbols","Shows up","How often a symbol fills the reels around the wins, in stages, with its share of them. Only in wins: never as filler, but it still wins when a round picks it. Wilds, scatters and the like only show where a round puts them."),"sym-tier-help":P("bank:symbols","Low or high pay","A round whose symbol is Auto wins with a low-pay symbol on a small win and a high-pay one on a bigger win. Pots that upgrade cells turn them into low-pay symbols. Amounts come from the round, not from this."),"sym-roles-help-normal":P("bank:symbols","Paying symbols","Make the wins, along lines, ways or in clusters. Low or high pay decides which one a round set to Auto wins with.","pay-mode"),"sym-roles-help-wild":P("bank:symbols","Wild","Stands in for any paying symbol to complete a win. A round can make it expand, stick, walk or carry a multiplier.","expand"),"sym-roles-help-scatter":P("bank:symbols","Scatter","Counts anywhere on the reels; enough of them trigger free spins or the bonus. One short is a near miss, teased on the last reel.","scatter-lit"),"sym-roles-help-multiplier":P("bank:symbols","Multiplier","Lands with an x value and flies into the win to multiply it. Without one in your set the machine draws its built-in orb.","mult"),"sym-roles-help-mystery":P("bank:symbols","Mystery","Blocks land, glow and turn over together into one symbol. Without one in your set the machine draws its built-in block.","mystery"),"sym-roles-help-collector":P("bank:symbols","Collector","Gathers the value of every cash coin on the reels into the win. Without one in your set the machine draws its built-in collector.","collector"),"sym-roles-help-bonus":P("bank:symbols","Bonus","Triggers the bonus. A machine without a scatter uses it as its scatter.","bonus"),"sym-roles-help-cash":P("bank:symbols","Cash coin","A coin with a value on the slot reels; a collector gathers them. Its art is the regular coin in Coins.","cash"),"coin-kinds-help-regular":P("bank:coins","Regular coin","Lands and locks with a value in Hold & Spin; on the slot reels it is the cash coin.","holdspin"),"coin-kinds-help-special":P("bank:coins","Special coins","Your own coins with a label and values, placed in the respins of a round."),"coin-kinds-help-jackpot":P("bank:coins","Jackpot coins","Mini, Minor and Major: collecting one wins its jackpot box; a full board wins the Grand.","jackpots"),"coin-kinds-help-empty":P("bank:coins","Empty cell","What a cell shows before a coin lands. Built-in: a dark socket."),"jp-art-names":P("bank:scene","Names on your box art","Writes each box's name on your uploaded art. Turn it off when your art already says GRAND, MAJOR and so on."),"m-beam-curve-arc":P("features","Simple arc beams","Each beam bows out in one smooth curve.","beam-collect"),"m-beam-curve-s":P("features","S-curve beams","Each beam swings out one way, then the other, like a whip.","s-curve"),"m-beam-bend":P("features","Beam bend","How far the beams bow out from a straight line.","beam-bend"),"m-beam-width":P("features","Beam thickness","How thick the trail is next to the head; Taper thins it towards the tail. It leaves the head alone. Thickness and Head size share their units: the same number makes the trail as thick as the head, a comet.","beam-width"),"m-beam-taper":P("features","Beam taper","How much the beams thin from the head back to the tail, like a comet. 0 keeps them even; 1 brings the tail to a point. After Effects gets the same taper on each beam's strokes (Stroke \u203A Taper \u203A Start Width).","beam-taper"),"m-beam-head":P("features","Beam head size","How big the round glowing head is, with its white-hot ball. Thickness sets the trail on its own. In After Effects the glow is the FX Beam Head placeholder and the ball is the Head group in each beam layer.","beam-head"),"m-beam-travel":P("features","Beam travel time","How long a beam takes to reach its pot or cell.","beam-travel"),"m-beam-stagger":P("features","Time between beams","The gap between one beam firing and the next.","beam-stagger"),"spin-type-classic":P("spin","Classic spin","All reels start together and stop one after another in the stop order.","spin-classic"),"spin-type-stagger":P("spin","Staggered start","Reels kick off one after another, like a wave.","spin-stagger"),"spin-type-turbo":P("spin","Turbo spin","A short spin: the reels slam down almost together.","spin-turbo"),"spin-type-tease":P("spin","Tease last reel","The last reel to stop always slows down with an anticipation glow.","spin-tease"),"spin-type-cascade":P("spin","Cascade drop","Symbols fall out and new ones drop in, column by column (Sweet Bonanza style).","spin-cascade"),"spin-type-cells":P("spin","Per-cell spin","Every cell is its own little reel and stops on its own.","spin-cells"),"spin-start-windup":P("spin","Wind-up start","The reels pull back a little before they spin off.","start-windup"),"spin-start-ease":P("spin","Ease-in start","The reels speed up smoothly.","start-ease"),"spin-start-instant":P("spin","Instant start","The reels jump straight to full speed.","start-instant"),"spin-end-bounce":P("spin","Bounce stop","Each reel hits its stop still moving and bounces back off it, twice, like a ball. Overshoot sets how high.","end-bounce"),"spin-end-elastic":P("spin","Elastic stop","Each reel runs past its stop and springs back and forth around it, smaller each time, before it settles. Overshoot sets how far.","end-elastic"),"spin-end-hard":P("spin","Hard stop","The reel stops dead on its symbols.","end-hard"),"spin-end-soft":P("spin","Soft stop","The reel glides to a gentle stop.","end-soft"),"spin-blur":P("spin","Motion blur","Smears the symbols while the reels spin fast.","blur"),"spin-speed":P("spin","Top speed","How fast the reels run in the middle of the spin.","speed"),"spin-mid":P("spin","Spin length","How long the reels run at full speed before stopping.","spin-length"),"spin-ss":P("spin","Start stagger","Delay between one reel starting and the next.","start-stagger"),"spin-st":P("spin","Stop stagger","Delay between one reel stopping and the next.","stop-stagger"),"spin-ant":P("spin","Anticipation time","Extra time a teased reel keeps spinning, slowly, before it lands.","antic-time"),"spin-ant-v":P("spin","Anticipation crawl speed","How fast a teased reel crawls while it builds suspense.","antic-crawl"),"spin-zoom-on":P("spin","Anticipation zoom","The camera pushes in on the teased reel, follows it from reel to reel and eases out after it lands.","zoom"),"spin-zoom":P("spin","Zoom amount","How far the camera pushes in on a teased reel.","zoom-amount"),"spin-scatter-lit":P("spin","Keep scatters lit through the tease","While a reel teases the others dim. Scatters that already landed stay lit and glowing over the dim until the teased reel lands; off, they pop and fade back into it.","scatter-lit"),"spin-stop-order":P("spin","Stop order","Which reel stops first. The tease goes to the reels that stop last.","stop-order"),"sec:wins/win-tiers":P("wins","Win tiers","Big win titles (BIG, MEGA, EPIC...), each from its threshold in bets. A big win shows the tier it reaches, or climbs through every tier on the way.","tiers"),"tier-titles-final":P("wins","Only the tier reached","A big win shows just the title of the tier it reaches: EPIC WIN straight away, with one count up and that tier's particles.","tier-titles"),"tier-titles-climb":P("wins","Climb through the tiers","The title starts at the first tier and steps up (BIG, MEGA, EPIC) each time the count passes a threshold, with a flash, a shake and the next tier's particles. The count runs longer, one stretch per tier.","tier-titles"),"wf-style-pop":P("wins","Pop in place","Winning symbols pulse where they are while the win counts.","winfx-pop"),"wf-style-fly":P("wins","Fly","Winning symbols fly to a spot you pick. When they land they count into the win one by one, or fuse into one big symbol. The flight is the same either way: its arc, pace, rotation and timing.","winfx-fly"),"wf-style-collect":P("wins","Beam to the pots","Every winner fires a saber beam up into its pot above the machine, one by one; each catch counts up the win and the pot's nameplate. Needs the pots on (Features).","beam-collect"),"wf-land-count":P("wins","Count into the win","Each winner shrinks and vanishes as it lands, and every landing adds its share to the win meter. Usually aimed at the win meter.","winfx-fly"),"wf-land-fuse":P("wins","Fuse into one","The winners gather at the spot, each waiting for the last, then fuse into one big symbol with a flash and a shake; the win counts up under it. Usually aimed at the middle of the reels.","winfx-fuse"),"wf-big":P("wins","Big symbol size","How big the fused symbol grows, in cells."),"wf-spot":P("wins","Fly to","Where the winners go: the win meter, the win amount, above the reels, the middle of the reels or of the winners, the screen centre, or a custom spot you can pick on the preview. Count and Fuse each keep their own spot, so a round that fuses does not land on the meter. The preview marks the spot while the Wins tab is open."),"wf-arc":P("wins","Arc height","How high winners hop, in cells above the higher of their cell and the spot (a long flight goes a little higher). 0 flies in a straight line; low skims, high lobs. While the Wins tab is open the preview draws each flight as a dashed line, so you can see it change.","arc-height"),"wf-rotate":P("wins","Rotate with the path","How far winners turn to face where they fly, like Auto-Orient in After Effects. 0 keeps them upright; around 25 to 40% they lean with the curve and stay easy to read; 100 points them fully along it. A winner flying left mirrors instead of turning upside down, and one straight above or below its spot stays upright.","fly-rotate"),"wf-pace-even":P("wins","Even pace","Winners are thrown: off the cell at full speed, slowing over the top of the arc and dropping fast into the spot.","pace-even"),"wf-pace-magnet":P("wins","Magnet pace","Winners creep off their cell, then snap into the spot as if pulled by a magnet: halfway through the flight they have gone 6% of the way, and they land at four times the even speed.","pace-magnet"),"wf-pace-wind":P("wins","Wind-up pace","Winners pull back first (half a cell at most), then shoot into the spot. Works on a straight line or an arc.","pace-wind"),"wf-flight":P("wins","Flight time","How long each winner takes from its cell to the spot."),"wf-order":P("wins","All at once or one by one","At 0 every winner leaves together; at 100 they leave one every 0.3 s (closer on a big win). Fusing winners wait at the spot until the last arrives.","fly-order"),"fx-lines-on":P("wins","Winning lines","Draws the payline through a line win. The winners light up either way.","lines"),"fx-pop":P("wins","Winning symbol pop","How much winning symbols grow when they pulse.","pop-size"),"fx-dim":P("wins","Dim other symbols","Darkens the symbols that are not part of the win so the winners stand out.","dim"),"sec:effects/win-particles":P("effects","Win particles","Coins, confetti and sparkles thrown by each win moment. Pick an explosion and a particle per moment.","particles"),"fx-shake":P("effects","Screen shake","How hard the screen shakes on landings, big wins and features.","shake"),"fx-land-shake":P("effects","Build-up shake","Every reel or cell that brings a winner lands with a bump that grows, and a note that climbs.","land-shake"),"fx-flash":P("effects","Flashes","White flashes on big moments.","flash"),"fx-rays":P("effects","Light rays","Rotating light rays behind big win titles and the wheel.","rays"),"fx-bokeh":P("effects","Background lights","Soft floating lights in the background.","bokeh"),"fx-line":P("effects","Payline glow","How strongly the paylines glow.","line-glow"),"w-landing-center":P("wheel","Centred landing","The wheel stops in the middle of the segment.","wheel-center"),"w-landing-random":P("wheel","Natural landing","The wheel stops anywhere inside the segment.","wheel-random"),"w-landing-tease":P("wheel","Edge tease","The wheel stops right next to the boundary, almost on the neighbour.","wheel-tease"),"w-landing-slip":P("wheel","Almost slips","The wheel creeps into the next peg, nearly tips over, rolls back, and the pointer springs past straight.","wheel-slip"),"w-pointer-top":P("wheel","Pointer on top","The pointer hangs at the top, pointing down.","pointer-top"),"w-pointer-bottom":P("wheel","Pointer at the bottom","The pointer stands at the bottom, pointing up.","pointer-bottom"),"w-framing-full":P("wheel","Whole wheel","The whole wheel on screen.","frame-full"),"w-framing-half":P("wheel","Top half","A bigger wheel with only its top half showing.","frame-half"),"w-framing-close":P("wheel","Close-up","A huge wheel: only the cap near the pointer shows.","frame-close"),"w-framing-rise":P("wheel","From above","The wheel hangs from the top of the screen with the pointer at the bottom.","frame-rise"),"w-push":P("wheel","Push in on the pointer","The camera leans in on the pointer as the wheel slows down.","wheel-push"),"seg-k-0":P("wheel","Segment kind","Prize pays its value. Spin again spins the wheel once more. No win pays nothing.","wheel-again"),"seg-icons-all":P("wheel","Icons on every segment","Gives every segment a built-in icon, richer for bigger prizes.","seg-icons"),"w-centre-icon":P("wheel","Centre icon","The icon on the hub: the star by default, any built-in icon or your own."),"w-label-height":P("wheel","Text height","How far out from the hub the segment text sits.","label-height"),"w-icon-height":P("wheel","Icon height","How far out from the hub the segment icons sit.","icon-height"),"ri-fs-wilds-sticky":P("round","Sticky wilds","Wilds that land stay put for the rest of the free spins; their reel spins on around them. A free spin land =========================================

1. Unzip this folder anywhere. Keep "${t}" next to the "assets" folder.
2. In After Effects (2026 or any CC version, Mac or Windows): File >
   Scripts > Run Script File... and pick "${t}". Do not double-click
   the .jsx: that opens it in another app.
3. The script builds one project folder per format (${o.join(", ")}).
   Open the main comp and press space to play.${o.length>1?`
   The art every format shows the same way (symbols, particles, pots,
   titles, the logo) is built once in "Shared Placeholder Comps" and every
   format uses it: replace or animate it there and all formats follow.`:""}

On a Mac
- The script and the file names are plain ASCII, so the script reads the
  same on a Mac as on Windows.
- macOS asks before an app reads your Downloads, Desktop or Documents
  folder. If After Effects says the asset files were not found, allow it
  in System Settings > Privacy & Security > Files and Folders (or move
  the unzipped folder elsewhere), then run the script again.
- Fonts: install the fonts listed under Notes below (double-click a font
  file to install it with Font Book).

How the project is organised
Most of the animation is decided in Reel Studio (outcomes, timing, motion,
effects). The After Effects project is built so you can finish the look
there: every piece of art and every effect is a placeholder comp, the
timing lives in the round comps, and a few controls sit on SLOT CONTROL.

- Placeholder Comps/: the art and the effect looks, each built once. Every
  use in the animation is a layer of that comp, so replacing the art or
  animating inside a placeholder updates every use.
  - Boxes/: every box on screen as one comp, so it moves, scales and
    fades as a unit: "Win Meter" (panel, labels, counter), each jackpot
    "<name> Box" (glow, plate, light, value; the box pops), each pot's
    "<name> Nameplate", a wheel's "R03 ... Prize Plaque" (plaque, label,
    counter and the WIN CTRL it reads) and "Spin Again" plaques, and each
    round's full-screen moments ("Big Win", "Total Win", "Banner",
    "Jackpot Title", "Grand"). A box keeps its parent's clock (it starts
    at 0), so its times read the same as the round's.
  - Symbols/: "Symbol 01 <name>" ... one comp per symbol (coins, the
    multiplier orb and the empty cell too), at full resolution: the art
    shows at its own pixel size at 100%. Replace or animate the art there.
    Symbols/Cell size holds "Symbol 01 <name> (cell)" ..., the same symbol
    at reel cell size (scaled down, Collapse Transformations on, so it
    stays sharp), which the reels and effects use. "Win 01 <name>" ... the
    symbol's win animation: it plays once from the start, then loops the
    tail; an uploaded PNG sequence or sprite sheet is laid out frame by
    frame. "Symbols Atlas" holds one symbol per frame for the reels.
  - Machine/: Background, Machine Back, Machine Frame, Marquee Lights (the
    bulbs blink inside it, faster during wins), Logo, Win Meter Panel,
    Vignette.
  - Effects/: FX Shockwave (a ring that grows and fades in 0.7 s), FX Light
    Rays and FX Small Rays (shape layers: wedges with a feathered mask that
    fades them out; change the fill to recolour them, or edit the paths),
    FX Cell Frame (win highlight), FX Anticipation,
    FX Tease Cell, FX Sticky Frame, FX Coin Lock, FX Special Coin Lock,
    FX Near Miss, FX Wild Beam, FX Collected, FX Mystery Glow, FX
    Collector Glow, FX Pot Glow, FX Boost Target, FX Boost Flash, FX Beam
    Head, FX Cell Shade, FX Jackpot Glow and FX Jackpot Fly Glow.
  - Pots/: "Pot 1 <name>" ... the art of each pot above the machine.
    Replace it with your own and every use follows.
  - Jackpots/: "Jackpot Grand", "Jackpot Major", "Jackpot Minor", "Jackpot
    Mini": each box's plate (or your own box art) with its name, at its size. The
    value is a text layer over it in the main comp.
  - Particles/: "Particle <name>" for each particle the win explosions
    throw (gold coin, stars, confetti, your own art...). A set of variants
    holds one per frame and each particle picks one; an animated particle
    holds its frames in order and each particle plays it from a random
    frame. Replace the art here and every explosion follows.
  - Titles/: "Title <tier>" for each title, with its light sweep, and its
    words as a "Text (editable)" layer in the Main Font, switched off: turn
    it on (and the art off) to change the words or their font.
  - Paylines/: "Payline NN", each drawing itself on.
  - Plaques/: the multiplier, prize and hold & spin plaques.
  - Wheel/: Wheel Disc (the turning part: your face art, Wheel Segments,
    an icon layer per segment icon and a text layer per label, and the hub
    with its centre icon when it turns), Wheel Hub, Wheel Center, Wheel
    Icon NN, Wheel Ring, Wheel Bulbs A and B, Wheel Pointer (its anchor is
    the pivot). Replace any of them with your art.
  - Counters/: "Counter Digits", the 0-9 strip every counter rolls
    through. Change its colour or style once and every counter follows.
  The Logo placeholder (a logo painted from the machine's name) and each
  Jackpot plate also hold their words as a text layer, switched off.

Effects and their controls
- Every effect placeholder (Effects/ and Titles/) has an "FX CONTROLS"
  null. Its sliders and switches drive every use of that effect:
  - "Size %" and "Opacity %": every use bigger, smaller, brighter, fainter.
  - "Colour": effect art is white and each use is tinted to its colour;
    untick it to keep your art's own colours ("FX Colour" on SLOT CONTROL
    does it for all effects at once).
  - "Speed %" (FX Shockwave): how fast the ring grows.
  - "Spin %" (rays): how fast the rays turn.
  - "Built-in Motion" (rays and titles): untick it when your art brings
    its own motion; the uses then stop spinning, popping and springing.
  - "Light Sweep" (titles): the sweep across the title.
- Swap an effect for a prerendered movie (a .mov with alpha, a PNG
  sequence...): open its placeholder, switch off or delete the art layer,
  and drop your movie in at 0:00. Every use starts it
  at the moment the effect happens: shockwave uses last 4 s, so a movie up
  to 4 s plays in full; frames and glows last as long as they show (set a
  looping movie to loop in Interpret Footage). Untick "Colour" for a
  coloured movie and "Built-in Motion" for one that moves by itself.
- Or swap the whole comp: select the uses and Alt-drag (Option-drag on a
  Mac) your own comp onto them in the timeline. Each use reads the
  controls of the comp it shows, so your comp can bring its own "FX
  CONTROLS" null (copy it from the placeholder); without one, the uses
  play it at 100%, untinted and moving by themselves. Nothing refers to the
  placeholder by name, so you can delete it.
- Particle explosions: replace the art in Particles/ and every explosion
  follows; to swap one explosion for a movie, open its comp in
  Rounds/Particles, switch its particle layers off and drop the movie in.

Full-screen wins in HD
- Titles, the logo and the particle art are painted twice the size they
  show, and their uses are scaled to 50% (or less): enlarge a title or a
  particle up to 200% and it stays sharp. The light rays are vector shapes
  in comps twice the size of their biggest use (nothing to ship, same
  sharpness). The counters are built at twice the size of the biggest
  amount, and the shockwave ring is drawn as big as its biggest use. A
  winning symbol that merges into a big one is drawn from its full-size
  art.
- Reels/: one precomp per reel (or per cell for per-cell spins). Each has a
  CTRL null with a "Spin" slider: its keyframes are the start, mid and end
  phases from Reel Studio, with the same speed and influence eases. Open the
  Graph Editor on that slider to reshape a start or a stop. The reel reads
  its symbols from Symbols Atlas as the slider rolls it, like an odometer
  wheel. Tumbling symbols are ordinary keyframed layers in the same
  precomps.
  - Hold and Spin/ (when the animation has coins): "Hold Cell C-R", one
    little reel of coins and empty cells per cell, on its own Spin slider,
    with the coin values on "Value" text layers.
- Rounds/: one comp per round that shows something. It places the
  placeholders in time: paylines, win comps on the winning cells, cell
  frames, shockwaves, expanding wilds, multipliers, titles, the wheel, coin
  landings and the collect. Move a layer to retime an effect.
  Mystery blocks turn over as "Mystery Block" then "Mystery Reveal"
  layers; the collector takes each cash value as a flying text layer.
  Boosters: "Boost Target" marks a cell in its pot's colour, "Boost From"
  trembles until the beam hits, the new symbol pops and "Boost Flash"
  bursts. Beams are "Beam Down n" (a pot firing) and "Beam Up n" (a
  winner beaming to its pot) shape layers: a Bezier path drawn on by Trim
  Paths, soft strokes in the pot's colour round a white core that thin to
  the tail (each stroke's Taper, After Effects 2020+: Start Width is the
  tail's width), a "Head" group with the white-hot ball, and a "Beam Head
  n" glow riding on the head. Edit the path to reshape a beam.
  A winner that beams to its pot darkens under a "Drained n" shade.
  For a saber plug-in (Video Copilot Saber and the like, which draw along
  a layer's masks): every beam, payline, jump or merge flight, winning
  cell frame and anticipation frame has a "Saber Path ..." solid, switched
  off at the bottom of its comp, with the path as a mask in mode None.
  Its "Head %" and "Tail %" sliders follow the effect's own draw-on: put
  the plug-in on that solid, switch it on, and link the plug-in's End and
  Start Offset to them.
  A round that awards a jackpot sends its amount from the box down into
  the win meter (with no meter, into the middle of the reels, where it
  stays a moment) as a "Jackpot <tier> Win" text with a "Fly Glow". A box
  with its win title on takes the whole screen instead, like the Grand:
  "Title jp_major" (and so on) and a counter reading its own "MAJOR
  JACKPOT n CTRL" slider.
  While a cell is held (a sticky or walking wild, a mystery block turning,
  a booster landing) a "Sticky n" or "Reveal n" mask cuts it out of its
  reel.
  Winning symbols that jump into the score are "Jump <symbol>" layers and
  ones that merge are "Pull <symbol>" layers plus a "Merged <symbol>": their
  position, scale and opacity expressions hold the flight from Reel Studio
  (time, path, landing spot), so they move exactly as in the preview.
  - Particles/: every win explosion (small burst, fountain, rain, confetti
    cannons, fireworks...) is a comp of its own. Each layer is one
    particle: a use of its Particle placeholder whose position, rotation,
    scale and opacity expressions hold the exact flight it has in Reel
    Studio (gravity, air drag, flutter). Slide the comp to retime it.
    Long running emitters loop a 5 second cycle seamlessly: each particle's
    age wraps by the cycle, so extending the comp keeps them going.
- Counter Rigs/: the rolling money counters (win meter, big win amounts,
  the hold & spin collect, the grand). Each COUNTER CTRL > Value reads its
  source slider (WIN CTRL > Amount in a round comp, SLOT CONTROL in the
  main comp); key or pick-whip it to drive the counter yourself. Each
  column turns as the one below it wraps, like the Odometer plugin, so no
  plugin is needed.
- Sound/SFX: ${n?`every sound cue on its own audio layer at its time (${n} distinct clips in assets/sfx), named after the cue and its round and coloured by group: Reels blue, Wins green, Coins yellow, Big Win red, UI purple. The SFX MIX null holds the levels in dB: "Master" and one slider per group; every layer reads its two sliders. Mute, move or swap any cue layer; to change a sound everywhere it plays, select its file in Slot Assets/SFX and use File > Replace Footage.${s<0?` Master includes ${s} dB of headroom so the loudest moment stays below 0 dB (After Effects has no compressor).`:""}`:"sound was switched off in Reel Studio, so there are no sound cues."}
- Main comp: the machine, reels, sticky wilds and walking wilds (each step
  hops in from the reel it left), the tease ("Tease Dim Rn" over the
  other reels and a lit "Scatter Lands" copy of every scatter that
  lands), coin lock frames, logo, free spins ribbon, HUD texts, the win
  meter, the round comps, the flash and the SFX comp, with a marker where
  each round starts. With pots above the machine: each "Pot n" stands
  behind the frame with a "Charge Light" copy, squashing as it catches
  and kicking as it fires; over the frame its "Glow" and its nameplate
  ("Pot n Plate" and a counter reading the "Pot n" slider). With jackpot
  boxes: each "Jackpot <tier>" plate with a "Glow" behind it, a "Light"
  copy over it and a "Win Sweep" (CC Light Sweep), all popping and
  glowing by expressions when the box is won or its coin lands; its
  "Value" text reads the "Jackpot <tier>" slider, and a Shockwave plays at
  every win. SCREEN SHAKE is a
  parent null whose position expression holds the shake events. Ambient
  particles ("Ambient <template>") sit right above the background, and
  particles set to run to the end ("Rxx <template>") above the round
  comps. With the anticipation zoom on, a CAMERA null parents SCREEN SHAKE
  and the background: its position and scale expressions push in on the
  teased reel and ease back out.
- SLOT CONTROL (main comp):
  - "Meter", "FS Total" (and "Collect" with Hold & Spin, "Pot 1" to "Pot 3"
    with pots) drive the counters.
  - "Jackpot Grand" ... "Jackpot Mini" (with jackpot boxes): what each box
    shows. Its expression holds the seed, the growth per second and every
    win (when, and what it paid); edit them there, or replace the
    expression with your own keyframes and the value text follows.
  - "Shake %", "Flash %", "Dim %", "Particles %" (thins every explosion
    out), "Spin Blur %" (the reels' up-and-down blur), "Win Pop %", "Zoom %"
    (the anticipation zoom) and "Glow %" (every glow at once; each glow
    keeps its art on top) scale those effects; 100 is what Reel Studio
    showed.
  - "FX Colour": tints the effect placeholders (see above).
- The wheel game has no machine layers: just the background, the wheel and
  its prizes, one round comp per spin handing the wheel to the next.

Transparency
- ${a?"Background and Vignette are switched off in this build.":"Switch off the Background and Vignette layers in the main comp."}
  Then Composition > Add to Render Queue, Output Module: QuickTime, Apple
  ProRes 4444, Channels: RGB + Alpha. That gives a transparent MOV.

Notes
- Fonts: text layers ask for ${i}. Install them (Google Fonts, or the
  files in fonts/). Every text layer takes its font from the "Fonts" comp
  (in Slot Assets): pick another font on its "Main Font" layer (or "Wheel
  Font" for the wheel labels) and all the text follows (After Effects 2020
  or later; older versions keep the font each layer was built with).
- Reel curvature and bloom are preview-only effects; the AE reels are flat.
- assets/ holds only the art and sounds this animation uses, and each
