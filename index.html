  // A round's jackpot: its amount flies from the box down into the win

  function buildJackpotFly(comp, R, rel) {

      "var x = " + J.from[0] + " + (" + (J.to[0] - J.from[0]) + ") * k; var y = " + J.from[1] + " + (" + (J.to[1] - J.from[1]) + ") * k - Math.sin(k * Math.PI) * " + J.lift + ";\n";

  // A stroke that thins from the path's end back to its start: After

  function taperStroke(st, tail) {
    if (tail >= 100) return;
    try {
      var tp = st.property("ADBE Vector Stroke Taper");
      menuPick(tp.property("ADBE Vector Taper Length Units"), /percent|prozent|pourcent|porcentaje|percentuale|procent|%/i, 2);
      tp.property("ADBE Vector Taper Start Length").setValue(100);

  // Saber beams between the pots and the cells: a Bezier path drawn on by
  // Trim Paths (start = the tail, end = the head; core/pots.js beamState),
  // stroked in soft passes of the pot's colour round a white core, thinning
  // to the tail, with a white-hot ball and a glow riding on the head.
  function buildBeams(comp, R, rel) {
    var i, k, BM = DATA.beam;
    for (i = 0; i < R.beams.length; i++) {
      var bm = R.beams[i], f0 = rel(bm.fire), dur = bm.travel + BM.hold + BM.fade, z = bm.bez;
      var pre = "function c01(x){return x<0?0:(x>1?1:x);}\nvar f = time - " + f0 + "; var tr = " + bm.travel + ";\n" +
        "var u = c01(f / tr); var head = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;\n" +
        "var tail = Math.min(head, c01((f - tr * 0.6) / (tr * 0.4 + " + BM.hold + " + " + (BM.fade * 0.5) + ")));\n";
      var fade = "(1 - c01((f - tr - " + BM.hold + ") / " + BM.fade + "))";
      var onPath = pre + rowsExpr("Q", bm.pts) + "var n = Q.length - 1; var x = head * n; var j = Math.min(n - 1, Math.floor(x)); var kk = x - j;\n[Q[j][0] + (Q[j + 1][0] - Q[j][0]) * kk, Q[j][1] + (Q[j + 1][1] - Q[j][1]) * kk];";
      var L = shapeLayer(comp, (bm.up ? "Beam Up " : "Beam Down ") + (i + 1) + " " + DATA.pots.items[bm.pot].name);
      // The white-hot ball on the head, first so it sits in front.
      var hb = group(L, "Head");
      var el = ellipse(hb, [0, 0], [BM.core, BM.core]);
      el.property("ADBE Vector Ellipse Position").expression = onPath;
      fill(hb, [1, 1, 1], 100);
      var g = group(L, "Beam");
      var p = g.addProperty("ADBE Vector Shape - Group");
      var sh = new Shape();
      sh.vertices = [[z[0], z[1]], [z[6], z[7]]];
      sh.outTangents = [[z[2] - z[0], z[3] - z[1]], [0, 0]];
      sh.inTangents = [[0, 0], [z[4] - z[6], z[5] - z[7]]];
      sh.closed = false;
      p.property("ADBE Vector Shape").setValue(sh);
      var tp = g.addProperty("ADBE Vector Filter - Trim");
      tp.property("ADBE Vector Trim Start").expression = pre + "tail * 100;";
      tp.property("ADBE Vector Trim End").expression = pre + "head * 100;";
      // The white core first: it sits in front.
      for (k = BM.passes.length - 1; k >= 0; k--) {
        var ps = BM.passes[k];
        var st = stroke(g, ps[2] ? [1, 1, 1] : bm.color, ps[0]);
        st.property("ADBE Vector Stroke Opacity").setValue(ps[1] * 100);
        taperStroke(st, BM.tail);
        if (ps[2]) continue;
        var fk = "(0.85 + 0.15 * Math.sin(time * 61) * Math.sin(time * 37 + 1))";
        st.property("ADBE Vector Stroke Width").expression = "value * " + fk + ";";
        st.property("ADBE Vector Stroke Opacity").expression = "value * " + fk + ";";
      }
      L.blendingMode = BlendingMode.ADD;
      P(L, "ADBE Opacity").expression = pre + "100 * " + fade + ";";
      trim(L, f0, f0 + dur);
      var hd = inst(comp, beamHeadPH(), "Beam Head " + (i + 1), null, f0, f0 + dur);
      if (!hd) continue;
      fxScale(hd);
      hd.blendingMode = BlendingMode.ADD;
      tint(hd, bm.color);
      P(hd, "ADBE Position").expression = onPath;

  // The beam head's glow: white discs stacked to fade out like the

  // ---------- Hold & Spin ----------
  // A coin layer that bounces in at time t, with its value on it.

  function buildTease(kids) {
    var TE = DATA.tease, TW = [], r, i, t0 = 1e9, t1 = 0;
    var envFn = "function tEnv(w) { var a = w[0] - " + TE.lead + ", b = w[1] + " + TE.tail + "; if (time < a || time > b) return 0; return Math.min(Math.min(1, (time - a) / " + TE.fin + "), Math.min(1, (b - time) / " + TE.tail + ")); }\n";
    for (r = 0; r < DATA.rounds.length; r++) {
      for (i = 0; i < DATA.rounds[r].tease.length; i++) {
        var w = DATA.rounds[r].tease[i];
        if (w[2] < 0) continue;
        TW.push(w);
        t0 = Math.min(t0, w[0] - TE.lead);
        t1 = Math.max(t1, w[1] + TE.tail);
      }
    }
    if (TW.length) {
      for (i = 0; i < DATA.reels; i++) {
        var td = solid(main, [0, 0, 0], "Tease Dim R" + (i + 1), DATA.cellW, DATA.winH, [DATA.reelXs[i], DATA.winTop + DATA.winH / 2]);
        P(td, "ADBE Opacity").expression = rowsExpr("TW", TW) + envFn +
          "var all = 0, own = 0; for (var k = 0; k < TW.length; k++) { var e = tEnv(TW[k]); all = Math.max(all, e); if (TW[k][2] == " + i + ") own = Math.max(own, e); }\n" +
          "(own > 0 ? 0 : " + TE.dim * 100 + " * all) * " + ctrl("Dim %") + " / 100;";
        trim(td, t0, t1);
        kids.push(td);
      }
    }
    for (r = 0; r < DATA.rounds.length; r++) {
      var RR = DATA.rounds[r];
      for (i = 0; i < RR.lands.length; i++) {
        var ld = RR.lands[i];
        kids.push(ring(main, [ld.x, ld.y], ld.t, DATA.cellW * 0.95, DATA.accent));
        var LL = inst(main, symComps[ld.s] || symComps[0], (ld.coin ? "Coin Lands R" : "Scatter Lands R") + (r + 1), [ld.x, ld.y], ld.t, ld.until);

        if (ld.lab) {

          P(T, "ADBE Scale").setValue([ld.lab[2] * 100, ld.lab[2] * 100]);

  }
  function coinPop(comp, it, t, dur, lab, name) {

  function buildRespin(comp, R, rel) {

  function buildCollect(comp, R, rel) {

  // The turning part of the wheel as one placeholder comp: your face art,
  // the segments, an icon layer per segment that has one and a text layer
  // per label (font, size and colour editable), and the hub when it turns.
  function wheelDiscPH() {
    var WH = DATA.wheel, D = WH.disc;
    return ph("Wheel Disc", "Wheel", D, D, DUR + 2, function (c) {
      var i, L;
      var part = function (key, rel2) {
        var src = imagePH(key, "Wheel", rel2);
        return src ? inst(c, src, key, [D / 2, D / 2]) : null;
      };
      part("Wheel Face", DATA.assets.wheelFace);
      part("Wheel Segments", DATA.assets.wheelSegments);
      for (i = 0; i < WH.icons.length; i++) {
        var ic = WH.icons[i], ia = ic.a * Math.PI / 180;
        var isrc = imagePH("Wheel Icon " + pad2(ic.k + 1), "Wheel", ic.file);
        if (!isrc) continue;
        L = inst(c, isrc, "Icon " + pad2(ic.k + 1), [D / 2 + Math.cos(ia) * ic.r, D / 2 + Math.sin(ia) * ic.r]);
        P(L, "ADBE Rotate Z").setValue(ic.a + 90);
      }
      for (i = 0; i < WH.labels.length; i++) {
        var lb = WH.labels[i], la = lb.a * Math.PI / 180;
        L = c.layers.addText(lb.text);
        L.name = "Label " + (i + 1) + " " + lb.text;
        var prop = L.property("ADBE Text Properties").property("ADBE Text Document");
        var td = prop.value;
        td.fontSize = lb.px;
        td.applyFill = true;
        td.fillColor = WH.fill;
        td.applyStroke = true;
        td.strokeColor = WH.stroke;
        td.strokeWidth = Math.max(1, Math.round(lb.px * 0.22));
        td.strokeOverFill = false;
        td.justification = ParagraphJustification.CENTER_JUSTIFY;
        try { td.font = WH.font; } catch (e) { try { td.font = DATA.font; } catch (e2) {} }
        prop.setValue(td);
        textExpr(L, null, undefined, "Wheel Font");
        // Turn about the middle of the text, reading outwards.
        P(L, "ADBE Anchor Point").setValue([0, -lb.px * 0.36]);
        pos(L, [D / 2 + Math.cos(la) * lb.r, D / 2 + Math.sin(la) * lb.r]);
        P(L, "ADBE Rotate Z").setValue(lb.a);
      }
      if (WH.hubSpins) {

  function buildWheel(comp, R, rel) {
    var w = R.wheel, WH = DATA.wheel, i, s;
    var inA = rel(w.inStart), inB = rel(w.inEnd), outA = rel(w.outStart), outB = rel(w.outEnd);
    var cx = WH.cx, cy = WH.cy, Rr = WH.R;
    // A wheel that is already on screen (the wheel game) skips its intro.
    var tInE = w.cont ? "var tIn = 1;" : "var tIn = c01((time - " + inA + ") / " + Math.max(0.01, inB - inA) + ");";
    var envExpr = EASE_LIB + tInE + " var tOut = c01((time - " + outA + ") / " + Math.max(0.01, outB - outA) + ");\n" +
      "var env = (1 - Math.pow(1 - tIn, 3)) * (1 - inCubic(tOut));\n";
    var dk = solid(comp, [0, 0, 0], "Darken", W * 1.2, H * 1.2, [W / 2, H / 2]);
    P(dk, "ADBE Opacity").expression = envExpr + "env * " + (DATA.game === "wheel" ? 30 : 86) + " * " + ctrl("Dim %") + " / 100;";
    var ry = inst(comp, raysPH(false), "Light Rays", [cx, cy]);
    if (ry) {
      ry.blendingMode = BlendingMode.ADD;
      spin(ry, 8.6);
      var rys = r4(100 * Rr * 3.4 / ry.source.width);
      P(ry, "ADBE Scale").setValue([rys, rys]);
      fxScale(ry);
      fxOpacity(ry, envExpr, "env * 45");
    }
    var rig = comp.layers.addNull(comp.duration);
    rig.name = "WHEEL RIG";
    pos(rig, [cx, cy]);
    var part = function (key, rel2, xy) { return inst(comp, imagePH(key, "Wheel", rel2), key, xy || [cx, cy]); };
    var disc = inst(comp, wheelDiscPH(), "Wheel Disc", [cx, cy]);
    var kids = [];
    // A glowing wedge on a segment of the disc, turning with it.
    var wedgeOn = function (segIdx, name, opExpr) {
      var seg = WH.segDeg, a0 = -90 + segIdx * seg + w.angle0, pts = [[cx, cy]], ang;
      for (s = 0; s <= 12; s++) {
        ang = (a0 + seg * s / 12) * Math.PI / 180;
        pts.push([cx + Math.cos(ang) * Rr, cy + Math.sin(ang) * Rr]);
      }
      var wedge = shapeLayer(comp, name);
      var wg = group(wedge);
      path(wg, pts, true);
      fill(wg, [1, 1, 1], 100);
      wedge.blendingMode = BlendingMode.ADD;
      P(wedge, "ADBE Opacity").expression = opExpr;
      wedge.parent = disc;
    };
    if (disc) {
      var rot = P(disc, "ADBE Rotate Z");
      rot.setValue(w.angle0);
      setKeys(rot, w.keys, -R.start);
      kids.push(disc);
      wedgeOn(w.segment, w.noWin ? "No Win Segment" : "Winning Segment", "var a = time - " + rel(w.spinEnd) + "; a < 0 ? 0 : Math.min(1, a / 0.3) * (30 + 25 * Math.sin(time * 10));");
      for (i = 0; i < w.agains.length; i++) {
        var ag = w.agains[i];
        wedgeOn(ag.segment, "Spin Again Segment " + (i + 1), "var a = time - " + rel(ag.at - 0.2) + "; (a < 0 || time > " + rel(ag.until) + ") ? 0 : Math.min(1, a / 0.3) * (30 + 25 * Math.sin(time * 10));");
      }

      if (ctr) kids.push(ctr);
    }
    var ringL = part("Wheel Ring", DATA.assets.wheelRing);
    if (ringL) kids.push(ringL);
    var wa = part("Wheel Bulbs A", DATA.assets.wheelBulbsA);
    var wb = part("Wheel Bulbs B", DATA.assets.wheelBulbsB);
    if (wa) { wa.blendingMode = BlendingMode.ADD; P(wa, "ADBE Opacity").expression = "Math.floor(time * (time > " + rel(w.spinEnd) + " ? 8 : 3)) % 2 == 0 ? 100 : 15;"; kids.push(wa); }
    if (wb) { wb.blendingMode = BlendingMode.ADD; P(wb, "ADBE Opacity").expression = "Math.floor(time * (time > " + rel(w.spinEnd) + " ? 8 : 3)) % 2 == 1 ? 100 : 15;"; kids.push(wb); }
    // The pointer pivots where the art says; it reads the disc's rotation
    // (pegs bend it) and, after an almost-slip, springs back past straight.

      var pw = ptr.source.width, ph2 = ptr.source.height;
      P(ptr, "ADBE Anchor Point").setValue(WH.anchor || [pw / 2, ph2 * 0.2]);
      pos(ptr, WH.pivot);
      ptr.name = "Pointer";
      var kick = w.kick ? "var k = time - " + rel(w.kick[0]) + "; if (k > 0 && k <= 1.6) d += " + w.kick[1] + " * Math.exp(-k * 5.5) * Math.sin(k * Math.PI * 2 * 2.2);\n" : "";
      P(ptr, "ADBE Rotate Z").expression = "var th = thisComp.layer(\"Wheel Disc\").transform.rotation.value; var seg = " + WH.segDeg + ", P = " + WH.pointerAngle + ";\n" +
        "var u = (((th - P) / seg) % 1 + 1) % 1; var w = 0.22, mx = " + WH.max + ", b = 0.3;\n" +
        "var d = u > 1 - w ? -mx * ((u - (1 - w)) / w) : (u < b ? -mx * Math.pow(1 - u / b, 2) * Math.cos(u / b * Math.PI * 1.5) : 0);\n" +
        kick + "P + d;";
      kids.push(ptr);
    }
    for (i = 0; i < kids.length; i++) {
      kids[i].parent = rig;
      P(kids[i], "ADBE Opacity").expression = envExpr + "env * 100;";
    }
    P(rig, "ADBE Scale").expression = EASE_LIB + tInE + " var tOut = c01((time - " + outA + ") / " + Math.max(0.01, outB - outA) + ");\n" +
      "var s = (0.3 + 0.7 * outBack(tIn)) * (1 - 0.35 * inCubic(tOut)) * 100; [s, s];";
    var title = titleLayer(comp, "wheel", WH.title, inA, rel(w.spinStart) + 1.1, W * 0.9);
    if (title) fadeKeys(title, inA, rel(w.spinStart) + 1.1, 0.3, 0.5);
    var pa = rel(w.prizeStart), PL = WH.plaque, Rp = PL[2];
    var plaqueSrc = plaquePH("Prize Plaque", Rp * 1.5, Rp * 0.62, Rp * 0.15, 96, [0.91, 0.73, 0.29], Math.max(2, Rp * 0.03));
    // Spin again: the plaque says so between the spins.
    for (i = 0; i < w.agains.length; i++) {
      var g2 = w.agains[i], ga = rel(g2.at), gb = rel(g2.until);
      var apl = inst(comp, plaqueSrc, "Spin Again Plaque " + (i + 1), [PL[0], PL[1]], ga, gb);
      var aPop = EASE_LIB + "var k = outBack(c01((time - " + ga + ") / 0.4)) * 100 * c01((" + gb + " - time) / 0.3); [k, k];";
      P(apl, "ADBE Scale").expression = aPop;
      var albl = text(comp, "Spin Again Label " + (i + 1), g2.label, Math.round(Rp * 0.2), [PL[0], PL[1]]);
      P(albl, "ADBE Scale").expression = aPop;
      trim(albl, ga, gb);
      ring(comp, [PL[0], PL[1]], ga, Rp * 1.3, DATA.accent);
    }
    if (!w.noWin) {
      emitters(comp, R, "under", ["wheel"]);
      ring(comp, [PL[0], PL[1]], pa, Rp * 1.6, DATA.accent);
    }
    // The plaque leaves before the next spin in the wheel game.
    var pEnd = Math.min(outB, rel(w.plaqueEnd));
    var pl = inst(comp, plaqueSrc, "Prize Plaque", [PL[0], PL[1]], pa, pEnd);
    var popE = EASE_LIB + "var k = outBack(c01((time - " + pa + ") / 0.5)) * 100; [k, k];";
    P(pl, "ADBE Scale").expression = popE;
    // No win: the label sits in the middle and nothing counts.
    var lbl = text(comp, w.noWin ? "No Win Label" : "Prize Label", w.label, Math.round(Rp * 0.2), [PL[0], PL[1] - (w.noWin ? 0 : Rp * 0.1)]);
    P(lbl, "ADBE Scale").expression = popE;
    trim(lbl, pa, pEnd);
    var fadeOut = envExpr + "env * 100 * c01((" + pEnd + " - time) / 0.35);";
    P(pl, "ADBE Opacity").expression = fadeOut;
    P(lbl, "ADBE Opacity").expression = fadeOut;
    if (w.noWin) return;
    winCtrl(comp, countKeys(rel(w.countStart), rel(w.countEnd), R.amount));
    var od = counters(comp, [PL[0], PL[1] + Rp * 0.12], Math.round(Rp * 0.14), R.amount);
    trim(od, pa, pEnd);
    P(od, "ADBE Opacity").expression = fadeOut;
  }

  // ---------- sound ----------
  // "SFX": one audio layer per cue at its time, named after the cue and its
  // round and coloured by group. Levels are decibels on the SFX MIX null:
  // Master plus one slider per group; each layer reads its two sliders.
  var fSfx = null;
  function buildSound() {
    var S = DATA.sfx, i;
    if (!S) return null;
    var sc = addComp("SFX" + SUFFIX, W, H, DUR, dir("sound", "Sound", top));
    sc.comment = "Every sound cue on its own layer. Mix with the sliders on SFX MIX; mute, move or swap any cue.";
    if (!fSfx) fSfx = folder("SFX", fShared);
    for (i = S.events.length - 1; i >= 0; i--) {
      var e = S.events[i], g = S.groups[e[2]];
      var it = imp(S.clips[e[1]], fSfx);
      if (!it) continue;
      var L = sc.layers.add(it);
      L.name = e[3];
      L.startTime = e[0];
      try { L.label = g.label; } catch (x) {}
      L.property("ADBE Audio Group").property("ADBE Audio Levels").expression = "var m = thisComp.layer(\"SFX MIX\");\nvar d = m.effect(\"Master (dB)\")(1) + m.effect(\"" + g.name + " (dB)\")(1);\n[d, d];";
    }
    var mix = sc.layers.addNull(DUR);
    mix.name = "SFX MIX";
    slider(mix, "Master (dB)").setValue(S.master);
    for (i = 0; i < S.groups.length; i++) slider(mix, S.groups[i].name + " (dB)").setValue(S.groups[i].db);
    roundMarkers(sc);
    var SL = main.layers.add(sc);
    SL.name = "SFX";
    return SL;
  }

  function buildFormat() {
    W = DATA.W;
    H = DATA.H;
    FPS = DATA.fps;
    DUR = DATA.duration;
    PH = {};
    FOLD = {};
    top = folder(DATA.name + SUFFIX);
    mainName = uniqueName(DATA.name + SUFFIX);
    createMain();
    fPH = folder("Placeholder Comps", top);
    fRounds = folder("Rounds", top);
    // The wheel game has no reels, so no symbol comps.
    if (DATA.game !== "wheel") {
      fSymbols = dir("PH/Symbols", "Symbols", fPH);
      fReels = folder("Reels", top);
      fHold = DATA.hold ? folder("Hold and Spin", fReels) : null;
      buildSymbols();
      buildAtlas();
    }
    buildDigits();
    buildMain();
  }

  if (!app.project) app.newProject();
  proj = app.project;
  app.beginUndoGroup("Build slot animation");
  try {
    fShared = folder("Slot Assets");
    buildFonts();
    var f;
    for (f = 0; f < DATA_LIST.length; f++) {
      DATA = DATA_LIST[f];
      SUFFIX = DATA_LIST.length > 1 ? " " + DATA.W + "x" + DATA.H : "";
      buildFormat();
    }
    main.openInViewer();
  } catch (err) {
    alert("The slot build stopped: " + err.toString() + (err.line ? " (script line " + err.line + ")" : ""));
  }
  app.endUndoGroup();
  // Missing files: a few names, and on a Mac the likely cause when none
  // could be read (macOS asks before an app reads Downloads, Desktop or
  // Documents).

 or instantly.","start-windup"),"sec:spin/mid":B("spin","Mid","The full-speed stretch: how long it spins, how fast, and its motion blur.","blur"),"sec:spin/end":B("spin","End","How a reel lands: bounce, elastic, hard stop or soft, how long it takes and how far it overshoots.","end-bounce"),"sec:spin/reel-timing":B("spin","Reel timing","The delay between one reel starting, or stopping, and the next.","stop-stagger"),"sec:spin/anticipation":B("spin","Anticipation","The tease on a reel that could still trigger: extra time, a slower crawl, a zoom in, and scatters kept lit.","antic-time"),"sec:spin/between-rounds":B("spin","Between rounds","The gap between rounds, and the holds before the first and after the last."),"sec:wins/winning-symbols":B("wins","Winning symbols","How winners celebrate: pop in place, jump into the score, merge into one, or beam to the pots; with the winning lines and the rest dimmed.","winfx-jump"),"sec:wins/win-timing":B("wins","Win timing","How long each kind of win shows, the count-up per big win tier, and the beats of tumbles, multipliers and wilds."),"sec:effects/intensity":B("effects","Intensity","How strong each effect is, from payline glow and sparkles to light rays, screen shake, flashes and bloom.","shake"),"sec:effects/explosion-templates":B("effects","Explosion templates","Every particle explosion, playing live. Pick one for each win moment in Win particles."),"sec:effects/titles-and-font":B("effects","Titles and font","The display font for titles, counters and wheel labels, and the words of each feature title."),"sec:wheel/segments":B("wheel","Segments","Clockwise from the top: each segment's fill, icon, label and value, and whether it is a prize, a spin again or no win.","seg-icons"),"sec:wheel/framing":B("wheel","Framing","How the wheel sits on screen: whole, half from below, a close-up or rising in, with its own zoom and centre.","frame-half"),"sec:wheel/pointer":B("wheel","Pointer","Where the pointer sits, its size and art, and how pegs bend it as they pass.","pointer-top"),"sec:wheel/look":B("wheel","Look","The labels' font, colour, size and height, the icons, the centre icon, the hub and which parts show.","label-height"),"sec:wheel/spin":B("wheel","Spin","How many turns it makes, how it lands by default (centre, random, tease, almost slips) and whether values are multiplied by the bet.","wheel-slip"),"sec:sound/sound-track":B("sound","Sound track","Every cue is made in sync with the animation. Set the volume and each group's level; it plays with the preview, goes into the MP4 and ships to After Effects."),"sec:export/output":B("export","Output","The project name, canvas size, frame rate and transparent background for every export."),"sec:export/after-effects-project":B("export","After Effects project","The main export: a zip with a script that rebuilds this animation as an editable After Effects project, in every format you pick."),"sec:export/quick-preview-mp4":B("export","Quick preview (MP4)","A quick video to share, rendered frame by frame at full resolution, with or without the sound track."),"sec:export/soundtrack-wav":B("export","Soundtrack (WAV)","The whole mix as the preview plays it, for editing the sound elsewhere."),"sec:export/still-frame":B("export","Still frame","The frame under the playhead as a PNG, without the background when Output says transparent."),"sec:export/project-file":B("export","Project file","Everything in one .json file, your images and sounds included, to reopen the exact animation later."),"sec:seq/quick-sequence":B("seq","Quick sequence","Builds a whole run of rounds in one go: warm-up spins, then the finale you pick."),"sec:bank/scene-art":B("bank:scene","Scene art","The background, a frame overlay and your logo. With the pots and jackpot boxes on, their art follows here."),"sec:bank/symbols":B("bank:symbols","Symbols","Each symbol is fitted to its cell. Role: what it does (point at a role, or at the role chips under the symbols). Low or high pay: a round  each is a placeholder comp in Placeholder Comps/Wheel."),"sec:bank/your-own-sounds":B("bank:sounds","Your own sounds","Your file plays from its start at each cue, at the track volume and its group level. In After Effects each cue is its own audio layer in the SFX comp."),"sec:bank/fonts":B("bank:fonts","Fonts","Your fonts come first in the font list. They ship in the After Effects package; install them there."),"sym-w-help":B("bank:symbols","Shows up","How often a symbol fills the reels around the wins, in stages, with its share of them. Only in wins: never as filler, but it still wins when a round picks it. Wilds, scatters and the like only show where a round puts them."),"sym-tier-help":B("bank:symbols","Low or high pay","A round whose symbol is Auto wins with a low-pay symbol on a small win and a high-pay one on a bigger win. Pots that upgrade cells turn them into low-pay symbols. Amounts come from the round, not from this."),"sym-roles-help-normal":B("bank:symbols","Paying symbols","Make the wins, along lines, ways or in clusters. Low or high pay decides which one a round set to Auto wins with.","pay-mode"),"sym-roles-help-wild":B("bank:symbols","Wild","Stands in for any paying symbol to complete a win. A round can make it expand, stick, walk or carry a multiplier.","expand"),"sym-roles-help-scatter":B("bank:symbols","Scatter","Counts anywhere on the reels; enough of them trigger free spins or the bonus. One short is a near miss, teased on the last reel.","scatter-lit"),"sym-roles-help-multiplier":B("bank:symbols","Multiplier","Lands with an x value and flies into the win to multiply it. Without one in your set the machine draws its built-in orb.","mult"),"sym-roles-help-mystery":B("bank:symbols","Mystery","Blocks land, glow and turn over together into one symbol. Without one in your set the machine draws its built-in block.","mystery"),"sym-roles-help-collector":B("bank:symbols","Collector","Gathers the value of every cash coin on the reels into the win. Without one in your set the machine draws its built-in collector.","collector"),"sym-roles-help-bonus":B("bank:symbols","Bonus","Triggers the bonus. A machine without a scatter uses it as its scatter.","bonus"),"sym-roles-help-cash":B("bank:symbols","Cash coin","A coin with a value on the slot reels; a collector gathers them. Its art is the regular coin in Coins.","cash"),"coin-kinds-help-regular":B("bank:coins","Regular coin","Lands and locks with a value in Hold & Spin; on the slot reels it is the cash coin.","holdspin"),"coin-kinds-help-special":B("bank:coins","Special coins","Your own coins with a label and values, placed in the respins of a round."),"coin-kinds-help-jackpot":B("bank:coins","Jackpot coins","Mini, Minor and Major: collecting one wins its jackpot box; a full board wins the Grand.","jackpots"),"coin-kinds-help-empty":B("bank:coins","Empty cell","What a cell shows before a coin lands. Built-in: a dark socket."),"jp-art-names":B("bank:scene","Names on your box art","Writes each box's name on your uploaded art. Turn it off when your art already says GRAND, MAJOR and so on."),"m-beam-curve-arc":B("features","Simple arc beams","Each beam bows out in one smooth curve.","beam-collect"),"m-beam-curve-s":B("features","S-curve beams","Each beam swings out one way, then the other, like a whip.","s-curve"),"m-beam-bend":B("features","Beam bend","How far the beams bow out from a straight line.","beam-bend"),"m-beam-width":B("features","Beam thickness","How thick the trail is next to the head; Taper thins it towards the tail. It leaves the head alone. Thickness and Head size share their units: the same number makes the trail as thick as the head, a comet.","beam-width"),"m-beam-taper":B("features","Beam taper","How much the beams thin from the head back to the tail, like a comet. 0 keeps them even; 1 brings the tail to a point. After Effects gets the same taper on each beam's strokes (Stroke \u203A Taper \u203A Start Width).","beam-taper"),"m-beam-head":B("features", s to a gentle stop.","end-soft"),"spin-blur":B("spin","Motion blur","Smears the symbols while the reels spin fast.","blur"),"spin-speed":B("spin","Top speed","How fast the reels run in the middle of the spin.","speed"),"spin-mid":B("spin","Spin length","How long the reels run at full speed before stopping.","spin-length"),"spin-ss":B("spin","Start stagger","Delay between one reel starting and the next.","start-stagger"),"spin-st":B("spin","Stop stagger","Delay between one reel stopping and the next.","stop-stagger"),"spin-ant":B("spin","Anticipation time","Extra time a teased reel keeps spinning, slowly, before it lands.","antic-time"),"spin-ant-v":B("spin","Anticipation crawl speed","How fast a teased reel crawls while it builds suspense.","antic-crawl"),"spin-zoom-on":B("spin","Anticipation zoom","The camera pushes in on the teased reel, follows it from reel to reel and eases out after it lands.","zoom"),"spin-zoom":B("spin","Zoom amount","How far the camera pushes in on a teased reel.","zoom-amount"),"spin-scatter-lit":B("spin","Keep scatters lit through the tease","While a reel teases the others dim. Scatters that already landed stay lit and glowing over the dim until the teased reel lands; off, they pop and fade back into it.","scatter-lit"),"spin-stop-order":B("spin","Stop order","Which reel stops first. The tease goes to the reels that stop last.","stop-order"),"sec:wins/win-tiers":B("wins","Win tiers","Big win titles (BIG, MEGA, EPIC...), each from its threshold in bets. A big win shows the tier it reaches, or climbs through every tier on the way.","tiers"),"tier-titles-final":B("wins","Only the tier reached","A big win shows just the title of the tier it reaches: EPIC WIN straight away, with one count up and that tier's particles.","tier-titles"),"tier-titles-climb":B("wins","Climb through the tiers","The title starts at the first tier and steps up (BIG, MEGA, EPIC) each time the count passes a threshold, with a flash, a shake and the next tier's particles. The count runs longer, one stretch per tier.","tier-titles"),"wf-style-pop":B("wins","Pop in place","Winning symbols pulse where they are while the win counts.","winfx-pop"),"wf-style-jump":B("wins","Jump to score","Winning symbols fly into the win meter (or any spot you pick), each landing counting up the win.","winfx-jump"),"wf-style-merge":B("wins","Magnet merge","Winning symbols are pulled together and fuse into one big symbol that shows the win.","winfx-merge"),"wf-style-collect":B("wins","Beam to the pots","Every winner fires a saber beam up into its pot above the machine, one by one; each catch counts up the win and the pot's nameplate. Needs the pots on (Features).","beam-collect"),"wf-jpath-line":B("wins","Straight flight","Winners fly in a straight line.","path-line"),"wf-jpath-arc":B("wins","Arc flight","Winners are thrown up in an arc: off their cell at full speed, slowing over the top, then dropping fast into the score.","path-arc"),"wf-jpath-back":B("wins","Wind-up flight","Winners pull back first, then shoot off.","path-back"),"wf-arc":B("wins","Arc height","How high winners hop on the Arc path, in cells above the higher of their cell and where they land (a long flight goes a little higher). Low skims, high lobs. While the Wins tab is open the preview draws each winner's flight as a dashed line, so you can see it change. The same setting for jumping into the score and merging.","arc-height"),"wf-mpath-line":B("wins","Straight pull","Winners are pulled straight in.","merge-line"),"wf-mpath-arc":B("wins","Arc pull","Winners are thrown in on an arc: off their cell at full speed, slowing over the top, then dropping fast onto the pile.","merge-arc"),"wf-mpath-back":B("wins","Wind-up pull","Winners pull back, then snap in.","merge-back"),"wf-seq":B("wins","All at once or one by one","At 0 every winner is pulled in together; at 100 they come one by one and wait on the pile.","merge-seq"),"fx-lines-on":B("wins","Winning lines","Draws the payline through a line win. The winners light up either way.","lines"),"fx-pop":B("wins","Winning symbol pop","How much winning symbols grow when they pulse.","pop-size"),"fx-dim":B("wins","Dim other symbols","Darkens the symbols that are not part of the win so the winners stand out.","dim"),"sec:effects/win-particles":B("effects","Win particles","Coins, confetti and sparkles thrown by each win moment. Pick an explosion and a particle per moment.","particles"),"fx-shake":B("effects","Screen shake","How hard the screen shakes on landings, big wins and features.","shake"),"fx-land-shake":B("effects","Build-up shake","Every reel or cell that brings a winner lands with a bump that grows, and a note that climbs.","land-shake"),"fx-flash":B("effects","Flashes","White flashes on big moments.","flash"),"fx-rays":B("effects","Light rays","Rotating light rays behind big win titles and the wheel.","rays"),"fx-bokeh":B("effects","Background lights","Soft floating lights in the background.","bokeh"),"fx-line":B("effects","Payline glow","How strongly the paylines glow.","line-glow"),"w-landing-center":B("wheel","Centred landing","The wheel stops in the middle of the segment.","wheel-center"),"w-landing-random":B("wheel","Natural landing","The wheel stops anywhere inside the segment.","wheel-random"),"w-landing-tease":B("wheel","Edge tease","The wheel stops right next to the boundary, almost on the neighbour.","wheel-tease"),"w-landing-slip":B("wheel","Almost slips","The wheel creeps into the next peg, nearly tips over, rolls back, and the pointer springs past straight.","wheel-slip"),"w-pointer-top":B("wheel","Pointer on top","The pointer hangs at the top, pointing down.","pointer-top"),"w-pointer-bottom":B("wheel","Pointer at the bottom","The pointer stands at the bottom, pointing up.","pointer-bottom"),"w-framing-full":B("wheel","Whole wheel","The whole wheel on screen.","frame-full"),"w-framing-half":B("wheel","Top half","A bigger wheel with only its top half showing.","frame-half"),"w-framing-cl um.","wild-mult",["small","medium","big"]),"ri-mystery":B("round","Mystery symbols","Mystery blocks land, glow and turn over together into one symbol. On a win they sit on winners and reveal the winning symbol.","mystery",["none","small","medium","big"]),"ri-cash":B("round","Cash symbols","Coins that land carrying a value, in bets. On their own they just land; a collector takes them all.","cash",["none","small","medium","big","nearmiss","freespins","bonus"]),"ri-collector":B("round","Collector","A collector lands, on the last reel to stop when it can, and every cash value flies into it one by one, on top of the win.","collector",["none","small","medium","big","nearmiss","freespins","bonus"]),"ri-boost":B("round","Boosters","After the spin lands the pots charge up and fire beams at cells, one by one; each cell turns into a wild, a better symbol, a wild with an x value, or cash. On a win they make the win.","boost",["none","small","medium","big","nearmiss","freespins","bonus","wheel"]),"ri-pot-aim":B("round","Which pot fires or catches","This round only: the nearest pot, the pots in turn, or one pot.","pots-aim",["none","small","medium","big","nearmiss","freespins","bonus","wheel"]),"ri-mult":B("round","Multipliers","Multiplier symbols (bombs) land with the win, then fly into the total: the win is multiplied by their sum.","mult",["small","medium","big"]),"ri-extra-wilds":B("round","Extra wilds","More wilds land on the grid. On a losing spin they are placed so nothing pays.","extra-wilds",["none","small","medium","big","nearmiss","freespins","bonus"]),"ri-jackpot":B("round","Jackpot","After the round shows its win, a jackpot box lights up and what it shows flies down into the win meter, on top of the win. A box with its win title on takes the whole screen instead; with no win meter the amount lands in the middle of the reels.","jackpots",["none","nearmiss","small","medium","big","freespins","bonus","wheel"]),"ri-expand":B("round","Expanding wild","A wild in the win gr =========================================

1. Unzip this folder anywhere. Keep "${t}" next to the "assets" folder.
2. In After Effects (2026 or any CC version, Mac or Windows): File >
   Scripts > Run Script File... and pick "${t}". Do not double-click
   the .jsx: that opens it in another app.
3. The script builds one project folder per format (${o.join(", ")}).
   Open the main comp and press space to play.

On a Mac
- The script and the file names are plain ASCII, so the script reads the
  same on a Mac as on Windows.
- macOS asks before an app reads your Downloads, Desktop or Documents
  folder. If After Effects says the asset files were not found, allow it
  in System Settings > Privacy & Security > Files and Folders (or move
  the unzipped folder elsewhere), then run the script again.
- Fonts: install the fonts listed under Notes below (double-click a font
  file to install it with Font Book).

How the project is organised
Most of the animation is decided in Reel Studio (outcomes, timing, motion,
effects). The After Effects project is built so you can finish the look
there: every piece of art and every effect is a placeholder comp, the
timing lives in the round comps, and a few controls sit on SLOT CONTROL.

- Placeholder Comps/: the art and the effect looks, each built once. Every
  use in the animation is a layer of that comp, so replacing the art or
  animating inside a placeholder updates every use.
  - Symbols/: "Symbol 01 <name>" ... one comp per symbol (coins, the
    multiplier orb and the empty cell too). "Win 01 <name>" ... the
    symbol's win animation: it plays once from the start, then loops the
    tail; an uploaded PNG sequence or sprite sheet is laid out frame by
    frame. "Symbols Atlas" holds one symbol per frame for the reels.
  - Machine/: Background, Machine Back, Machine Frame, Marquee Lights (the
    bulbs blink inside it, faster during wins), Logo, Win Meter Panel,
    Vignette.
  - Effects/: FX Shockwave (a ring that grows and fades in 0.7 s), FX Light
    Rays and FX Small Rays (shape layers: wedges with a feathered mask that
    fades them out; change the fill to recolour them, or edit the paths),
    FX Cell Frame (win highlight), FX Anticipation,
    FX Tease Cell, FX Sticky Frame, FX Coin Lock, FX Special Coin Lock,
    FX Near Miss, FX Wild Beam, FX Collected, FX Mystery Glow, FX
    Collector Glow, FX Pot Glow, FX Boost Target, FX Boost Flash, FX Beam
    Head, FX Cell Shade, FX Jackpot Glow and FX Jackpot Fly Glow.
  - Pots/: "Pot 1 <name>" ... the art of each pot above the machine.
    Replace it with your own and every use follows.
  - Jackpots/: "Jackpot Grand", "Jackpot Major", "Jackpot Minor", "Jackpot
    Mini": each box's plate (or your own box art) with its name, at its size. The
    value is a text layer over it in the main comp.
  - Particles/: "Particle <name>" for each particle the win explosions
    throw (gold coin, stars, confetti, your own art...). A set of variants
    holds one per frame and each particle picks one; an animated particle
    holds its frames in order and each particle plays it from a random
    frame. Replace the art here and every explosion follows.
  - Titles/: "Title <tier>" for each title, with its light sweep, and its
    words as a "Text (editable)" layer in the Main Font, switched off: turn
    it on (and the art off) to change the words or their font.
  - Paylines/: "Payline NN", each drawing itself on.
  - Plaques/: the multiplier, prize and hold & spin plaques.
  - Wheel/: Wheel Disc (the turning part: your face art, Wheel Segments,
    an icon layer per segment icon and a text layer per label, and the hub
    with its centre icon when it turns), Wheel Hub, Wheel Center, Wheel
    Icon NN, Wheel Ring, Wheel Bulbs A and B, Wheel Pointer (its anchor is
    the pivot). Replace any of them with your art.
  - Counters/: "Counter Digits", the 0-9 strip every counter rolls
    through. Change its colour or style once and every counter follows.
  The Logo placeholder (a logo painted from the machine's name) and each
  Jackpot plate also hold their words as a text layer, switched off.

Effects and their controls
- Every effect placeholder (Effects/ and Titles/) has an "FX CONTROLS"
  null. Its sliders and switches drive every use of that effect:
  - "Size %" and "Opacity %": every use bigger, smaller, brighter, fainter.
  - "Colour": effect art is white and each use is tinted to its colour;
    untick it to keep your art's own colours ("FX Colour" on SLOT CONTROL
    does it for all effects at once).
  - "Speed %" (FX Shockwave): how fast the ring grows.
  - "Spin %" (rays): how fast the rays turn.
  - "Built-in Motion" (rays and titles): untick it when your art brings
    its own motion; the uses then stop spinning, popping and springing.
  - "Light Sweep" (titles): the sweep across the title.
- Swap an effect for a prerendered movie (a .mov with alpha, a PNG
  sequence...): open its placeholder, switch off or delete the art layer,
  and drop your movie in at 0:00. Every use starts it
  at the moment the effect happens: shockwave uses last 4 s, so a movie up
  to 4 s plays in full; frames and glows last as long as they show (set a
  looping movie to loop in Interpret Footage). Untick "Colour" for a
  coloured movie and "Built-in Motion" for one that moves by itself.
- Or swap the whole comp: select the uses and Alt-drag (Option-drag on a
  Mac) your own comp onto them in the timeline. Each use reads the
  controls of the comp it shows, so your comp can bring its own "FX
  CONTROLS" null (copy it from the placeholder); without one, the uses
  play it at 100%, untinted and moving by themselves. Nothing refers to the
  placeholder by name, so you can delete it.
- Particle explosions: replace the art in Particles/ and every explosion
  follows; to swap one explosion for a movie, open its comp in
  Rounds/Particles, switch its particle layers off and drop the movie in.

Full-screen wins in HD
- Titles, the logo and the particle art are painted twice the size they
  show, and their uses are scaled to 50% (or less): enlarge a title or a
  particle up to 200% and it stays sharp. The light rays are vector shapes
  in comps twice the size of their biggest use (nothing to ship, same
  sharpness). The counters are built at twice the size of the biggest
  amount, and the shockwave ring is drawn as big as its biggest use. A
  winning symbol that merges into a big one is drawn from its full-size
  art.
- Reels/: one precomp per reel (or per cell for per-cell spins). Each has a
  CTRL null with a "Spin" slider: its keyframes are the start, mid and end
  phases from Reel Studio, with the same speed and influence eases. Open the
  Graph Editor on that slider to reshape a start or a stop. The reel reads
  its symbols from Symbols Atlas as the slider rolls it, like an odometer
  wheel. Tumbling symbols are ordinary keyframed layers in the same
  precomps.
  - Hold and Spin/ (when the animation has coins): "Hold Cell C-R", one
    little reel of coins and empty cells per cell, on its own Spin slider,
    with the coin values on "Value" text layers.
- Rounds/: one comp per round that shows something. It places the
  placeholders in time: paylines, win comps on the winning cells, cell
  frames, shockwaves, expanding wilds, multipliers, titles, the wheel, coin
  landings and the collect. Move a layer to retime an effect.
  Mystery blocks turn over as "Mystery Block" then "Mystery Reveal"
  layers; the collector takes each cash value as a flying text layer.
  Boosters: "Boost Target" marks a cell in its pot's colour, "Boost From"
  trembles until the beam hits, the new symbol pops and "Boost Flash"
  bursts. Beams are "Beam Down n" (a pot firing) and "Beam Up n" (a
  winner beaming to its pot) shape layers: a Bezier path drawn on by Trim
  Paths, soft strokes in the pot's colour round a white core that thin to
  the tail (each stroke's Taper, After Effects 2020+: Start Width is the
  tail's width), a "Head" group with the white-hot ball, and a "Beam Head
  n" glow riding on the head. Edit the path to reshape a beam.
  A winner that beams to its pot darkens under a "Drained n" shade.
  A round that awards a jackpot sends its amount from the box down into
  the win meter (with no meter, into the middle of the reels, where it
  stays a moment) as a "Jackpot <tier> Win" text with a "Fly Glow". A box
  with its win title on takes the whole screen instead, like the Grand:
  "Title jp_major" (and so on) and a counter reading its own "MAJOR
  JACKPOT n CTRL" slider.
  While a cell is held (a sticky or walking wild, a mystery block turning,
  a booster landing) a "Sticky n" or "Reveal n" mask cuts it out of its
  reel.
  Winning symbols that jump into the score are "Jump <symbol>" layers and
  ones that merge are "Pull <symbol>" layers plus a "Merged <symbol>": their
  position, scale and opacity expressions hold the flight from Reel Studio
  (time, path, landing spot), so they move exactly as in the preview.
  - Particles/: every win explosion (small burst, fountain, rain, confetti
    cannons, fireworks...) is a comp of its own. Each layer is one
    particle: a use of its Particle placeholder whose position, rotation,
    scale and opacity expressions hold the exact flight it has in Reel
    Studio (gravity, air drag, flutter). Slide the comp to retime it.
    Long running emitters loop a 5 second cycle seamlessly: each particle's
    age wraps by the cycle, so extending the comp keeps them going.
- Counter Rigs/: the rolling money counters (win meter, big win amounts,
  the hold & spin collect, the grand). Each COUNTER CTRL > Value reads its
  source slider (WIN CTRL > Amount in a round comp, SLOT CONTROL in the
  main comp); key or pick-whip it to drive the counter yourself. Each
  column turns as the one below it wraps, like the Odometer plugin, so no
  plugin is needed.
- Sound/SFX: ${n?`every sound cue on its own audio layer at its time (${n} distinct clips in assets/sfx), named after the cue and its round and coloured by group: Reels blue, Wins green, Coins yellow, Big Win red, UI purple. The SFX MIX null holds the levels in dB: "Master" and one slider per group; every layer reads its two sliders. Mute, move or swap any cue layer; to change a sound everywhere it plays, select its file in Slot Assets/SFX and use File > Replace Footage.${s<0?` Master includes ${s} dB of headroom so the loudest moment stays below 0 dB (After Effects has no compressor).`:""}`:"sound was switched off in Reel Studio, so there are no sound cues."}
- Main comp: the machine, reels, sticky wilds and walking wilds (each step
  hops in from the reel it left), the tease ("Tease Dim Rn" over the
  other reels and a lit "Scatter Lands" copy of every scatter that
  lands), coin lock frames, logo, free spins ribbon, HUD texts, the win
  meter, the round comps, the flash and the SFX comp, with a marker where
  each round starts. With pots above the machine: each "Pot n" stands
  behind the frame with a "Charge Light" copy, squashing as it catches
  and kicking as it fires; over the frame its "Glow" and its nameplate
  ("Pot n Plate" and a counter reading the "Pot n" slider). With jackpot
  boxes: each "Jackpot <tier>" plate with a "Glow" behind it, a "Light"
  copy over it and a "Win Sweep" (CC Light Sweep), all popping and
  glowing by expressions when the box is won or its coin lands; its
  "Value" text reads the "Jackpot <tier>" slider, and a Shockwave plays at
  every win. SCREEN SHAKE is a
  parent null whose position expression holds the shake events. Ambient
  particles ("Ambient <template>") sit right above the background, and
  particles set to run to the end ("Rxx <template>") above the round
  comps. With the anticipation zoom on, a CAMERA null parents SCREEN SHAKE
  and the background: its position and scale expressions push in on the
  teased reel and ease back out.
- SLOT CONTROL (main comp):
  - "Meter", "FS Total" (and "Collect" with Hold & Spin, "Pot 1" to "Pot 3"
    with pots) drive the counters.
  - "Jackpot Grand" ... "Jackpot Mini" (with jackpot boxes): what each box
    shows. Its expression holds the seed, the growth per second and every
    win (when, and what it paid); edit them there, or replace the
    expression with your own keyframes and the value text follows.
  - "Shake %", "Flash %", "Dim %", "Particles %" (thins every explosion
    out), "Spin Blur %" (the reels' up-and-down blur), "Win Pop %", "Zoom %"
    (the anticipation zoom) and "Glow %" (every glow at once; each glow
    keeps its art on top) scale those effects; 100 is what Reel Studio
    showed.
  - "FX Colour": tints the effect placeholders (see above).
- The wheel game has no machine layers: just the background, the wheel and
  its prizes, one round comp per spin handing the wheel to the next.

Transparency
- ${a?"Background and Vignette are switched off in this build.":"Switch off the Background and Vignette layers in the main comp."}
  Then Composition > Add to Render Queue, Output Module: QuickTime, Apple
  ProRes 4444, Channels: RGB + Alpha. That gives a transparent MOV.

Notes
- Fonts: text layers ask for ${i}. Install them (Google Fonts, or the
  files in fonts/). Every text layer takes its font from the "Fonts" comp
  (in Slot Assets): pick another font on its "Main Font" layer (or "Wheel
  Font" for the wheel labels) and all the text follows (After Effects 2020
  or later; older versions keep the font each layer was built with).
- Reel curvature and bloom are preview-only effects; the AE reels are flat.
- assets/ holds only the art and sounds this animation uses, and each
